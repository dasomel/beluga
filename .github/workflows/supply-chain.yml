# CI-006: supply-chain policy gate. Beluga does not build/vendor binaries and its
# SBOM (scripts/generate-sbom.sh) scans a *live cluster's* running images, so it
# cannot run in a stateless GitHub Actions runner — this workflow instead
# enforces the following static supply-chain contracts:
# a version single source of truth (VERSIONS.md), no floating "latest" image tags in
# the shipped Helm values, and Dependabot coverage for the one real third-party
# dependency surface this repo has (pinned GitHub Actions).
name: Supply chain

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency update automation present
        run: test -f .github/dependabot.yml

      - name: Version single source of truth present
        run: test -f VERSIONS.md

      - name: No floating/missing image tags in Helm charts
        shell: bash
        run: |
          set -euo pipefail
          # 이슈 #103: values.yaml 기본값뿐 아니라 templates/에 하드코딩된 image:도
          # 검사 대상이다. ":latest", 태그 완전 누락, "nightly-*" 를 뜬(floating) 태그로
          # 본다. "python:3.12-slim"처럼 태그 자체가 버전 정보를 담은 값은 정상 고정
          # 태그이므로 대상이 아니다(콜론 뒤에 값이 있으므로 세 번째 alternative에 안 걸림).
          # allowlist: .github/image-tag-allowlist.txt (고정 문자열, grep -F 매칭,
          # "#" 주석/빈 줄 무시)에서 예외를 읽는다. 신규 nightly/latest/미지정 태그는
          # 그 파일에 추가되지 않는 한 게이트에서 차단된다(fail-closed) — 새 이미지를
          # nightly로 추가하려면 그 파일에 명시적으로 한 줄 올릴 것.
          # fail-closed: 파일이 없거나 유효 항목이 0개여도(주석/빈 줄만 있어도) 게이트는
          # 건너뛰지 않고 계속 실행되며, 그 경우 예외 없이 모든 뜬 태그를 차단한다.
          # 이슈 #103: 항목을 하나의 인자로 grep -F에 넘기면 (1) 그 문자열이 RAW_HITS의
          # "path:lineno:content" 줄 어디에든 부분 매칭되어 ".yaml"/":"/"image:"/
          # "gitops"처럼 짧은 값이 모든 hit을 지워버리고, (2) "-v"처럼 "-"로 시작하는
          # 항목이 grep 옵션으로 오해석되어 에러가 나고 `|| true`에 삼켜지는 두 가지
          # fail-open 결함이 있었다. 그래서 각 항목을 (a) 파일로 넘겨 grep -F -f로
          # 매칭해 옵션 오해석을 원천 차단하고, (b) 사용 전에 "registry/path:tag" 전체
          # 형태(슬래시 포함, ":<tag>"로 종료, 공백 없음)인지 검증해 부분 문자열이
          # 조용히 통과하지 못하게 한다 — 검증에 실패하면 게이트를 건너뛰지 않고 빌드를
          # 실패시킨다.
          ALLOWLIST_FILE=".github/image-tag-allowlist.txt"
          PATTERN='image:\s*"?[^"[:space:]]*:latest"?|tag:\s*"?latest"?|image:\s*"?[^"[:space:]]*:nightly-[A-Za-z0-9._-]+"?|image:\s*"?[A-Za-z0-9._/-]+"?[[:space:]]*(#.*)?$'
          RAW_HITS="$(grep -RInE "$PATTERN" gitops/charts --include='*.yaml' || true)"

          ALLOWLIST_TMP="$(mktemp)"
          trap 'rm -f "$ALLOWLIST_TMP"' EXIT
          if [ -f "$ALLOWLIST_FILE" ]; then
            # 주석 줄("#")과 빈 줄을 제외하고, 각 줄의 후행 공백을 제거해 임시 파일에 쓴다.
            sed -E 's/[[:space:]]+$//' "$ALLOWLIST_FILE" \
              | grep -vE '^[[:space:]]*(#|$)' > "$ALLOWLIST_TMP" || true
          fi

          # 유효성 검증: grep -F substring 오매칭(위 이슈 #103 참고)을 막기 위해 각
          # 항목은 "registry/path:tag" 형태의 완전한 이미지 참조여야 한다 — "/"를
          # 최소 한 번 포함하고, ":<tag>"로 끝나며(태그 자체에는 "/"가 없어야 함),
          # 공백을 포함하지 않는다. ".yaml", ":", "image:", "gitops", "-v" 같은 값은
          # 이 형태가 아니므로 무시되지 않고 빌드를 실패시켜 문제 항목을 알린다.
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            if ! printf '%s' "$entry" | grep -qE '^[^[:space:]]+/[^[:space:]]+:[^[:space:]/]+$'; then
              echo "invalid entry in $ALLOWLIST_FILE: '$entry' (must be a full registry/path:tag image reference, no whitespace)" >&2
              exit 1
            fi
          done < "$ALLOWLIST_TMP"

          if [ -n "$RAW_HITS" ] && [ -s "$ALLOWLIST_TMP" ]; then
            HITS="$(printf '%s\n' "$RAW_HITS" | grep -vF -f "$ALLOWLIST_TMP" || true)"
          else
            HITS="$RAW_HITS"
          fi
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "floating/missing image tag found in Helm charts — pin an explicit version"
            exit 1
          fi
          echo "no floating :latest / nightly-* / missing image tags in Helm charts"

      - name: GitHub Actions are pinned to a commit SHA
        shell: bash
        run: |
          set -euo pipefail
          # Matches "uses: owner/repo@<ref>" and flags anything that is not a
          # 40-char commit SHA (mutable tags/branches are not a security identity).
          if grep -RhoE 'uses:\s*[^@]+@[A-Za-z0-9._-]+' .github/workflows \
              | sed -E 's/^uses:\s*//' \
              | grep -vE '@[0-9a-f]{40}$'; then
            echo "unpinned action reference found above — pin to a commit SHA"
            exit 1
          fi
          echo "all workflow actions are pinned to commit SHAs"
