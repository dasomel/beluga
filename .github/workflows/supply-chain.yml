# CI-006: supply-chain policy gate. Beluga does not build/vendor binaries and its
# SBOM (scripts/generate-sbom.sh) scans a *live cluster's* running images, so it
# cannot run in a stateless GitHub Actions runner — this workflow instead
# enforces the static supply-chain contracts docs/supply-chain.md requires:
# a version single source of truth, no floating "latest" image tags in the
# shipped Helm values, and Dependabot coverage for the one real third-party
# dependency surface this repo has (pinned GitHub Actions).
name: Supply chain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dependency update automation present
        run: test -f .github/dependabot.yml

      - name: Version single source of truth present
        run: test -f VERSIONS.md

      - name: No floating "latest" image tags in shipped Helm values
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'image:\s*".*:latest"|tag:\s*"?latest"?' gitops/charts --include='values.yaml'; then
            echo "floating :latest tag found in Helm values — pin an explicit version (see docs/supply-chain.md)"
            exit 1
          fi
          echo "no floating :latest tags in Helm values"

      - name: GitHub Actions are pinned to a commit SHA
        shell: bash
        run: |
          set -euo pipefail
          # Matches "uses: owner/repo@<ref>" and flags anything that is not a
          # 40-char commit SHA (mutable tags/branches are not a security identity).
          if grep -RhoE 'uses:\s*[^@]+@[A-Za-z0-9._-]+' .github/workflows \
              | sed -E 's/^uses:\s*//' \
              | grep -vE '@[0-9a-f]{40}$'; then
            echo "unpinned action reference found above — pin to a commit SHA (docs/ci-security.md #3)"
            exit 1
          fi
          echo "all workflow actions are pinned to commit SHAs"
