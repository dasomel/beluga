name: Research evidence

# D4: Path filtering avoids slowing unrelated PRs. Other changes do not run
# this gate automatically; run make research-check manually when needed.
on:
  push:
    paths:
      - 'research/**'
      - 'scripts/research/**'
      - 'manager/research/**'
      - 'manager/scripts/research/**'
  pull_request:
    paths:
      - 'research/**'
      - 'scripts/research/**'
      - 'manager/research/**'
      - 'manager/scripts/research/**'

permissions:
  contents: read

jobs:
  research-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python3 -m pip install --require-hashes -r requirements-research.txt
      - name: Validate research evidence
        run: make research-check
      # D-MONO-4: manager/ keeps its own evidence ledger after the monorepo import;
      # validate it here with the same hashed validator install instead of a separate workflow.
      - name: Validate manager research evidence
        working-directory: manager
        run: make research-check
