# SEC-004: static analysis / SAST equivalent for a Vagrant/K8s IaC repo with no
# application source code. There is no Dockerfile in this repo (components run
# unmodified upstream images pulled at deploy time — see NOTICE), so container
# image scanning is not applicable here; scripts/generate-sbom.sh already
# covers live-cluster image scanning as a manual/operational command. What CI
# *can* statically scan is the IaC itself: Trivy's `config` scanner for
# Kubernetes/Helm misconfigurations across gitops/, plus a repo-wide secret
# scan as a second, independent check against the no-committed-credentials
# rule in SECURITY.md / ADR-0002.
name: SAST (IaC + secrets)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # D3(2026-09-08, docs/mistakes-log.md): CRITICAL만 게이트로 남긴다. 나머지
      # 101건의 HIGH(KSV-0014 readOnlyRootFilesystem 누락, KSV-0118 기본
      # securityContext, KSV-0109 analytics 네임스페이스 ConfigMap 비밀값 등)는
      # 실클러스터 검증 없이 일괄 수정하면 파드가 깨질 위험이 있는 실제 하드닝
      # 부채라 즉시 차단하지 않고, 아래 별도 스텝에서 비차단으로 계속 노출한다.
      # 추적 이슈: #117.
      - name: Trivy IaC misconfiguration scan — CRITICAL (blocking, gitops/)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: config
          scan-ref: gitops
          severity: CRITICAL
          exit-code: 1
          # KSV-0041(apisix-ingress-controller의 읽기 전용 secrets 접근, TLS 동기화에
          # 필수)만 범위를 좁혀 예외 처리 — 근거는 .trivyignore.yaml 참조.
          trivyignores: .trivyignore.yaml

      - name: Trivy IaC misconfiguration scan — HIGH (non-blocking, visibility only, gitops/)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: config
          scan-ref: gitops
          severity: HIGH
          exit-code: 0
          format: table

  trivy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Trivy secret scan (full repo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: 1
