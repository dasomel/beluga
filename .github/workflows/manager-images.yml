# Rollout 2b-1 (ADR-0009): build the Manager container images and publish them to GHCR.
# Path-filtered like manager-ci.yml; the build context is manager/ (npm workspace root)
# and each Dockerfile is packages/<name>/Dockerfile, matching manager/compose.yaml.
#
# Tags: sha-<full 40-char commit SHA> only. No "latest" (supply-chain policy); charts must
# pin the image by the digest printed in the job summary, not by tag.
# Platforms: linux/amd64 (Kakao Cloud / VirtualBox nodes) + linux/arm64 (VMware Fusion on
# Apple silicon, see docs/development-en.md). PRs build amd64 only and never push.
# Provenance and SBOM attestations are generated by buildx (provenance: mode=max, sbom: true).
# The package visibility must be set to public once by the owner after the first publish.
name: Manager Images

on:
  push:
    branches: [main]
    paths:
      - 'manager/**'
      - '.github/workflows/manager-images.yml'
  pull_request:
    paths:
      - 'manager/**'
      - '.github/workflows/manager-images.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }} (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [domain-api, web]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (Dockerfile regression check)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: manager
          file: manager/packages/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false

  publish:
    name: Publish ${{ matrix.image }} to GHCR
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [domain-api, web]
    env:
      IMAGE: ghcr.io/dasomel/beluga-manager-${{ matrix.image }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: manager
          file: manager/packages/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Summarize digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "- tag: \`sha-${GITHUB_SHA}\`"
            echo "- digest (pin charts by this): \`${DIGEST}\`"
            echo "- reference: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
