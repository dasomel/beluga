# `make lint`/`make validate` run the real gates — this workflow only sets up
# toolchains and invokes them, so CI and local development never drift apart.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: shellcheck + helm lint
        run: make lint

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Issue #100: full history so the license change gate can `git show origin/<base>:VERSIONS.md`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Install PyYAML
        run: pip install --quiet --require-hashes -r requirements-ci.txt

      # D107 (issue #107): test 14 diffs policies/ recompiled by the policy compiler against the
      # committed artifacts; a missing compiler used to only warn ("false-green"), so CI=true
      # now fails closed. D-MONO-2: the compiler lives in manager/ of this repo, so the former
      # pinned beluga-manager checkout is gone — compiler and artifacts change atomically in
      # one PR and can no longer drift apart (the old pin had drifted 96 commits).
      - name: Install Node (manager policy compiler seam)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install manager dependencies (policy compiler seam)
        working-directory: manager
        run: npm ci

      - name: helm template render + YAML syntax validation
        env:
          BELUGA_MANAGER_DIR: ${{ github.workspace }}/manager
          # Empty on push (no PR base): the license gate then skips comparison and says so.
          LICENSE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          # D103: Freeze the ratchet at the PR event's base commit; full history above
          # costs a larger checkout. Use a new PR event to advance this comparison.
          # Empty on push, where there is no PR baseline.
          PIN_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: make validate
