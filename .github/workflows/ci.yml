# `make lint`/`make validate` run the real gates — this workflow only sets up
# toolchains and invokes them, so CI and local development never drift apart.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: shellcheck + helm lint
        run: make lint

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Issue #100: full history so the license change gate can `git show origin/<base>:VERSIONS.md`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Install PyYAML
        run: pip install --quiet --require-hashes -r requirements-ci.txt

      # D107 (issue #107): test 14 diffs beluga/policies/ recompiled by beluga-manager's policyctl
      # against the committed artifacts. Before PR #145, a missing sibling checkout only warned
      # and still passed ("false-green"); CI now checks out the compiler at a pinned revision.
      # Pinned to
      # beluga-manager PR #78 merge @ a63db0b1def2cd6d95a0a5f1669c1a108d40d419 (logins.yaml loader)
      # so policyctl can compile the optional PostgreSQL LOGIN/CONNECT declaration. Keep the pin
      # revision-bound so an unrelated beluga-manager change can't silently break this seam.
      # Bump this SHA deliberately when the policy compiler contract changes.
      - name: Checkout beluga-manager (pinned, policy compiler seam)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dasomel/beluga-manager
          ref: a63db0b1def2cd6d95a0a5f1669c1a108d40d419
          path: .ci-beluga-manager-seam
          persist-credentials: false

      - name: Install Node (beluga-manager policy compiler seam)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install beluga-manager dependencies (policy compiler seam)
        working-directory: .ci-beluga-manager-seam
        run: npm ci

      - name: helm template render + YAML syntax validation
        env:
          BELUGA_MANAGER_DIR: ${{ github.workspace }}/.ci-beluga-manager-seam
          # Empty on push (no PR base): the license gate then skips comparison and says so.
          LICENSE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          # Empty on push; PRs compare the image digest baseline with the base branch.
          PIN_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: make validate
