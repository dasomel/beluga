version: 2
updates:
  # Beluga has no application package manifest (npm/pip/cargo) at root — it is a
  # Vagrant/K8s IaC + GitOps platform. The github-actions ecosystem keeps pinned Action
  # revisions in .github/workflows/ current and patched; the manager/ npm workspace
  # (D-MONO-1) is the only other dependency surface.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # 이슈 #103: 새 릴리스를 호환된다는 이유만으로 즉시 채택하지 않는다 —
    # 공급망 오염(예: 2026-08 Rust 사건)은 발행 직후 창에서 유입되므로
    # 14일 냉각 후에만 갱신 PR을 연다. 보안 패치는 cooldown을 우회하지 않으므로
    # 긴급 시 수동 PR + 리뷰로 처리한다.
    cooldown:
      default-days: 14

  # D-MONO-1: the control plane (manager/) is an npm workspace with its own lockfile.
  - package-ecosystem: "npm"
    directory: "/manager"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # 이슈 #47(beluga-manager) / #103: 새 릴리스를 호환된다는 이유만으로 즉시 채택하지 않는다 —
    # 공급망 오염(예: 2026-08 Rust 사건)은 발행 직후 창에서 유입되므로
    # 14일 냉각 후에만 갱신 PR을 연다. 보안 패치는 cooldown을 우회하지 않으므로
    # 긴급 시 수동 PR + 리뷰로 처리한다.
    cooldown:
      default-days: 14

  # 이슈 #103: Dockerfile 베이스 이미지는 태그@digest로 고정한다. dependabot docker가 태그와
  # digest를 함께 갱신한다. 동일 14일 냉각 정책.
  - package-ecosystem: "docker"
    directory: "/demo/clickstream-gen"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14

  - package-ecosystem: "docker"
    directory: "/manager/packages/domain-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14

  - package-ecosystem: "docker"
    directory: "/manager/packages/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
