# Override for compose.yaml: point domain-api at the `mock-upstreams` fake (DUMMY data, DUMMY token).
#   docker compose -f compose.yaml -f compose.upstreams.yaml --profile upstreams up --build --wait -d
#   docker compose -f compose.yaml -f compose.upstreams.yaml --profile upstreams down --remove-orphans
# Use it together with `--profile upstreams` (that profile is what starts the mock). `make dev-up` ignores this
# file, so the default stack is unchanged. The fake proves adapter wiring only, not real upstream behaviour.
services:
  domain-api:
    environment:
      BELUGA_FLINK_REST_URL: "http://mock-upstreams:8781"
      BELUGA_TRINO_ENABLED: "true"
      BELUGA_TRINO_BASE_URL: "http://mock-upstreams:8780"
      BELUGA_TRINO_TOKEN: "dev-dummy-token"
      BELUGA_TRINO_HISTORY_ACK: "shared-service-credential"
      BELUGA_LAKEKEEPER_ENABLED: "true"
      BELUGA_LAKEKEEPER_BASE_URL: "http://mock-upstreams:8782"
      BELUGA_LAKEKEEPER_WAREHOUSES: "beluga_lake"
      BELUGA_LAKEKEEPER_TOKEN: "dev-dummy-token"
      # The compose service name is not loopback, so the adapters refuse a bearer token over plain http without this.
      BELUGA_UPSTREAM_ALLOW_INSECURE_BEARER: "true"
    depends_on:
      mock-upstreams:
        condition: service_healthy
