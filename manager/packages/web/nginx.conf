# Installed as an nginx image *template* (see Dockerfile): the entrypoint runs envsubst over
# /etc/nginx/templates/*.template, filtered to CSP_* variables (NGINX_ENVSUBST_FILTER), so the
# connect-src placeholder below is filled from the container environment at start, after
# docker/15-validate-csp-connect-src.sh has checked it. Do not use this as a plain nginx.conf.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # D-MLOGIN-4 (ADR-0009 D-MSSO-6): security headers for a SPA that now holds bearer tokens.
    # `always` so error responses carry them too. These add_header lines sit at server level and
    # no location below defines its own add_header (a location-level add_header would silently
    # drop every inherited one).
    #
    # CSP connect-src is the only part that depends on deployment: the SPA fetches the OIDC
    # discovery document and token endpoint from the issuer and calls the Domain API at
    # apiBaseUrl, both read at runtime from /config.json. nginx cannot read that file, so
    # the CSP_CONNECT_SRC variable repeats those origins (space separated, e.g.
    # "'self' https://sso.local.beluga.internal https://api.example"). Cost: two places to keep
    # in step; a mismatch shows up as a blocked request in the browser console, not as a silent
    # bypass. Escape hatch: generate this value from config.json in a /docker-entrypoint.d script.
    # script-src allows only the single inline theme bootstrap in index.html by hash
    # (guarded by src/securityHeaders.test.ts) instead of 'unsafe-inline', so an injected
    # script cannot run and read the in-memory token.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-nX43cX1qPw6d+hz24hnXGFP+Yr9Lgu9eFzFUWmmtPfA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src ${CSP_CONNECT_SRC}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # The OIDC callback URL carries ?code=...&state=... until the SPA rewrites it; never leak
    # it to the Google Fonts requests or any outbound link through Referer.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The SPA switches views via useState, so the only real client-side path is the OIDC
    # redirect target /auth/callback (config.json oidc.redirectPath, default). It has no file,
    # so the generic fallback below serves index.html and AuthProvider handles the callback by
    # location.pathname. Keep this fallback; an exact `location = /auth/callback` is unnecessary.
    location / {
        try_files $uri /index.html;
    }
}
