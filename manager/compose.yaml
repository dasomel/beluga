# Local development stack: Domain API + web console.
# Works with `docker compose` and `podman compose` (no engine-specific extensions).
#   make dev-up      # build + start, wait for healthchecks (stub adapters only)
#   make dev-down    # stop and remove
# Fixture data only: no Beluga platform, credentials, or secrets are involved.
#
# Optional profile `upstreams`: a fake Flink/Trino/Lakekeeper (packages/domain-api/dev/mock-upstreams.mjs, DUMMY data and the
# DUMMY token `dev-dummy-token`) to exercise the opt-in upstream adapters without a cluster. The profile only
# starts the fake; compose.upstreams.yaml points domain-api at it:
#   docker compose -f compose.yaml -f compose.upstreams.yaml --profile upstreams up --build --wait -d
# Never point the fake at, or reuse its token with, real services.
name: beluga-manager-dev

services:
  domain-api:
    build:
      context: .
      dockerfile: packages/domain-api/Dockerfile
    image: beluga-manager-domain-api:dev
    # Default: stub adapter registry and fixtures. The upstream adapters (BELUGA_FLINK_* / BELUGA_TRINO_* /
    # BELUGA_LAKEKEEPER_*) are opt-in and default off; they are enabled only by compose.upstreams.yaml here.
    environment:
      PORT: "8787"
      # The image defaults to NODE_ENV=production, which refuses AUTH_MODE=disabled (fail-closed). This local stack
      # has no identity provider, so it opts into development mode explicitly. Loopback publish only.
      NODE_ENV: development
      AUTH_MODE: disabled
    ports:
      # Published on loopback only. Host port 8787 must match web's public/config.json.
      - "127.0.0.1:8787:8787"
    user: "node"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    image: beluga-manager-web:dev
    depends_on:
      domain-api:
        condition: service_healthy
    ports:
      # Host port 5180 is the only origin the Domain API's CORS config allows.
      - "127.0.0.1:5180:80"
    environment:
      # Must equal public/config.json apiBaseUrl: the SPA calls the Domain API cross-origin, so the CSP must allow it.
      CSP_CONNECT_SRC: "'self' http://localhost:8787"
    # nginx runs unprivileged (uid 101); it only needs writable cache/pid dirs.
    user: "101:101"
    read_only: true
    # mode=1777, not uid=101: Podman rejects the uid/gid tmpfs options ("unknown mount option"), while mode works
    # on both engines. The sticky, world-writable tmpfs lives only inside this single-user container.
    tmpfs:
      # The entrypoint renders nginx.conf (CSP, security headers, SPA fallback) into conf.d; without a writable
      # conf.d it logs "not writable" and nginx silently serves the stock default.conf (the cluster mounts an
      # emptyDir here, templates/manager.yaml). The tmpfs also hides that stock file.
      - /etc/nginx/conf.d:mode=1777
      - /var/cache/nginx:mode=1777
      - /run:mode=1777
      - /tmp:mode=1777
    # nginx binds :80 as uid 101 with no capabilities. Docker already sets this namespaced sysctl to 0; Podman
    # keeps the kernel default (1024) and the bind fails with EACCES.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /auth/callback only answers 200 through nginx.conf's SPA fallback (the stock config returns 404), so this
      # also proves the rendered config, not just "some nginx", is serving.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/auth/callback"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # Fake upstreams for the Domain API's opt-in read-only adapters. DUMMY data, DUMMY token, GET only.
  # Reachable only on the compose network (no published port). Same pinned node image as the domain-api Dockerfile.
  mock-upstreams:
    profiles: ["upstreams"]
    image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    command: ["node", "/app/packages/domain-api/dev/mock-upstreams.mjs"]
    environment:
      # Must listen on the container interface so domain-api can reach it; nothing is published to the host.
      MOCK_UPSTREAMS_HOST: "0.0.0.0"
    volumes:
      # Same relative layout as the repo so the script finds the recorded Flink fixtures by path.
      - ./packages/domain-api/dev:/app/packages/domain-api/dev:ro
      - ./packages/domain-api/tests/fixtures/flink-1.20:/app/packages/domain-api/tests/fixtures/flink-1.20:ro
    expose:
      - "8780"
      - "8781"
      - "8782"
    user: "node"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8781/overview').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
