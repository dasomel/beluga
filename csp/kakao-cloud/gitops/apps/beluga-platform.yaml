# Kakao Cloud 변형: gitops/apps/beluga-platform.yaml 과 helm.valueFiles 만 다르다
# (tests/19-kakao-overlay-static.sh 가 이 동치를 검증한다 — 기본 Application을 바꾸면 여기도 맞춘다).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beluga-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dasomel/beluga.git
    targetRevision: HEAD
    path: gitops/charts/beluga-platform
    helm:
      valueFiles:
        - values.yaml
        - values-kakao.yaml
        - ../../values/sso.yaml
        - ../../values/domain-kakao.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # 이슈 #366b(라이브 실측): victoria-metrics StatefulSet의 volumeClaimTemplates도 API 서버가
  # apiVersion/kind/volumeMode/status를 채워 SSA 비교에서 영구 OutOfSync가 된다 — beluga-data의
  # SeaweedFS와 같은 원인·같은 처방(gitops/apps/beluga-data.yaml). 기본값으로 채워지는 필드만 제외한다.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
        - .spec.volumeClaimTemplates[]?.status
