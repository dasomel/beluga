resources:
  - resource: lake.events_enriched
    classification: internal
    grants:
      - roles: [beluga-analyst]
        privileges: [select]
      - roles: [beluga-engineer]
        privileges: [select, insert, update, delete]
  - resource: lake.orders
    classification: internal
    grants:
      - roles: [beluga-analyst]
        privileges: [select]
      - roles: [beluga-engineer]
        privileges: [select, insert, update, delete]
  - resource: lake.customers
    classification: pii
    sensitiveColumns: [email]
    grants:
      - roles: [beluga-engineer]
        privileges: [select, insert, update, delete]
        allowUnmasked: true
