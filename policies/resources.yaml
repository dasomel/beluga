resources:
  - resource: lake.events_enriched
    classification: internal
    grants:
      - roles: [analysts]
        privileges: [select]
      - roles: [engineers]
        privileges: [select, insert, update, delete]
  - resource: lake.orders
    classification: internal
    grants:
      - roles: [analysts]
        privileges: [select]
      - roles: [engineers]
        privileges: [select, insert, update, delete]
      - roles: [transformers]
        privileges: [select]
  - resource: lake.customers
    classification: pii
    sensitiveColumns: [email]
    grants:
      - roles: [engineers]
        privileges: [select, insert, update, delete]
        allowUnmasked: true

  - resource: public.orders
    engine: postgres
    classification: internal
    grants:
      - roles: [analysts]
        privileges: [select]
      - roles: [engineers]
        privileges: [select, insert, update, delete]

  - resource: public.customers
    engine: postgres
    classification: pii
    sensitiveColumns: [email]
    grants:
      - roles: [engineers]
        privileges: [select, insert, update, delete]
        allowUnmasked: true

# D-DBT-3: exact output schemas; lake remains a read-only, table-scoped source.
schemaGrants:
  - catalog: iceberg
    schemas: [silver_shop, gold_shop]
    roles: [transformers]
    operations:
      [
        CreateSchema, CreateTable, DropTable, RenameTable, SetTableProperties,
        InsertIntoTable, DeleteFromTable, SelectFromColumns,
        CreateView, DropView, CreateViewWithSelectFromColumns,
        ShowTables, ShowColumns, ShowCreateTable, FilterTables, FilterColumns, FilterSchemas,
      ]

# D-MAINT-2: exact table AND procedure allowlists; never imply data privileges.
# Cost: table inventory upkeep; escape hatch: separately reviewed explicit additions.
procedureGrants:
  - catalog: iceberg
    tables: [lake.orders, lake.customers, lake.events_enriched, silver_shop.orders, gold_shop.daily_revenue]
    procedures: [optimize, expire_snapshots]
    roles: [maintainers]
