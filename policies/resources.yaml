resources:
  - resource: lake.events_enriched
    classification: internal
    grants:
      - roles: [analysts]
        privileges: [select]
      - roles: [engineers]
        privileges: [select, insert, update, delete]
  - resource: lake.orders
    classification: internal
    grants:
      - roles: [analysts]
        privileges: [select]
      - roles: [engineers]
        privileges: [select, insert, update, delete]
  - resource: lake.customers
    classification: pii
    sensitiveColumns: [email]
    grants:
      - roles: [engineers]
        privileges: [select, insert, update, delete]
        allowUnmasked: true

  - resource: public.orders
    engine: postgres
    classification: internal
    grants:
      - roles: [analysts]
        privileges: [select]
      - roles: [engineers]
        privileges: [select, insert, update, delete]

  - resource: public.customers
    engine: postgres
    classification: pii
    sensitiveColumns: [email]
    grants:
      - roles: [engineers]
        privileges: [select, insert, update, delete]
        allowUnmasked: true
