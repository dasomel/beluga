# Beluga Single Sign-On (SSO) Declarative Configuration
# D-SSO-1: Single declarative source for gateway and application OIDC configuration (narwhal pattern).
# Reason: Centralize all SSO/OIDC endpoint metadata so manager and GitOps share a single contract;
# Cost: Must be passed via -f gitops/values/sso.yaml or helm.valueFiles;
# Escape hatch: Set mode=none per endpoint to bypass authentication.

sso:
  realm: "beluga"
  # D-DOM-2: 이 파일은 도메인을 선언하지 않는다. host/issuerHost는 라벨이고 FQDN은
  # <label>.<baseDomain>(차트 values의 baseDomain, Kakao는 gitops/values/domain-kakao.yaml)으로 조립된다.
  # issuer는 https://<issuerHost>.<baseDomain>/realms/<realm> 으로 파생한다(필드 없음).
  # 점이 든 값은 차트(beluga.ssoHost)와 manager 스키마가 거부한다.
  # issuerHost는 반드시 "sso": 차트는 이 값을 읽지 않고 Keycloak을 sso.<baseDomain>으로 고정 사용하므로
  # manager와의 정합을 scripts/ci/check-gateway-sso.py가 단언한다.
  issuerHost: "sso"

  # Per-endpoint SSO configuration
  # mode:
  #   - gateway-oidc: APISIX enforces openid-connect plugin at the gateway (for UIs without native auth)
  #   - app-oidc: Application handles OIDC natively (Keycloak client configured)
  #   - none: No authentication enforced at gateway or app
  #
  # allowedGroups (optional, gateway-oidc only; D-MSSO-14):
  #   Keycloak groups ([a-z0-9-]) allowed through the gateway. Absent = no group check (authenticated
  #   users of any group pass). When set, APISIX answers 403 unless the user's `groups` claim contains one
  #   of them; it must include `admins` (anti lock-out) and every entry must exist in policies/groups.yaml.
  #   Known limit: the gateway session caches userinfo, so removing a user from a group takes effect only
  #   when the session ends (absolute_timeout 3600 s on routes that set allowedGroups).
  #   catalog-ui is deliberately left without the field (owner decision 2026-10-17: locked, current behavior).
  endpoints:
    - name: flink
      host: "flink"
      mode: "gateway-oidc"
      clientId: "apisix-gateway"
      allowedGroups:
        - "admins"
        - "engineers"
      protectedPathPrefixes:
        - "/*"
      bypassPathPrefixes: []
      redirectPath: "/.apisix/redirect"
      logoutPath: "/logout"

    - name: filer
      host: "filer"
      mode: "gateway-oidc"
      clientId: "apisix-gateway"
      allowedGroups:
        - "admins"
        - "engineers"
      protectedPathPrefixes:
        - "/*"
      bypassPathPrefixes: []
      redirectPath: "/.apisix/redirect"
      logoutPath: "/logout"

    - name: catalog-ui
      host: "catalog"
      mode: "gateway-oidc"
      clientId: "apisix-gateway"
      protectedPathPrefixes:
        - "/*"
      bypassPathPrefixes: []
      redirectPath: "/.apisix/redirect"
      logoutPath: "/logout"

    - name: catalog-api
      host: "catalog"
      mode: "none"
      clientId: ""
      protectedPathPrefixes: []
      bypassPathPrefixes:
        - "/catalog/*"
        - "/management/*"
        - "/health"
        - "/v1/*"
      redirectPath: ""

    - name: argocd
      host: "argocd"
      mode: "app-oidc"
      clientId: "argocd"
      protectedPathPrefixes:
        - "/"
      bypassPathPrefixes: []
      redirectPath: "/auth/callback"

    # ADR-0009 D-MSSO-6/12 (rollout 2b): Beluga Manager SPA. Public PKCE client; the Domain API validates the
    # bearer JWT itself, so the gateway adds no openid-connect (hence app-oidc, like argocd).
    - name: manager
      host: "manager"
      mode: "app-oidc"
      clientId: "beluga-manager"
      protectedPathPrefixes:
        - "/"
      bypassPathPrefixes: []
      redirectPath: "/auth/callback"

    - name: trino
      host: "trino"
      mode: "app-oidc"
      clientId: "trino"
      protectedPathPrefixes:
        - "/"
      bypassPathPrefixes: []
      redirectPath: "/oauth2/token"

    - name: superset
      host: "superset"
      mode: "app-oidc"
      clientId: "superset"
      protectedPathPrefixes:
        - "/"
      bypassPathPrefixes: []
      redirectPath: "/oauth-authorized/keycloak"

    - name: airflow
      host: "airflow"
      mode: "app-oidc"
      clientId: "airflow"
      protectedPathPrefixes:
        - "/"
      bypassPathPrefixes: []
      redirectPath: "/oauth-authorized/keycloak"

    - name: openmetadata
      host: "metadata"
      mode: "app-oidc"
      clientId: "openmetadata"
      protectedPathPrefixes:
        - "/"
      bypassPathPrefixes: []
      redirectPath: "/callback"

    - name: s3
      host: "s3"
      mode: "none"
      clientId: ""
      protectedPathPrefixes: []
      bypassPathPrefixes:
        - "/"
      redirectPath: ""
