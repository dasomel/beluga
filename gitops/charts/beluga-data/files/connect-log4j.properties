# D-LOG-1: console only; hourly DailyRollingFileAppender exhausted nodefs on 2026-11-12.
# Cost: local file history is lost; escape hatch: ship stdout to a retained log store.
log4j.rootLogger=INFO, stdout
log4j.logger.org.reflections=ERROR
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{ISO8601} %-5p  %X{dbz.connectorType}|%X{dbz.connectorName}|%X{dbz.connectorContext}  %m   [%c]%n

# D-LOG-2: suppress reconnect WARN stack traces / INFO churn while Kafka is down.
# Cost: fewer network diagnostics; escape hatch: temporarily restore WARN/INFO via GitOps.
log4j.logger.org.apache.kafka.clients.NetworkClient=ERROR
log4j.logger.org.apache.kafka.clients.Metadata=ERROR
log4j.logger.org.apache.kafka.clients.FetchSessionHandler=ERROR
