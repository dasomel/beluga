# CDC 소스 DB(shop) 스키마·시드 적용 — 단일 원천은 files/shop-schema.sql (멱등 SQL)
# E2E 실측: 시딩 메커니즘 부재로 shop DB가 비어 Debezium 스냅숏 대상이 없었음
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-schema
  namespace: database
data:
  schema.sql: |
{{ .Files.Get "files/shop-schema.sql" | indent 4 }}
---
{{- define "beluga-data.hook.shop-seed" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: shop-seed
  namespace: database
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: shop-seed
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        seccompProfile:
          type: RuntimeDefault
      # D-ES-22 (#403): 실측 없음: Job의 API/DB 응답·쓰기 계층/stdout 256Mi 예산(별도 disk emptyDir 없음).
      # 비용: Job 퇴거 시 재시도/재동기화 필요(진행 중 작업 중단).
      # limit은 마운트 합계 + 쓰기 계층/stdout >=128Mi; request는 실측/미측정 최소 예약.
      # 탈출구: docs/ephemeral-storage-bounds.md 실측 후 예산/보존 재산정; kubelet 주기 검사이지 hard quota 아님.
      containers:
        - name: seed
          # CNPG 클러스터와 동일 이미지 — 이미 노드에 존재, psql 포함
          image: ghcr.io/cloudnative-pg/postgresql:17.6
          resources:
            requests:
              ephemeral-storage: 16Mi
            limits:
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until pg_isready -h postgres-main-rw.database.svc.cluster.local -p 5432; do
                echo "waiting for postgres..."; sleep 5
              done
              psql -v ON_ERROR_STOP=1 -h postgres-main-rw.database.svc.cluster.local \
                -U beluga_admin -d shop -f /sql/schema.sql
              echo "shop schema & seed applied"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credential
                  key: password
          volumeMounts:
            - name: schema
              mountPath: /sql
      volumes:
        - name: schema
          configMap:
            name: shop-schema
{{- end }}
{{ include "beluga-data.hook.shop-seed" . }}
