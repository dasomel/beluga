# D4: Lakekeeper 부트스트랩 및 웨어하우스 생성 Job
# beluga-lake prefix convention:
# - raw/     : ingestion and CDC landing area
# - curated/ : analytics-ready managed tables
# - tmp/     : transient rewrite/checkpoint/scratch data
# SeaweedFS identities.json in this repo version is bucket-scoped, not prefix-scoped, so
# raw/curated/tmp is a documented contract today; prefix-level enforcement is a follow-up.
apiVersion: batch/v1
kind: Job
metadata:
  name: lakekeeper-bootstrap
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    metadata:
      labels:
        app: lakekeeper-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: curlimages/curl:8.21.0
          env:
            - name: LAKEKEEPER_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lakekeeper-s3-credential
                  key: access-key
            - name: LAKEKEEPER_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lakekeeper-s3-credential
                  key: secret-key
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              LAKEKEEPER_URL="http://lakekeeper.lakehouse.svc.cluster.local:8181"
              SEAWEEDFS_S3_URL="http://seaweedfs-s3.storage.svc.cluster.local:8333"
              TMPDIR_L="$(mktemp -d)"
              trap 'rm -rf "${TMPDIR_L}"' EXIT

              echo "Waiting for Lakekeeper health check..."
              until curl -s -f "${LAKEKEEPER_URL}/health" > /dev/null 2>&1; do
                echo "Lakekeeper is not ready yet. Retrying in 3 seconds..."
                sleep 3
              done
              echo "Lakekeeper is healthy."

              echo "Executing Lakekeeper bootstrap..."
              BOOTSTRAP_RES=$(curl -s -w "\n%{http_code}" -X POST "${LAKEKEEPER_URL}/management/v1/bootstrap" \
                -H "Content-Type: application/json" \
                -d '{"accept-terms-of-use": true}')
              BOOTSTRAP_CODE=$(echo "$BOOTSTRAP_RES" | tail -n1)
              echo "Bootstrap HTTP status code: ${BOOTSTRAP_CODE}"

              echo "Ensuring SeaweedFS bucket 'beluga-lake' exists..."
              # 수정: YAML 블록 스칼라(args: |) 안이라 모든 줄이 공통 들여쓰기를 지니고,
              # 일반 <<EOF 히어독은 종결자 줄이 들여써지면(공백 접두) 인식하지 못해 나머지
              # 스크립트 전체를 삼켜버린다(실측: 로컬 sh로 재현 — 이후 코드가 전혀 실행되지
              # 않고 조용히 exit 0). <<-EOF도 탭만 벗겨내므로(이 파일은 스페이스 들여쓰기)
              # 근본 해결이 아니다 — printf로 대체해 종결자 매칭 자체를 없앤다.
              printf 'machine seaweedfs-s3.storage.svc.cluster.local\nlogin %s\npassword %s\n' \
                "${LAKEKEEPER_S3_ACCESS_KEY}" "${LAKEKEEPER_S3_SECRET_KEY}" > "${TMPDIR_L}/s3.netrc"
              chmod 600 "${TMPDIR_L}/s3.netrc"
              BUCKET_RES=$(curl -s -w "\n%{http_code}" -X PUT "${SEAWEEDFS_S3_URL}/beluga-lake" \
                --netrc-file "${TMPDIR_L}/s3.netrc" \
                --aws-sigv4 "aws:amz:us-east-1:s3")
              BUCKET_CODE=$(echo "$BUCKET_RES" | tail -n1)
              echo "SeaweedFS bucket creation HTTP status code: ${BUCKET_CODE}"

              echo "Checking if warehouse 'lake' exists..."
              WH_LIST=$(curl -s "${LAKEKEEPER_URL}/management/v1/warehouse" || echo "")
              if echo "$WH_LIST" | grep -q '"warehouse-name":"lake"' || echo "$WH_LIST" | grep -q '"name":"lake"'; then
                echo "Warehouse 'lake' already exists. Skipping creation."
              else
                echo "Creating warehouse 'lake'..."
                # 위 s3.netrc와 동일한 이유로 히어독 대신 printf(종결자 매칭 문제 자체를 없앤다).
                printf '{"warehouse-name":"lake","storage-profile":{"type":"s3","bucket":"beluga-lake","endpoint":"http://seaweedfs-s3.storage.svc.cluster.local:8333","path-style-access":true,"region":"us-east-1","sts-enabled":false},"storage-credential":{"type":"s3","credential-type":"access-key","aws-access-key-id":"%s","aws-secret-access-key":"%s"}}' \
                  "${LAKEKEEPER_S3_ACCESS_KEY}" "${LAKEKEEPER_S3_SECRET_KEY}" > "${TMPDIR_L}/warehouse.json"
                CREATE_RES=$(curl -s -w "\n%{http_code}" -X POST "${LAKEKEEPER_URL}/management/v1/warehouse" \
                  -H "Content-Type: application/json" \
                  --data-binary @"${TMPDIR_L}/warehouse.json")
                CREATE_CODE=$(echo "$CREATE_RES" | tail -n1)
                echo "Warehouse creation HTTP status code: ${CREATE_CODE}"
              fi
              echo "Lakekeeper bootstrap completed successfully."
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
