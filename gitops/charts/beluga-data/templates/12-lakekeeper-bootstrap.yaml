# D4: Lakekeeper 부트스트랩 및 웨어하우스 생성 Job
# beluga-lake prefix convention:
# - raw/     : ingestion and CDC landing area
# - curated/ : analytics-ready managed tables
# - tmp/     : transient rewrite/checkpoint/scratch data
# SeaweedFS identities.json in this repo version is bucket-scoped, not prefix-scoped, so
# raw/curated/tmp is a documented contract today; prefix-level enforcement is a follow-up.
apiVersion: batch/v1
kind: Job
metadata:
  name: lakekeeper-bootstrap
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  template:
    metadata:
      labels:
        app: lakekeeper-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: curlimages/curl:8.21.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: LAKEKEEPER_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lakekeeper-s3-credential
                  key: access-key
            - name: LAKEKEEPER_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lakekeeper-s3-credential
                  key: secret-key
            {{- if .Values.lakekeeper.openfga.enabled }}
            - name: LAKEKEEPER_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-lakekeeper-admin-secret
                  key: lakekeeper-admin
            {{- end }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              LAKEKEEPER_URL="http://lakekeeper.lakehouse.svc.cluster.local:8181"
              {{- if .Values.lakekeeper.openfga.enabled }}
              TOKEN=""
              for attempt in $(seq 1 60); do
                TOKEN=$(curl -fsS -u "lakekeeper-admin:${LAKEKEEPER_ADMIN_CLIENT_SECRET}" \
                  -d grant_type=client_credentials \
                  "http://keycloak.iam.svc.cluster.local:8080/realms/beluga/protocol/openid-connect/token" 2>/dev/null \
                  | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p' || true)
                [ -n "${TOKEN}" ] && break
                sleep 5
              done
              test -n "${TOKEN}"
              AUTH_HEADER="Authorization: Bearer ${TOKEN}"
              {{- else }}
              AUTH_HEADER=""
              {{- end }}
              SEAWEEDFS_S3_URL="http://seaweedfs-s3.storage.svc.cluster.local:8333"
              TMPDIR_L="$(mktemp -d)"
              trap 'rm -rf "${TMPDIR_L}"' EXIT

              echo "Waiting for Lakekeeper health check..."
              until curl -s -f "${LAKEKEEPER_URL}/health" > /dev/null 2>&1; do
                echo "Lakekeeper is not ready yet. Retrying in 3 seconds..."
                sleep 3
              done
              echo "Lakekeeper is healthy."

              echo "Executing Lakekeeper bootstrap..."
              BOOTSTRAP_RES=$(curl -s -w "\n%{http_code}" -X POST "${LAKEKEEPER_URL}/management/v1/bootstrap" \
                -H "Content-Type: application/json" \
                {{- if .Values.lakekeeper.openfga.enabled }}-H "${AUTH_HEADER}" \
                -d '{"accept-terms-of-use":true,"is-operator":true,"user-type":"application"}'{{- else }}-d '{"accept-terms-of-use":true,"is-operator":true,"user-type":"application"}'{{- end }})
              BOOTSTRAP_CODE=$(echo "$BOOTSTRAP_RES" | tail -n1)
              BOOTSTRAP_BODY=$(echo "$BOOTSTRAP_RES" | sed '$d')
              echo "Bootstrap HTTP status code: ${BOOTSTRAP_CODE}"
              if [ "${BOOTSTRAP_CODE}" != "204" ]; then
                if { [ "${BOOTSTRAP_CODE}" = "400" ] || [ "${BOOTSTRAP_CODE}" = "409" ]; } && \
                  echo "${BOOTSTRAP_BODY}" | grep -Eiq '(already.*(bootstrap|initialized|completed|performed))|((bootstrap|initialized).*(already|completed|performed))'; then
                  echo "Lakekeeper is already bootstrapped. Continuing idempotently."
                else
                  echo "Lakekeeper bootstrap failed: ${BOOTSTRAP_BODY}" >&2
                  exit 1
                fi
              fi

              echo "Ensuring SeaweedFS bucket 'beluga-lake' exists..."
              # 수정: YAML 블록 스칼라(args: |) 안이라 모든 줄이 공통 들여쓰기를 지니고,
              # 일반 <<EOF 히어독은 종결자 줄이 들여써지면(공백 접두) 인식하지 못해 나머지
              # 스크립트 전체를 삼켜버린다(실측: 로컬 sh로 재현 — 이후 코드가 전혀 실행되지
              # 않고 조용히 exit 0). <<-EOF도 탭만 벗겨내므로(이 파일은 스페이스 들여쓰기)
              # 근본 해결이 아니다 — printf로 대체해 종결자 매칭 자체를 없앤다.
              printf 'machine seaweedfs-s3.storage.svc.cluster.local\nlogin %s\npassword %s\n' \
                "${LAKEKEEPER_S3_ACCESS_KEY}" "${LAKEKEEPER_S3_SECRET_KEY}" > "${TMPDIR_L}/s3.netrc"
              chmod 600 "${TMPDIR_L}/s3.netrc"
              BUCKET_RES=$(curl -s -w "\n%{http_code}" -X PUT "${SEAWEEDFS_S3_URL}/beluga-lake" \
                --netrc-file "${TMPDIR_L}/s3.netrc" \
                --aws-sigv4 "aws:amz:us-east-1:s3")
              BUCKET_CODE=$(echo "$BUCKET_RES" | tail -n1)
              echo "SeaweedFS bucket creation HTTP status code: ${BUCKET_CODE}"

              echo "Checking if warehouse 'lake' exists..."
              WH_LIST=$(curl -fsS "${LAKEKEEPER_URL}/management/v1/warehouse" \
                {{- if .Values.lakekeeper.openfga.enabled }}-H "${AUTH_HEADER}"{{- end }})
              WAREHOUSE_ID=$(echo "${WH_LIST}" | tr '{' '\n' | grep '"name":"lake"' | \
                sed -n 's/.*"warehouse-id":"\([0-9a-fA-F-]*\)".*/\1/p' | head -n1)
              if [ -n "${WAREHOUSE_ID}" ]; then
                echo "Warehouse 'lake' exists with id ${WAREHOUSE_ID}."
              else
                echo "Creating warehouse 'lake'..."
                # 위 s3.netrc와 동일한 이유로 히어독 대신 printf(종결자 매칭 문제 자체를 없앤다).
                printf '{"warehouse-name":"lake","storage-profile":{"type":"s3","bucket":"beluga-lake","endpoint":"http://seaweedfs-s3.storage.svc.cluster.local:8333","path-style-access":true,"region":"us-east-1","sts-enabled":false},"storage-credential":{"type":"s3","credential-type":"access-key","aws-access-key-id":"%s","aws-secret-access-key":"%s"}}' \
                  "${LAKEKEEPER_S3_ACCESS_KEY}" "${LAKEKEEPER_S3_SECRET_KEY}" > "${TMPDIR_L}/warehouse.json"
                CREATE_RES=$(curl -s -w "\n%{http_code}" -X POST "${LAKEKEEPER_URL}/management/v1/warehouse" \
                  -H "Content-Type: application/json" \
                  {{- if .Values.lakekeeper.openfga.enabled }}-H "${AUTH_HEADER}" \
                  {{- end }}\
                  --data-binary @"${TMPDIR_L}/warehouse.json")
                CREATE_CODE=$(echo "$CREATE_RES" | tail -n1)
                echo "Warehouse creation HTTP status code: ${CREATE_CODE}"
                [ "${CREATE_CODE}" = "201" ] || { echo "Warehouse creation failed: ${CREATE_RES}" >&2; exit 1; }
                CREATE_BODY=$(echo "${CREATE_RES}" | sed '$d')
                WAREHOUSE_ID=$(echo "${CREATE_BODY}" | sed -n 's/.*"warehouse-id":"\([0-9a-fA-F-]*\)".*/\1/p' | head -n1)
                [ -n "${WAREHOUSE_ID}" ] || { echo "Created warehouse response omitted warehouse-id" >&2; exit 1; }
              fi

              {{- if .Values.lakekeeper.openfga.enabled }}
              # Keycloak client-credentials preferred_username values map to Lakekeeper's configured subject claim.
              printf '{"writes":[{"user":"oidc~service-account-trino","type":"describe"},{"user":"oidc~service-account-trino","type":"select"},{"user":"oidc~service-account-trino","type":"create"},{"user":"oidc~service-account-trino","type":"modify"},{"user":"oidc~service-account-flink","type":"describe"},{"user":"oidc~service-account-flink","type":"select"},{"user":"oidc~service-account-flink","type":"create"},{"user":"oidc~service-account-flink","type":"modify"}],"deletes":[]}' > "${TMPDIR_L}/assignments.json"
              ASSIGN_RES=$(curl -s -w "\n%{http_code}" -X POST "${LAKEKEEPER_URL}/management/v1/permissions/warehouse/${WAREHOUSE_ID}/assignments" \
                -H "${AUTH_HEADER}" -H "Content-Type: application/json" \
                --data-binary @"${TMPDIR_L}/assignments.json")
              ASSIGN_CODE=$(echo "${ASSIGN_RES}" | tail -n1)
              [ "${ASSIGN_CODE}" = "204" ] || { echo "Warehouse assignment update failed: ${ASSIGN_RES}" >&2; exit 1; }
              echo "Applied least-privilege assignments to warehouse lake (${WAREHOUSE_ID})."
              {{- end }}
              echo "Lakekeeper bootstrap completed successfully."
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
