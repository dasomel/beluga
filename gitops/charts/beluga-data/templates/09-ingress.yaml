apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beluga-data-ingress
  namespace: beluga-data
  annotations:
    ingress.cilium.io/ssl-passthrough: "false"
spec:
  ingressClassName: cilium
  rules:
    - host: trino.beluga.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trino
                port:
                  number: 8080
    - host: airflow.beluga.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airflow
                port:
                  number: 8080
    - host: superset.beluga.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: superset
                port:
                  number: 8088
    - host: catalog.beluga.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lakekeeper
                port:
                  number: 8181
    - host: s3.beluga.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-s3
                port:
                  number: 8333
    - host: filer.beluga.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-s3
                port:
                  number: 8888
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beluga-argocd-ingress
  namespace: argocd
spec:
  ingressClassName: cilium
  rules:
    - host: argocd.beluga.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
