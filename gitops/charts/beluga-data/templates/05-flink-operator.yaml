apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-cluster
  namespace: beluga-data
spec:
  # Docker 공식(library) flink만 멀티아치 — apache/flink 리포는 amd64 전용 (2026-08-10 manifest 확인)
  image: flink:1.20.0-scala_2.12-java17
  flinkVersion: v1_20
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    s3.endpoint: "http://seaweedfs-s3:8333"
    s3.path.style.access: "true"
  serviceAccount: flink
  jobManager:
    resource:
      memory: "1024m"
      cpu: 1.0
  taskManager:
    resource:
      memory: "2048m"
      cpu: 1.0
  podTemplate:
    spec:
      initContainers:
        - name: download-connectors
          image: curlimages/curl:8.12.1
          command:
            - sh
            - -c
            - |
              curl -sL -o /opt/flink/usrlib/flink-sql-connector-kafka-3.4.0-1.20.jar https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.4.0-1.20/flink-sql-connector-kafka-3.4.0-1.20.jar
              curl -sL -o /opt/flink/usrlib/iceberg-flink-runtime-1.20-1.7.1.jar https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-flink-runtime-1.20/1.7.1/iceberg-flink-runtime-1.20-1.7.1.jar
              curl -sL -o /opt/flink/usrlib/iceberg-aws-bundle-1.7.1.jar https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-aws-bundle/1.7.1/iceberg-aws-bundle-1.7.1.jar
          volumeMounts:
            - name: flink-user-lib
              mountPath: /opt/flink/usrlib
      containers:
        - name: flink-main-container
          volumeMounts:
            - name: flink-user-lib
              mountPath: /opt/flink/usrlib
      volumes:
        - name: flink-user-lib
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: beluga-data
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-role-binding
  namespace: beluga-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: beluga-data
