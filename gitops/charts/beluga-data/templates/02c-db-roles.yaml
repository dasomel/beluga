# PostgreSQL DB Roles & Privilege Grants (D19 Role Inheritance & D20 LDAP Login Roles)
# Single source of truth SQL: files/db-roles.sql
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-roles-schema
  namespace: database
data:
  db-roles.sql: |
{{ .Files.Get "files/db-roles.sql" | indent 4 }}
{{- if .Values.shopGenerator.enabled }}
  shop-generator-grants.sql: |
{{ .Files.Get "files/shop-generator-grants.sql" | indent 4 }}
{{- end }}
---
{{- define "beluga-data.hook.db-roles-setup" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: db-roles-setup
  namespace: database
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    metadata:
{{- if .Values.shopGenerator.enabled }}
      annotations:
        checksum/shop-generator-grants: {{ .Files.Get "files/shop-generator-grants.sql" | sha256sum | quote }}
{{- end }}
      labels:
        app: db-roles-setup
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        seccompProfile:
          type: RuntimeDefault
      # D-ES-23 (#403): 실측 없음: Job의 API/DB 응답·쓰기 계층/stdout 256Mi 예산(별도 disk emptyDir 없음).
      # 비용: Job 퇴거 시 재시도/재동기화 필요(진행 중 작업 중단).
      # limit은 마운트 합계 + 쓰기 계층/stdout >=128Mi; request는 실측/미측정 최소 예약.
      # 탈출구: docs/ephemeral-storage-bounds.md 실측 후 예산/보존 재산정; kubelet 주기 검사이지 hard quota 아님.
      containers:
        - name: setup-roles
          image: ghcr.io/cloudnative-pg/postgresql:17.6
          resources:
            requests:
              ephemeral-storage: 16Mi
            limits:
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until pg_isready -h postgres-main-rw.database.svc.cluster.local -p 5432; do
                echo "waiting for postgres..."; sleep 5
              done
              # 명시적 테이블 GRANT가 성공하려면 shop-seed가 먼저 끝나야 한다.
              until psql -h postgres-main-rw.database.svc.cluster.local -U beluga_admin -d shop \
                -tAc "SELECT 1 FROM customers LIMIT 1" >/dev/null 2>&1; do
                echo "waiting for shop schema (shop-seed)..."; sleep 5
              done
              psql -v ON_ERROR_STOP=1 -h postgres-main-rw.database.svc.cluster.local \
                -U beluga_admin -d shop -f /sql/db-roles.sql
              psql -v ON_ERROR_STOP=1 -h postgres-main-rw.database.svc.cluster.local \
                -U beluga_admin -d postgres -tAc "SELECT 'CREATE DATABASE openfga OWNER beluga_admin' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='openfga')" | psql -v ON_ERROR_STOP=1 -h postgres-main-rw.database.svc.cluster.local -U beluga_admin -d postgres
              # D-SSDB-1: Superset 메타데이터 전용 DB(initdb 이후 추가된 DB라 기존 클러스터에서도 멱등 생성).
                -U beluga_admin -d postgres -tAc "SELECT 'CREATE DATABASE superset OWNER beluga_admin' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='superset')" | psql -v ON_ERROR_STOP=1 -h postgres-main-rw.database.svc.cluster.local -U beluga_admin -d postgres
{{- if .Values.shopGenerator.enabled }}
              # D-SHOP-9: optional demo readiness/grants must not fail shared sync.
              # Cost: grants may lag one sync; escape hatch: full sync after CNPG reconciles.
              i=0
              ready=false
              while [ "$i" -lt 60 ]; do
                if [ "$(PGCONNECT_TIMEOUT=5 PGOPTIONS='-c statement_timeout=5000' psql -h postgres-main-rw.database.svc.cluster.local -U beluga_admin -d shop -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'shop_generator'" 2>/dev/null || true)" = "1" ]; then
                  ready=true
                  break
                fi
                i=$((i + 1))
                echo "waiting for CNPG shop_generator role ($i/60)..."
                sleep 5
              done
              if [ "$ready" = true ]; then
                if ! PGCONNECT_TIMEOUT=5 PGOPTIONS='-c statement_timeout=5000 -c lock_timeout=5000' psql -v ON_ERROR_STOP=1 -h postgres-main-rw.database.svc.cluster.local \
                  -U beluga_admin -d shop -f /sql/shop-generator-grants.sql; then
                  echo "skipping optional shop_generator grants: apply failed; retry on next full sync" >&2
                fi
              else
                echo "skipping optional shop_generator grants: role absent after 60 attempts; retry on next full sync" >&2
              fi
{{- end }}
              echo "db roles and D19 inheritance applied"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credential
                  key: password
          volumeMounts:
            - name: sql-script
              mountPath: /sql
      volumes:
        - name: sql-script
          configMap:
            name: db-roles-schema
{{- end }}
{{ include "beluga-data.hook.db-roles-setup" . }}
