apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-main
  namespace: beluga-data
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:17.0"
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: {{ .Values.cnpg.dbNameShop }}
      owner: beluga_admin
      secret:
        name: postgres-admin-credential
  postgresql:
    parameters:
      wal_level: "logical"
      max_wal_senders: "10"
      max_replication_slots: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin-credential
  namespace: beluga-data
type: Opaque
stringData:
  username: beluga_admin
  password: SET-AT-BOOTSTRAP
