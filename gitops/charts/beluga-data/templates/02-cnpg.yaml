apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-main
  namespace: beluga-data
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:17.6"
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: {{ .Values.cnpg.dbNameShop }}
      owner: beluga_admin
      secret:
        name: postgres-admin-credential
      postInitApplicationSQL:
        # OWNER 필수 — PG 15+는 public 스키마 CREATE가 기본 제거라 GRANT DATABASE만으로는
        # 테이블 생성 불가("permission denied for schema public", E2E 실측)
        - "CREATE DATABASE beluga_meta OWNER beluga_admin;"
        - "CREATE DATABASE lakekeeper OWNER beluga_admin;"
        - "CREATE DATABASE keycloak OWNER beluga_admin;"
        - "CREATE DATABASE openmetadata OWNER beluga_admin;"
        # Debezium WAL sender는 REPLICATION 속성 필수 (E2E 실측: "permission denied to start WAL sender")
        # CREATEROLE: db-roles Job이 beluga_admin으로 D19 롤을 생성 (permission denied 실측)
        - "ALTER ROLE beluga_admin WITH REPLICATION CREATEROLE;"
  postgresql:
    # CNPG pg_hba docs: https://cloudnative-pg.io/documentation/1.30/postgresql_conf/#pg_hba
    # PG 17 LDAP docs: https://www.postgresql.org/docs/17/auth-ldap.html
    # TLS 미사용(평문): 클러스터 내부 통신(openldap.beluga-system.svc.cluster.local) 전제로 평문 전송 수용
    pg_hba:
      - host all "beluga-admin","beluga-engineer","beluga-analyst" 0.0.0.0/0 ldap ldapserver=openldap.beluga-system.svc.cluster.local ldapbasedn="ou=users,dc=beluga,dc=internal" ldapsearchattribute="uid" ldapbinddn="cn=admin,dc=beluga,dc=internal" ldapbindpasswd="{{ .Values.credentials.ldapAdminPassword }}"
    parameters:
      wal_level: "logical"
      max_wal_senders: "10"
      max_replication_slots: "10"

