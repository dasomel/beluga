apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-main
  namespace: database
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:17.6"
  # D-ES-CNPG-1: scratch-data 실측 57Mi보다 넉넉한 1Gi + 로그/쓰기 계층 256Mi.
  # shared_buffers 재정의 없음(PG 기본 128MB); shm은 컨테이너 메모리 상한까지 허용해
  # 병렬 쿼리의 동적 공유 메모리가 작은 /dev/shm 상한으로 먼저 ENOSPC 나지 않게 한다.
  # tmpfs는 실제 사용량만 RAM에 과금되며 메모리 limit을 늘리거나 예약하지 않는다.
  # 비용: 초과 시 단일 인스턴스 DB Pod 퇴거/재시작. 탈출구: 실측 후 예산 조정/PVC 임시 공간.
  # CNPG 1.30 CRD는 차트에 동봉되지 않는다. ephemeralVolumesSizeLimit 필드는 라이브 CRD에서 확인됨(2026-11-13, kubectl explain).
  ephemeralVolumesSizeLimit:
    shm: 1536Mi
    temporaryData: 1Gi
  resources:
    requests:
      ephemeral-storage: 64Mi
      memory: "512Mi"
      cpu: "250m"
    limits:
      ephemeral-storage: 1280Mi
      memory: "1536Mi"
      cpu: "1000m"
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: {{ .Values.cnpg.dbNameShop }}
      owner: beluga_admin
      secret:
        name: postgres-admin-credential
      postInitApplicationSQL:
        # OWNER 필수 — PG 15+는 public 스키마 CREATE가 기본 제거라 GRANT DATABASE만으로는
        # 테이블 생성 불가("permission denied for schema public", E2E 실측)
        - "CREATE DATABASE beluga_meta OWNER beluga_admin;"
        - "CREATE DATABASE lakekeeper OWNER beluga_admin;"
        - "CREATE DATABASE openfga OWNER beluga_admin;"
        - "CREATE DATABASE keycloak OWNER beluga_admin;"
        - "CREATE DATABASE openmetadata OWNER beluga_admin;"
        # Debezium WAL sender는 REPLICATION 속성 필수 (E2E 실측: "permission denied to start WAL sender")
        # CREATEROLE: db-roles Job이 beluga_admin으로 D19 롤을 생성 (permission denied 실측)
        - "ALTER ROLE beluga_admin WITH REPLICATION CREATEROLE;"
  postgresql:
    # CNPG pg_hba docs: https://cloudnative-pg.io/documentation/1.30/postgresql_conf/#pg_hba
    # PG 17 LDAP docs: https://www.postgresql.org/docs/17/auth-ldap.html
    # TLS 미사용(평문): 클러스터 내부 통신(openldap.iam.svc.cluster.local) 전제로 평문 전송 수용
    # D-K(이슈 #104): pg_hba.conf는 Postgres가 직접 읽는 텍스트 파일이라 K8s secretKeyRef로
    # 값을 주입할 방법이 없다 — search+bind 모드(ldapbinddn/ldapbindpasswd)를 쓰는 한 admin
    # 바인드 암호가 이 파일에 평문으로 박힐 수밖에 없다. usersDn이 uid 하나로 결정되는 평평한
    # 구조라 admin 바인드 자체가 불필요하다는 점에 착안해 simple bind 모드로 전환했다:
    # ldapprefix/ldapsuffix로 커넥션 시점에 DN을 조립하고, 각 사용자가 "자신의" LDAP 암호로
    # 직접 바인드한다. 그 결과 pg_hba에는 애초에 비밀값이 없어 렌더 시점 주입·selfHeal 되돌림
    # 문제가 구조적으로 사라진다(값이 없으니 되돌릴 대상도 없음).
    pg_hba:
      - host all "beluga-admin","beluga-engineer","beluga-analyst" 0.0.0.0/0 ldap ldapserver=openldap.iam.svc.cluster.local ldapprefix="uid=" ldapsuffix=",ou=users,dc=beluga,dc=internal"
    parameters:
      wal_level: "logical"
      max_wal_senders: "10"
      max_replication_slots: "10"
      # D-WAL-1: 5Gi PGDATA + CNPG wal_keep_size=512MB + max_wal_size=1GB에 여유를 둔다.
      # 비용: checkpoint에서 지연 슬롯이 lost가 되어 CDC 재스냅숏이 필요할 수 있다.
      # 노드 전체 eviction보다 이를 택한다. 탈출구: PVC/노드 증설 후 관측한 WAL 속도로 재산정.
      # checkpoint 사이 초과·아카이빙 실패는 별도이므로 전체 pg_wal의 hard cap은 아니다.
      max_slot_wal_keep_size: "1GB"
  # Task: beluga issue #46 (backup protection: immutability, retention, integrity)
  # CNPG 1.30 backup docs: https://cloudnative-pg.io/documentation/1.30/backup_recovery/
  # Note: retentionPolicy is a direct child of spec.backup (pattern: ^[1-9][0-9]*[dwm]$),
  # not barmanObjectStore. wal.compression enables WAL archiving for PITR (Point-In-Time Recovery).
  backup:
    barmanObjectStore:
      destinationPath: "s3://beluga-postgres-backups/"
      endpointURL: "http://seaweedfs-s3.storage.svc.cluster.local:8333"
      s3Credentials:
        accessKeyId:
          name: postgres-backup-s3-credential
          key: access-key
        secretAccessKey:
          name: postgres-backup-s3-credential
          key: secret-key
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-main-backup
  namespace: database
spec:
  # CNPG ScheduledBackup uses robfig/cron format with 6 fields (including seconds):
  # "0 0 2 * * *" = 02:00:00 UTC daily off-peak backup.
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  method: barmanObjectStore
  cluster:
    name: postgres-main

