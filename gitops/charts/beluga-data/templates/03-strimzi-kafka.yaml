# D6: KRaft 모드 — Strimzi 0.45에서 KRaft는 node-pools + kraft 어노테이션과
# KafkaNodePool CR이 필수 (zookeeper 섹션 없는 CR은 이것 없이는 리컨실 거부, E2E 실측)
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: mixed
  namespace: streaming
  labels:
    strimzi.io/cluster: beluga-kafka
spec:
  replicas: {{ .Values.strimzi.replicas }}
  roles:
    - controller
    - broker
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1500m
      memory: 2Gi
  jvmOptions:
    -Xms: 512m
    -Xmx: 1024m
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: beluga-kafka
  namespace: streaming
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: {{ .Values.strimzi.kafkaVersion }}
    {{- if .Values.strimzi.opaAuthorizer }}
    # D14: opa-kafka-plugin — 브로커 classpath에 플러그인 JAR가 있는 커스텀 이미지 필요.
    # JAR 없이 켜면 브로커가 기동 실패하므로 기본 off (values.strimzi.opaAuthorizer)
    authorization:
      type: custom
      authorizerClass: org.openpolicyagent.kafka.OpaAuthorizer
      supportsAdminApi: true
    {{- else if or .Values.strimzi.aclAuthorizer .Values.strimzi.oauthListener }}
    # D18: Strimzi Native Simple ACL Authorizer (KRaft 모드 지원)
    # Strimzi doc: https://strimzi.io/docs/operators/latest/configuring.html#property-kafka-authorization-simple-reference
    authorization:
      type: simple
    {{- end }}
    listeners:
      {{- if not .Values.strimzi.oauthListener }}
      # D22 / D24: 내부 plain(9092) 리스너 — listenerTls 플래그(기본 false)로 TLS 여부 제어.
      # Debezium/Flink/Clickstream 등 클러스터 내부 소비자의 일괄 TLS 마이그레이션 전까지
      # 평문 호환성을 유지하기 위해 기본 off를 유지함.
      # [주의]: oauthListener: true 시 이 리스너가 제거되어 포트 9092 바인딩이 사라지므로,
      # beluga-kafka-kafka-bootstrap:9092에 고정된 debezium-connect 및 clickstream-gen의 연결이 거부됩니다.
      - name: plain
        port: 9092
        type: internal
        tls: {{ .Values.strimzi.listenerTls | default false }}
      {{- end }}
      {{- if .Values.strimzi.externalListenerEnabled }}
      # D22 / D24: 외부 NodePort 리스너 — 기본 비활성화, 명시적 opt-in 시에만 노출.
      # [보안 주의]: oauthListener: true와 함께 활성화하더라도 외부 NodePort는 계속 tls: false 및
      # 인증 없음(익명 접근 허용) 상태로 열려 있습니다 (이슈 #6 보안 부채).
      - name: external
        port: {{ .Values.strimzi.externalPort | default 9094 }}
        type: nodeport
        tls: false
        configuration:
          bootstrap:
            nodePort: 30094
      {{- end }}
      {{- if .Values.strimzi.oauthListener }}
      # D20 / D6: Keycloak OAuth 2.0 JWT 인증 리스너 (KRaft 모드 완전 지원)
      # Strimzi doc: https://strimzi.io/docs/operators/latest/configuring.html#property-listener-config-auth-oauth-reference
      # D22: Strimzi oauth listener는 tlsTrustedCertificates 필드를 통해 Keycloak SSO CA 인증서(Secret의 ca.crt)를
      # 네이티브로 마운트하여 discovery/JWKS 호출을 검증함. Trino식 JVM truststore 빌드 initContainer 불필요.
      # D23: Listener TLS는 Strimzi 내장 cluster CA를 사용하여 개별 브로커 파드의 SAN 및 인증서 수명주기를 자동 관리.
      - name: oauth
        port: 9093
        type: internal
        tls: true
        authentication:
          type: oauth
          validIssuerUri: "https://sso.{{ .Values.baseDomain }}/realms/beluga"
          jwksEndpointUri: "https://sso.{{ .Values.baseDomain }}/realms/beluga/protocol/openid-connect/certs"
          userNameClaim: preferred_username
          tlsTrustedCertificates:
            - secretName: beluga-kafka-oauth-ca
              certificate: ca.crt
      {{- end }}
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
# D6 수정: Debezium Connect는 Strimzi CR이 아닌 독립 Deployment.
# Strimzi KafkaConnect CR은 Strimzi 빌드 이미지 전용 런처(/opt/kafka/kafka_connect_run.sh)를
# 강제해 debezium/connect 독립 이미지와 구조적으로 비호환 (E2E 실측). 레지스트리 없는
# 로컬 환경에서는 spec.build도 불가 — Debezium 공식 독립 이미지 방식이 정석.
kind: Deployment
apiVersion: apps/v1
metadata:
  name: debezium-connect
  namespace: streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium-connect
  template:
    metadata:
      labels:
        app: debezium-connect
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connect
          image: quay.io/debezium/connect:3.6.1.Final  # 2026-08-10 manifest inspect로 arm64 확인
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # 힙 상한 미명시 시 기본 -Xmx2G가 컨테이너 리밋 초과로 OOMKilled (E2E 실측, §9 대응책)
            - name: HEAP_OPTS
              value: "-Xms256M -Xmx1024M"
            - name: BOOTSTRAP_SERVERS
              value: "beluga-kafka-kafka-bootstrap:9092"
            - name: GROUP_ID
              value: "debezium-cluster"
            - name: CONFIG_STORAGE_TOPIC
              value: "debezium-cluster-configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "debezium-cluster-offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "debezium-cluster-status"
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
          ports:
            - containerPort: 8083
              name: rest
          readinessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "2048Mi"
              cpu: "1000m"
          volumeMounts:
            - name: kafka-logs
              mountPath: /kafka/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: kafka-logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect
  namespace: streaming
spec:
  type: ClusterIP
  selector:
    app: debezium-connect
  ports:
    - name: rest
      port: 8083
      targetPort: 8083
---
# CDC 소스 커넥터 등록 — PUT은 멱등(존재 시 설정 갱신)
apiVersion: batch/v1
kind: Job
metadata:
  name: debezium-register-shop
  namespace: streaming
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: debezium-register-shop
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: curlimages/curl:8.21.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # D-K(이슈 #104): DB 암호는 더 이상 Helm 렌더 시점에 굽지 않고 컨테이너 env로만
          # 받는다 — postgres-admin-credential은 streaming 네임스페이스에도 복제된다(부트스트랩
          # 스크립트). JSON 바디는 '...' 단일 인용이라 셸 변수를 바로 넣을 수 없어, 자리표시자를
          # sed로 치환한다(JSON 문자열 안에 넣을 값이므로 이스케이프 문자는 없다고 가정).
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credential
                  key: password
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              CONNECT="http://debezium-connect.streaming.svc.cluster.local:8083"
              echo "Waiting for Kafka Connect REST..."
              until curl -sf "${CONNECT}/connectors" > /dev/null; do sleep 5; done
              echo "Registering shop-cdc connector (idempotent PUT)..."
              BODY=$(cat <<'EOF'
              {
                "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
                "database.hostname": "postgres-main-rw.database.svc.cluster.local",
                "database.port": "5432",
                "database.user": "beluga_admin",
                "database.password": "__PGPASSWORD__",
                "database.dbname": "shop",
                "topic.prefix": "cdc.shop",
                "plugin.name": "pgoutput",
                "slot.name": "beluga_shop_slot",
                "table.include.list": "public.orders,public.customers",
                "publication.autocreate.mode": "filtered",
                "decimal.handling.mode": "string",
                "snapshot.mode": "when_needed"
              }
              EOF
              )
              BODY=$(echo "${BODY}" | sed "s/__PGPASSWORD__/${PGPASSWORD}/")
              HTTP=$(curl -s -o /tmp/resp -w "%{http_code}" -X PUT "${CONNECT}/connectors/shop-cdc/config" \
                -H "Content-Type: application/json" \
                -d "${BODY}")
              cat /tmp/resp; echo
              echo "HTTP ${HTTP}"
              case "${HTTP}" in 2*) exit 0;; *) exit 1;; esac
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- if or .Values.strimzi.oauthListener .Values.strimzi.aclAuthorizer }}
---
# D18 / D20: KafkaUser CR — beluga-admin (관리자 - 전체 권한)
# Note: Strimzi UserOperator는 TLS/SCRAM 인증 사용자만 관리하므로 OAuth 인증 사용자의 경우
# spec.authentication을 생략하고 spec.authorization(type: simple)만 정의하여 ACL을 적용함.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: beluga-admin
  namespace: streaming
  labels:
    strimzi.io/cluster: beluga-kafka
spec:
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - All
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - All
      - resource:
          type: cluster
        operations:
          - All
---
# D18 / D20: KafkaUser CR — beluga-engineer (엔지니어 - 토픽 R/W/Describe + 그룹 Read)
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: beluga-engineer
  namespace: streaming
  labels:
    strimzi.io/cluster: beluga-kafka
spec:
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - Read
          - Write
          - Describe
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - Read
---
# D18 / D20: KafkaUser CR — beluga-analyst (분석가 - 토픽 Read/Describe만 + 그룹 Read)
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: beluga-analyst
  namespace: streaming
  labels:
    strimzi.io/cluster: beluga-kafka
spec:
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - Read
          - Describe
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - Read
{{- end }}
{{- if .Values.strimzi.oauthListener }}
---
# D22 / D24: cert-manager CA(beluga-internal-ca-issuer)로 발급하는 Strimzi OAuth CA-trust Secret
# Strimzi OAuth 리스너의 tlsTrustedCertificates가 이 Secret의 ca.crt를 참조하여
# https://sso.{{ .Values.baseDomain }} Keycloak JWKS 엔드포인트의 TLS를 검증한다.
# 리프 키페어(tls.crt/tls.key)의 SSO 호스트 사칭 위험을 방지하기 위해 실제 서비스 호스트명 대신
# 내부 CA-trust 전용 비서비스 호스트명(beluga-kafka-oauth-trust.streaming.svc.cluster.local)을 식별자로 사용한다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: beluga-kafka-oauth-ca
  namespace: streaming
spec:
  secretName: beluga-kafka-oauth-ca
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    name: beluga-internal-ca-issuer
    kind: ClusterIssuer
  commonName: beluga-kafka-oauth-trust.streaming.svc.cluster.local
  dnsNames:
    - beluga-kafka-oauth-trust.streaming.svc.cluster.local
{{- end }}

