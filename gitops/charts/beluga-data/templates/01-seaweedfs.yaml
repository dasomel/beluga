# SeaweedFS S3 IAM configuration. Values are rendered at pod startup from the
# storage-only Secret so no usable credential is committed to Git or exposed to
# other workload namespaces.
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-identities-template
  namespace: storage
data:
  identities.json: |
    {
      "identities": [
        {
          "name": "trino-service",
          "credentials": [{"accessKey": "__TRINO_ACCESS_KEY__", "secretKey": "__TRINO_SECRET_KEY__"}],
          "actions": ["Read:beluga-lake", "Write:beluga-lake", "List:beluga-lake", "Tagging:beluga-lake"]
        },
        {
          "name": "flink-service",
          "credentials": [{"accessKey": "__FLINK_ACCESS_KEY__", "secretKey": "__FLINK_SECRET_KEY__"}],
          "actions": ["Read:beluga-lake", "Write:beluga-lake", "List:beluga-lake", "Tagging:beluga-lake"]
        },
        {
          "name": "lakekeeper-service",
          "credentials": [{"accessKey": "__LAKEKEEPER_ACCESS_KEY__", "secretKey": "__LAKEKEEPER_SECRET_KEY__"}],
          "actions": ["Admin:beluga-lake", "Read:beluga-lake", "Write:beluga-lake", "List:beluga-lake", "Tagging:beluga-lake"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: storage
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      initContainers:
        # The ConfigMap is intentionally credential-free. Render its placeholders
        # into an emptyDir using only the storage namespace's aggregate Secret.
        - name: render-s3-identities
          image: curlimages/curl:8.21.0
          command:
            - sh
            - -c
            - |
              set -eu
              sed \
                -e "s|__TRINO_ACCESS_KEY__|${TRINO_S3_ACCESS_KEY}|g" \
                -e "s|__TRINO_SECRET_KEY__|${TRINO_S3_SECRET_KEY}|g" \
                -e "s|__FLINK_ACCESS_KEY__|${FLINK_S3_ACCESS_KEY}|g" \
                -e "s|__FLINK_SECRET_KEY__|${FLINK_S3_SECRET_KEY}|g" \
                -e "s|__LAKEKEEPER_ACCESS_KEY__|${LAKEKEEPER_S3_ACCESS_KEY}|g" \
                -e "s|__LAKEKEEPER_SECRET_KEY__|${LAKEKEEPER_S3_SECRET_KEY}|g" \
                /identities-template/identities.json > /identities/identities.json
          env:
            - name: TRINO_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: trino-access-key
            - name: TRINO_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: trino-secret-key
            - name: FLINK_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: flink-access-key
            - name: FLINK_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: flink-secret-key
            - name: LAKEKEEPER_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: lakekeeper-access-key
            - name: LAKEKEEPER_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: lakekeeper-secret-key
          volumeMounts:
            - name: identities-template
              mountPath: /identities-template
              readOnly: true
            - name: identities
              mountPath: /identities
      containers:
        - name: master-volume-s3
          image: {{ .Values.seaweedfs.image }}
          command:
            - "weed"
            - "server"
            - "-s3"
            - "-s3.port={{ .Values.seaweedfs.s3Port }}"
            - "-s3.config=/etc/seaweedfs/identities.json"
            - "-filer.port={{ .Values.seaweedfs.filerPort }}"
            - "-dir=/data"
          ports:
            - containerPort: {{ .Values.seaweedfs.s3Port }}
              name: s3
            - containerPort: {{ .Values.seaweedfs.filerPort }}
              name: filer
          volumeMounts:
            - name: identities
              mountPath: /etc/seaweedfs
            # 2026-08-25 라이브 실측 결함(#7 작업 중 발견, OpenLDAP의 emptyDir 결함(D20)과
            # 동일 유형): 이 StatefulSet에 `/data`용 PVC가 애초에 없어 `weed server -dir=/data`가
            # 컨테이너의 휘발성 쓰기 레이어에 저장돼 왔다 — S3 인증 도입으로 이 파드를
            # 재시작하자 beluga-lake의 기존 Iceberg 데이터(orders/customers/events_enriched)가
            # 전부 소실됨을 실측 확인(원천 PostgreSQL shop DB는 별도 PVC라 무사, CDC 파이프라인
            # 재가동으로 복구됨). volumeClaimTemplates로 영구 스토리지를 추가해 재발을 막는다.
            - name: seaweedfs-data
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
      volumes:
        - name: identities-template
          configMap:
            name: seaweedfs-s3-identities-template
        - name: identities
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: seaweedfs-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: storage
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.seaweedfs.s3Port }}
      targetPort: {{ .Values.seaweedfs.s3Port }}
      name: s3
    - port: {{ .Values.seaweedfs.filerPort }}
      targetPort: {{ .Values.seaweedfs.filerPort }}
      name: filer
  selector:
    app: seaweedfs
---
# The S3/filer services are a data-plane boundary. Only their named workload
# namespaces (and SeaweedFS itself) can contact these pod ports directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-data-plane-restrict
  namespace: storage
spec:
  podSelector:
    matchLabels:
      app: seaweedfs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: analytics
          podSelector:
            matchLabels:
              app: trino
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: streaming
          podSelector:
            matchLabels:
              app: flink-cluster
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: streaming
          podSelector:
            matchLabels:
              app: flink-sql-submit
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lakehouse
          podSelector:
            matchLabels:
              app: lakekeeper
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lakehouse
          podSelector:
            matchLabels:
              app: lakekeeper-bootstrap
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
          podSelector: {}
        # APISIX is the only externally routed S3/filer proxy. Requests still
        # require a SeaweedFS SigV4 identity; direct workload access is limited
        # to the named data-plane clients above.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-system
          podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: {{ .Values.seaweedfs.s3Port }}
        - protocol: TCP
          port: {{ .Values.seaweedfs.filerPort }}
