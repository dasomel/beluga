apiVersion: v1
kind: Secret
metadata:
  name: superset-config
  namespace: analytics
stringData:
  superset_config.py: |
    import os
    from flask_appbuilder.security.manager import AUTH_OAUTH
    from superset.security import SupersetSecurityManager

    # D-SSDB-1 (2026-11-28 라이브 실측): 이 파일이 SQLALCHEMY_DATABASE_URI를 읽지 않아 Superset이
    # 기본값 sqlite:////app/superset_home/superset.db(emptyDir)로 떠 있었다 — 파드가 바뀔 때마다
    # 사용자·역할·사용자가 만든 차트/대시보드가 사라졌다. Deployment env의 URI를 그대로 쓴다.
    SQLALCHEMY_DATABASE_URI = os.environ["SQLALCHEMY_DATABASE_URI"]

    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = 'Gamma'
    AUTH_ROLES_SYNC_AT_LOGIN = True

    # 이슈 #2: APISIX가 TLS를 종단하고 X-Forwarded-Proto: https로 프록시하므로,
    # ProxyFix 없이는 url_for(_external=True)가 http://...를 생성해 Keycloak이
    # redirect_uri를 거부한다(Invalid parameter: redirect_uri). 기본
    # PROXY_FIX_CONFIG(x_for/x_proto/x_host/x_port/x_prefix=1)로 충분하다.
    ENABLE_PROXY_FIX = True

    # D-J: 키는 복수형(admins/engineers/analysts) — 계정 원천인 LDAP 그룹명을 Keycloak이
    # group-ldap-mapper로 그대로 노출한 값이다.
    AUTH_ROLES_MAPPING = {
        "admins": ["Admin"],
        "engineers": ["Alpha"],
        "analysts": ["Gamma"]
    }

    OAUTH_PROVIDERS = [
        {
            "name": "keycloak",
            "icon": "fa-key",
            "token_key": "access_token",
            "remote_app": {
                "client_id": "superset",
                # D-K(이슈 #104): superset_config.py는 컨테이너 기동 시 파이썬으로 직접
                # 실행되므로, Helm이 값을 구워 넣는 대신 컨테이너 env(secretKeyRef)를
                # os.environ으로 런타임에 읽는다.
                "client_secret": os.environ["SUPERSET_OIDC_CLIENT_SECRET"],
                "client_kwargs": {
                    "scope": "openid profile email groups"
                },
                "server_metadata_url": "https://sso.{{ .Values.baseDomain }}/realms/beluga/.well-known/openid-configuration",
                "api_base_url": "https://sso.{{ .Values.baseDomain }}/realms/beluga/protocol/openid-connect/",
                "access_token_url": "https://sso.{{ .Values.baseDomain }}/realms/beluga/protocol/openid-connect/token",
                "authorize_url": "https://sso.{{ .Values.baseDomain }}/realms/beluga/protocol/openid-connect/auth",
                "jwks_uri": "https://sso.{{ .Values.baseDomain }}/realms/beluga/protocol/openid-connect/certs"
            }
        }
    ]

    class CustomSecurityManager(SupersetSecurityManager):
        def oauth_user_info(self, provider, response=None):
            if provider == "keycloak":
                remote = self.appbuilder.sm.oauth_remotes[provider]
                me = remote.userinfo(token=response) if response else remote.userinfo()
                return {
                    "name": me.get("name", me.get("preferred_username", "")),
                    "email": me.get("email", ""),
                    "id": me.get("sub", ""),
                    "username": me.get("preferred_username", me.get("sub", "")),
                    "first_name": me.get("given_name", ""),
                    "last_name": me.get("family_name", ""),
                    "role_keys": me.get("groups", []),
                }
            return super().oauth_user_info(provider, response)

    CUSTOM_SECURITY_MANAGER = CustomSecurityManager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Superset 6.x는 /app/.venv(비쓰기 권한)에서 실행돼 런타임 pip install이 반영되지 않는다
      # (ModuleNotFoundError: authlib 실측). root initContainer가 별도 디렉터리에 설치하고
      # PYTHONPATH로 주입한다. trino[sqlalchemy]는 apache/superset:6.1.0 이미지에 기본
      # 미포함(실측: import trino → ModuleNotFoundError) — Trino DB 연결·데이터셋 리플렉션에 필요
      # D-ES-30 (#403): pylibs 54280KiB·tmp 78692KiB에 설치/캐시 여유; CA 228KiB에 8Mi.
      # 비용: 단일 파드 퇴거/재생성 중 서비스 중단·임시 데이터 소실(기존 PVC 불변).
      # limit은 마운트 합계 + 쓰기 계층/stdout >=128Mi; request는 실측/미측정 최소 예약.
      # 탈출구: docs/ephemeral-storage-bounds.md 실측 후 예산/보존 재산정; kubelet 주기 검사이지 hard quota 아님.
      initContainers:
        - name: install-authlib
          image: {{ .Values.superset.image }}
          resources:
            requests:
              ephemeral-storage: 192Mi
            limits:
              ephemeral-storage: 1Gi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            # #117 D-RO1: 쓰기는 /pylibs(pylibs emptyDir)와 uv 캐시(/tmp emptyDir)뿐이다. uv 기본 캐시는
            # $HOME/.cache/uv라 읽기 전용 루트에서 실패하므로 UV_CACHE_DIR을 /tmp로 돌린다.
            # 라이브 미검증 가정: --target 설치가 이 외의 경로(venv 등)에 쓰지 않는다.
            # Escape hatch: 기동 실패 시 이 줄과 env/tmp 마운트만 되돌리면 이전 동작이다.
            readOnlyRootFilesystem: true
          env:
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
          # trino 의존성으로 딸려오는 SQLAlchemy 2.x가 PYTHONPATH 선순위로 앱 고정 버전을
          # 가려 ImportError(eagerload) 크래시 (실측) — 앱 venv가 제공하는 코어 패키지는 제거
          # D-SSDB-1: apache/superset 이미지에 Postgres 드라이버가 없다(실측 ModuleNotFoundError: psycopg2).
          command: ["sh", "-c", "uv pip install --target /pylibs authlib 'trino[sqlalchemy]' 'psycopg2-binary==2.9.10' && rm -rf /pylibs/sqlalchemy* /pylibs/SQLAlchemy* /pylibs/greenlet* /pylibs/typing_extensions*"]
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
            - name: tmp
              mountPath: /tmp
        # Codex 리뷰 실측(이슈 #2): REQUESTS_CA_BUNDLE/SSL_CERT_FILE을 내부 CA 단일
        # 파일로 지정하면 PyPI 등 외부 공인 인증서 체인 검증이 깨진다(공인 루트가 빠짐).
        # 이미지 기본 시스템 번들(/etc/ssl/certs/ca-certificates.crt, apache/superset
        # 이미지에 기본 포함)과 내부 CA를 이어붙인 병합 번들을 새 이미지 없이(같은 앱
        # 이미지 재사용) 만든다.
        - name: build-ca-bundle
          image: {{ .Values.superset.image }}
          resources:
            requests:
              ephemeral-storage: 16Mi
            limits:
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            # #117: 쓰기는 ca-bundle emptyDir(/etc/ca-bundle)뿐 — `>`가 덮어쓰므로 재실행 안전.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c", "cat /etc/ssl/certs/ca-certificates.crt /etc/internal-ca/ca.crt > /etc/ca-bundle/ca-bundle.crt"]
          volumeMounts:
            - name: internal-ca
              mountPath: /etc/internal-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/ca-bundle
      containers:
        - name: superset
          image: {{ .Values.superset.image }}
          securityContext:
            allowPrivilegeEscalation: false
            # #117 D-RO1: 쓰기 경로 = /tmp, /app/superset_home(SUPERSET_HOME: 업로드·캐시·로컬 상태).
            # 메타DB는 Postgres라 파일 DB 쓰기는 없다. 라이브 미검증 가정: 이 외 경로 쓰기 없음
            # (.pyc 쓰기 실패는 파이썬이 조용히 무시). Escape hatch: 기동 실패 시 로그의
            # "Read-only file system" 경로를 emptyDir로 추가하거나 이 줄을 제거한다.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - "bash"
            - "-c"
            # D-K(이슈 #104): bash -c 스크립트라 컨테이너 env로 받은 $SUPERSET_ADMIN_PASSWORD를
            # 그대로 셸 변수 확장으로 쓸 수 있다 — Helm 렌더 시점 굽기 불필요.
            # D-ADMIN-2: 로컬(provider=db) 관리자는 superset-admin이다. SSO 사용자 `admin`(keycloak-users
            # D-ADMIN-1)이 FAB의 username 매칭으로 로컬 계정에 붙지 않게 이름을 분리한다(2026-11-28 실측:
            # 로컬 `admin`과 같은 행 id=1로 SSO 로그인됨). 예전 설치의 로컬 `admin` 행은 이제 SSO 사용자의
            # 행이므로 기동마다 무작위 비밀번호로 바꿔 db 로그인 경로를 닫는다(행이 없으면 무시).
            # 비용: 기동 시 명령 1개. 탈출구: SSO `admin`을 폐기하면 reset-password 줄 제거.
            - "superset db upgrade && superset fab create-admin --username superset-admin --firstname Superset --lastname Admin --email superset-admin@beluga.local --password \"$SUPERSET_ADMIN_PASSWORD\" && { superset fab reset-password --username admin --password \"$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')\" >/dev/null 2>&1 || true; } && superset init && superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger"
          env:
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: superset-credential
                  key: secret-key
            - name: SUPERSET_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superset-credential
                  key: admin-password
            - name: SUPERSET_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: superset
            # 이슈 #2: issuer가 https로 전환되면서 authlib(remote.userinfo 등 OAuth HTTP
            # 클라이언트)가 내부 CA를 신뢰해야 한다 — REQUESTS_CA_BUNDLE(authlib는 requests
            # 사용)과 SSL_CERT_FILE(Python ssl 표준 폴백)을 함께 지정한다. Codex 리뷰 실측:
            # 내부 CA 단일 파일이 아니라 build-ca-bundle initContainer가 만든 병합 번들을
            # 가리켜야 PyPI 등 외부 공인 인증서 검증도 계속 통과한다. install-authlib
            # initContainer는 이 env를 상속하지 않는다(initContainer별 env는 독립적) —
            # uv pip install 자체는 이 값의 영향권 밖이라 안전하다.
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/ca-bundle/ca-bundle.crt"
            - name: SSL_CERT_FILE
              value: "/etc/ca-bundle/ca-bundle.crt"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credential
                  key: password
            # D-SSDB-1: 전용 DB. beluga_meta는 Airflow 메타데이터 DB이고 Airflow FAB의 ab_* 테이블이 이미 있어
            # (실측 11개) 같은 이름의 Superset FAB 테이블과 충돌한다. DB는 02-cnpg initdb(신규)와
            # db-roles-setup 훅(기존 클러스터)이 멱등 생성한다. 비용: DB 1개. 탈출구: 이 env를 지우면 SQLite 회귀.
            - name: SQLALCHEMY_DATABASE_URI
              value: "postgresql+psycopg2://beluga_admin:$(PGPASSWORD)@postgres-main-rw.database.svc.cluster.local:5432/superset"
            - name: SUPERSET_CONFIG_PATH
              value: "/app/pythonpath/superset_config.py"
            - name: PYTHONPATH
              value: "/pylibs:/app/pythonpath"
          ports:
            - containerPort: {{ .Values.superset.uiPort }}
              name: http
          resources:
            requests:
              ephemeral-storage: 256Mi
              memory: "1024Mi"
              cpu: "500m"
            limits:
              ephemeral-storage: 1280Mi
              memory: "2048Mi"
              cpu: "1500m"
          volumeMounts:
            - name: superset-config
              mountPath: /app/pythonpath/superset_config.py
              subPath: superset_config.py
            - name: pylibs
              mountPath: /pylibs
            - name: tmp
              mountPath: /tmp
            - name: superset-home
              mountPath: /app/superset_home
            # 이슈 #2: build-ca-bundle initContainer가 만든 병합 번들 — REQUESTS_CA_BUNDLE/
            # SSL_CERT_FILE이 가리키는 실제 파일.
            - name: ca-bundle
              mountPath: /etc/ca-bundle
              readOnly: true
      volumes:
        - name: superset-config
          secret:
            secretName: superset-config
        - name: pylibs
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: superset-home
          emptyDir:
            sizeLimit: 128Mi
        # internal-ca-distribution.yaml이 analytics 네임스페이스에 이미 복제한 ConfigMap —
        # build-ca-bundle initContainer 전용 입력(원본 CA), 메인 컨테이너는 병합 번들만 본다.
        - name: internal-ca
          configMap:
            name: beluga-internal-ca
        - name: ca-bundle
          emptyDir:
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: analytics
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.superset.uiPort }}
      targetPort: {{ .Values.superset.uiPort }}
      name: http
  selector:
    app: superset
