apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-config
  namespace: beluga-data
data:
  superset_config.py: |
    import os
    from flask_appbuilder.security.manager import AUTH_OAUTH
    from superset.security import SupersetSecurityManager

    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = 'Gamma'
    AUTH_ROLES_SYNC_AT_LOGIN = True

    AUTH_ROLES_MAPPING = {
        "admin": ["Admin"],
        "engineer": ["Alpha"],
        "analyst": ["Gamma"]
    }

    OAUTH_PROVIDERS = [
        {
            "name": "keycloak",
            "icon": "fa-key",
            "token_key": "access_token",
            "remote_app": {
                "client_id": "superset",
                "client_secret": {{ .Values.credentials.clientSecrets.superset | quote }},
                "client_kwargs": {
                    "scope": "openid profile email groups"
                },
                "server_metadata_url": "http://sso.local.beluga.internal/realms/beluga/.well-known/openid-configuration",
                "api_base_url": "http://sso.local.beluga.internal/realms/beluga/protocol/openid-connect/",
                "access_token_url": "http://sso.local.beluga.internal/realms/beluga/protocol/openid-connect/token",
                "authorize_url": "http://sso.local.beluga.internal/realms/beluga/protocol/openid-connect/auth",
                "jwks_uri": "http://sso.local.beluga.internal/realms/beluga/protocol/openid-connect/certs"
            }
        }
    ]

    class CustomSecurityManager(SupersetSecurityManager):
        def oauth_user_info(self, provider, response=None):
            if provider == "keycloak":
                remote = self.appbuilder.sm.oauth_remotes[provider]
                me = remote.userinfo(token=response) if response else remote.userinfo()
                return {
                    "name": me.get("name", me.get("preferred_username", "")),
                    "email": me.get("email", ""),
                    "id": me.get("sub", ""),
                    "username": me.get("preferred_username", me.get("sub", "")),
                    "first_name": me.get("given_name", ""),
                    "last_name": me.get("family_name", ""),
                    "role_keys": me.get("groups", []),
                }
            return super().oauth_user_info(provider, response)

    CUSTOM_SECURITY_MANAGER = CustomSecurityManager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: beluga-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      # Superset 6.x는 /app/.venv(비쓰기 권한)에서 실행돼 런타임 pip install이 반영되지 않는다
      # (ModuleNotFoundError: authlib 실측). root initContainer가 별도 디렉터리에 설치하고
      # PYTHONPATH로 주입한다. trino[sqlalchemy]는 apache/superset:6.1.0 이미지에 기본
      # 미포함(실측: import trino → ModuleNotFoundError) — Trino DB 연결·데이터셋 리플렉션에 필요
      initContainers:
        - name: install-authlib
          image: {{ .Values.superset.image }}
          securityContext:
            runAsUser: 0
          command: ["sh", "-c", "uv pip install --target /pylibs authlib 'trino[sqlalchemy]'"]
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
      containers:
        - name: superset
          image: {{ .Values.superset.image }}
          command:
            - "bash"
            - "-c"
            - "superset db upgrade && superset fab create-admin --username admin --firstname Admin --lastname User --email admin@beluga.local --password {{ .Values.credentials.supersetAdminPassword }} && superset init && superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger"
          env:
            - name: SUPERSET_SECRET_KEY
              value: {{ .Values.credentials.supersetSecretKey | quote }}
            - name: SQLALCHEMY_DATABASE_URI
              value: "postgresql://beluga_admin:{{ .Values.credentials.pgPassword }}@postgres-main-rw:5432/beluga_meta"
            - name: SUPERSET_CONFIG_PATH
              value: "/app/pythonpath/superset_config.py"
            - name: PYTHONPATH
              value: "/pylibs:/app/pythonpath"
          ports:
            - containerPort: {{ .Values.superset.uiPort }}
              name: http
          resources:
            requests:
              memory: "1024Mi"
              cpu: "500m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          volumeMounts:
            - name: superset-config
              mountPath: /app/pythonpath/superset_config.py
              subPath: superset_config.py
            - name: pylibs
              mountPath: /pylibs
      volumes:
        - name: superset-config
          configMap:
            name: superset-config
        - name: pylibs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: beluga-data
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.superset.uiPort }}
      targetPort: {{ .Values.superset.uiPort }}
      name: http
  selector:
    app: superset

