apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-config
  namespace: analytics
data:
  superset_config.py: |
    import os
    from flask_appbuilder.security.manager import AUTH_OAUTH
    from superset.security import SupersetSecurityManager

    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = 'Gamma'
    AUTH_ROLES_SYNC_AT_LOGIN = True

    # 이슈 #2: APISIX가 TLS를 종단하고 X-Forwarded-Proto: https로 프록시하므로,
    # ProxyFix 없이는 url_for(_external=True)가 http://...를 생성해 Keycloak이
    # redirect_uri를 거부한다(Invalid parameter: redirect_uri). 기본
    # PROXY_FIX_CONFIG(x_for/x_proto/x_host/x_port/x_prefix=1)로 충분하다.
    ENABLE_PROXY_FIX = True

    # D-J: 키는 복수형(admins/engineers/analysts) — 계정 원천인 LDAP 그룹명을 Keycloak이
    # group-ldap-mapper로 그대로 노출한 값이다.
    AUTH_ROLES_MAPPING = {
        "admins": ["Admin"],
        "engineers": ["Alpha"],
        "analysts": ["Gamma"]
    }

    OAUTH_PROVIDERS = [
        {
            "name": "keycloak",
            "icon": "fa-key",
            "token_key": "access_token",
            "remote_app": {
                "client_id": "superset",
                # D-K(이슈 #104): superset_config.py는 컨테이너 기동 시 파이썬으로 직접
                # 실행되므로, Helm이 값을 구워 넣는 대신 컨테이너 env(secretKeyRef)를
                # os.environ으로 런타임에 읽는다.
                "client_secret": os.environ["SUPERSET_OIDC_CLIENT_SECRET"],
                "client_kwargs": {
                    "scope": "openid profile email groups"
                },
                "server_metadata_url": "https://sso.local.beluga.internal/realms/beluga/.well-known/openid-configuration",
                "api_base_url": "https://sso.local.beluga.internal/realms/beluga/protocol/openid-connect/",
                "access_token_url": "https://sso.local.beluga.internal/realms/beluga/protocol/openid-connect/token",
                "authorize_url": "https://sso.local.beluga.internal/realms/beluga/protocol/openid-connect/auth",
                "jwks_uri": "https://sso.local.beluga.internal/realms/beluga/protocol/openid-connect/certs"
            }
        }
    ]

    class CustomSecurityManager(SupersetSecurityManager):
        def oauth_user_info(self, provider, response=None):
            if provider == "keycloak":
                remote = self.appbuilder.sm.oauth_remotes[provider]
                me = remote.userinfo(token=response) if response else remote.userinfo()
                return {
                    "name": me.get("name", me.get("preferred_username", "")),
                    "email": me.get("email", ""),
                    "id": me.get("sub", ""),
                    "username": me.get("preferred_username", me.get("sub", "")),
                    "first_name": me.get("given_name", ""),
                    "last_name": me.get("family_name", ""),
                    "role_keys": me.get("groups", []),
                }
            return super().oauth_user_info(provider, response)

    CUSTOM_SECURITY_MANAGER = CustomSecurityManager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      # Superset 6.x는 /app/.venv(비쓰기 권한)에서 실행돼 런타임 pip install이 반영되지 않는다
      # (ModuleNotFoundError: authlib 실측). root initContainer가 별도 디렉터리에 설치하고
      # PYTHONPATH로 주입한다. trino[sqlalchemy]는 apache/superset:6.1.0 이미지에 기본
      # 미포함(실측: import trino → ModuleNotFoundError) — Trino DB 연결·데이터셋 리플렉션에 필요
      initContainers:
        - name: install-authlib
          image: {{ .Values.superset.image }}
          securityContext:
            runAsUser: 0
          # trino 의존성으로 딸려오는 SQLAlchemy 2.x가 PYTHONPATH 선순위로 앱 고정 버전을
          # 가려 ImportError(eagerload) 크래시 (실측) — 앱 venv가 제공하는 코어 패키지는 제거
          command: ["sh", "-c", "uv pip install --target /pylibs authlib 'trino[sqlalchemy]' && rm -rf /pylibs/sqlalchemy* /pylibs/SQLAlchemy* /pylibs/greenlet* /pylibs/typing_extensions*"]
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
        # Codex 리뷰 실측(이슈 #2): REQUESTS_CA_BUNDLE/SSL_CERT_FILE을 내부 CA 단일
        # 파일로 지정하면 PyPI 등 외부 공인 인증서 체인 검증이 깨진다(공인 루트가 빠짐).
        # 이미지 기본 시스템 번들(/etc/ssl/certs/ca-certificates.crt, apache/superset
        # 이미지에 기본 포함)과 내부 CA를 이어붙인 병합 번들을 새 이미지 없이(같은 앱
        # 이미지 재사용) 만든다.
        - name: build-ca-bundle
          image: {{ .Values.superset.image }}
          command: ["sh", "-c", "cat /etc/ssl/certs/ca-certificates.crt /etc/internal-ca/ca.crt > /etc/ca-bundle/ca-bundle.crt"]
          volumeMounts:
            - name: internal-ca
              mountPath: /etc/internal-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/ca-bundle
      containers:
        - name: superset
          image: {{ .Values.superset.image }}
          command:
            - "bash"
            - "-c"
            # D-K(이슈 #104): bash -c 스크립트라 컨테이너 env로 받은 $SUPERSET_ADMIN_PASSWORD를
            # 그대로 셸 변수 확장으로 쓸 수 있다 — Helm 렌더 시점 굽기 불필요.
            - "superset db upgrade && superset fab create-admin --username admin --firstname Admin --lastname User --email admin@beluga.local --password \"$SUPERSET_ADMIN_PASSWORD\" && superset init && superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger"
          env:
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: superset-credential
                  key: secret-key
            - name: SUPERSET_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superset-credential
                  key: admin-password
            - name: SUPERSET_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: superset
            # 이슈 #2: issuer가 https로 전환되면서 authlib(remote.userinfo 등 OAuth HTTP
            # 클라이언트)가 내부 CA를 신뢰해야 한다 — REQUESTS_CA_BUNDLE(authlib는 requests
            # 사용)과 SSL_CERT_FILE(Python ssl 표준 폴백)을 함께 지정한다. Codex 리뷰 실측:
            # 내부 CA 단일 파일이 아니라 build-ca-bundle initContainer가 만든 병합 번들을
            # 가리켜야 PyPI 등 외부 공인 인증서 검증도 계속 통과한다. install-authlib
            # initContainer는 이 env를 상속하지 않는다(initContainer별 env는 독립적) —
            # uv pip install 자체는 이 값의 영향권 밖이라 안전하다.
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/ca-bundle/ca-bundle.crt"
            - name: SSL_CERT_FILE
              value: "/etc/ca-bundle/ca-bundle.crt"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credential
                  key: password
            - name: SQLALCHEMY_DATABASE_URI
              value: "postgresql://beluga_admin:$(PGPASSWORD)@postgres-main-rw.database.svc.cluster.local:5432/beluga_meta"
            - name: SUPERSET_CONFIG_PATH
              value: "/app/pythonpath/superset_config.py"
            - name: PYTHONPATH
              value: "/pylibs:/app/pythonpath"
          ports:
            - containerPort: {{ .Values.superset.uiPort }}
              name: http
          resources:
            requests:
              memory: "1024Mi"
              cpu: "500m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          volumeMounts:
            - name: superset-config
              mountPath: /app/pythonpath/superset_config.py
              subPath: superset_config.py
            - name: pylibs
              mountPath: /pylibs
            # 이슈 #2: build-ca-bundle initContainer가 만든 병합 번들 — REQUESTS_CA_BUNDLE/
            # SSL_CERT_FILE이 가리키는 실제 파일.
            - name: ca-bundle
              mountPath: /etc/ca-bundle
              readOnly: true
      volumes:
        - name: superset-config
          configMap:
            name: superset-config
        - name: pylibs
          emptyDir: {}
        # internal-ca-distribution.yaml이 analytics 네임스페이스에 이미 복제한 ConfigMap —
        # build-ca-bundle initContainer 전용 입력(원본 CA), 메인 컨테이너는 병합 번들만 본다.
        - name: internal-ca
          configMap:
            name: beluga-internal-ca
        - name: ca-bundle
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: analytics
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.superset.uiPort }}
      targetPort: {{ .Values.superset.uiPort }}
      name: http
  selector:
    app: superset

