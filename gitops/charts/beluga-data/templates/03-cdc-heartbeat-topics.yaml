# D-WAL-4: 운영 heartbeat 토픽은 broker auto-create 기본값에 의존하지 않고 GitOps가 만든다.
# 비용: RF=1은 기존 dev Kafka와 같은 내구성. 탈출구: HA 전환 시 RF와 ISR을 함께 올린다.
# Flink는 아래 업무 토픽만 소비하고 heartbeat 두 토픽은 소비하지 않는다.
# D-TOPIC-1: 기존 자동 생성 토픽 채택 — broker RF=1, topic.creation.* 재정의 없음.
# num.partitions는 미고정(Kafka 기본 1 추정): partitions 생략으로 기존 값을 보존한다.
# 비용: partition 수 GitOps 고정은 유보. 탈출구: sync 전 실측 후 별도 변경으로 고정.
# D-TOPIC-2: CDC 7일은 group-offsets 재시작 여유, events/heartbeat 1일은 데모 디스크 절약.
# 비용: CDC 디스크 증가·기간 밖 재처리 불가. 탈출구: lag/용량 실측 후 보존/PVC 재산정.
{{- range $topic := list (dict "name" "cdc-shop-heartbeat-table" "topic" "cdc.shop.public.cdc_heartbeat" "partitions" 1 "retention" 86400000) (dict "name" "cdc-shop-heartbeat" "topic" "__debezium-heartbeat.cdc.shop" "partitions" 1 "retention" 86400000) (dict "name" "cdc-shop-orders" "topic" "cdc.shop.public.orders" "retention" 604800000) (dict "name" "cdc-shop-customers" "topic" "cdc.shop.public.customers" "retention" 604800000) (dict "name" "events-clickstream" "topic" "events.clickstream" "retention" 86400000) }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ $topic.name }}
  namespace: streaming
  labels:
    strimzi.io/cluster: beluga-kafka
spec:
  topicName: {{ $topic.topic | quote }}
  {{- if hasKey $topic "partitions" }}
  partitions: {{ $topic.partitions }}
  {{- end }}
  replicas: 1
  config:
    cleanup.policy: delete
    retention.ms: {{ $topic.retention }}
    segment.ms: 3600000
{{- end }}
