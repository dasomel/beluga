apiVersion: v1
kind: Namespace
metadata:
  name: storage
---
apiVersion: v1
kind: Namespace
metadata:
  name: streaming
---
apiVersion: v1
kind: Namespace
metadata:
  name: lakehouse
---
apiVersion: v1
kind: Namespace
metadata:
  name: analytics
---
apiVersion: v1
kind: Namespace
metadata:
  name: orchestration
---
apiVersion: v1
kind: Namespace
metadata:
  name: governance
