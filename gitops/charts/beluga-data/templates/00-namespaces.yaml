# 네임스페이스 재편: beluga-data(단일) → 기능별 네임스페이스로 분리 (narwhal 컨벤션 정합)
# ArgoCD Application의 syncOptions: CreateNamespace=true는 Application 자신의
# destination.namespace만 보장하므로, 차트가 실제로 사용하는 나머지 네임스페이스는
# 여기서 명시적으로 선언한다 (cert-manager Namespace 선언과 동일한 패턴, beluga-platform/templates/platform-services.yaml 참조)
# D-ES-NS-1: 첫 설치에서 LimitRange(-4)보다 먼저 생성한다.
# 비용: namespace 생성이 선행 wave로 이동. 탈출구: 동일 선행 순서를 유지하며 재조정.
apiVersion: v1
kind: Namespace
metadata:
  name: database
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: Namespace
metadata:
  name: storage
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: Namespace
metadata:
  name: streaming
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: Namespace
metadata:
  name: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: Namespace
metadata:
  name: analytics
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: Namespace
metadata:
  name: orchestration
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: Namespace
metadata:
  name: governance
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
