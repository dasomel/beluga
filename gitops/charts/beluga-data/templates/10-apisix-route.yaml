            redirect_uri: {{ printf "https://%s%s" (include "beluga.ssoHost" (dict "host" $filerEp.host "root" $)) $filerEp.redirectPath | quote }}
            logout_path: {{ $filerEp.logoutPath | default "/logout" | quote }}
            ssl_verify: true
            set_userinfo_header: {{ if $filerEp.allowedGroups }}true{{ else }}false{{ end }}
