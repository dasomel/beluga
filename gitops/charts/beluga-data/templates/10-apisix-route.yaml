  name: flink
  namespace: streaming
spec:
  externalNodes:
    - type: Domain
      name: flink-cluster-rest.streaming.svc.cluster.local
      port: 8081
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: flink
  namespace: streaming
spec:
  http:
