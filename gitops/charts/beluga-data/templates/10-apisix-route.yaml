# Lakekeeper (Iceberg REST Catalog)
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: lakekeeper
  namespace: lakehouse
spec:
  externalNodes:
    - type: Domain
      name: lakekeeper.lakehouse.svc.cluster.local
      port: {{ .Values.lakekeeper.port }}
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: lakekeeper
  namespace: lakehouse
spec:
  http:
    # D-SSO-2: Lakekeeper Iceberg REST / management / health API paths remain plugin-free with higher priority
    # Reason: API clients (Trino, Flink, automation) carry bearer tokens or need anonymous health probes;
    # Cost: UI and API routes are split with priority ordering; Escape hatch: bypassPathPrefixes in sso.yaml
    - name: lakekeeper-api
      priority: 10
      match:
        hosts:
          - {{ (include "beluga.ssoHost" (dict "host" $catalogApiEp.host "root" $)) }}
        paths:
          {{- range $catalogApiEp.bypassPathPrefixes }}
          - {{ . | quote }}
          {{- end }}
      upstreams:
        - name: lakekeeper
      plugins:
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                X-Content-Type-Options: "nosniff"
    # D-SSO-2: Lakekeeper UI (/* catch-all) with lower priority
    # Reason: Lakekeeper Web UI lacks native authentication; redirect and non-API assets must pass through OIDC.
    # Cost: APISIX session state; Escape hatch: mode in sso.yaml (setting mode: none removes openid-connect)
    - name: lakekeeper-ui
      priority: 1
      match:
        hosts:
          - {{ (include "beluga.ssoHost" (dict "host" $catalogUiEp.host "root" $)) }}
        paths:
          {{- range $catalogUiEp.protectedPathPrefixes }}
          - {{ . | quote }}
          {{- end }}
      upstreams:
        - name: lakekeeper
      plugins:
        {{- if eq $catalogUiEp.mode "gateway-oidc" }}
        - name: openid-connect
          enable: true
          config:
            discovery: "https://sso.{{ .Values.baseDomain }}/realms/{{ $realm }}/.well-known/openid-configuration"
            bearer_only: false
            realm: {{ $realm | quote }}
            client_id: {{ $catalogUiEp.clientId | quote }}
            client_secret: "$env://APISIX_OIDC_CLIENT_SECRET"
            session:
              secret: "$env://APISIX_OIDC_SESSION_SECRET"
              {{- if $catalogUiEp.allowedGroups }}
              absolute_timeout: 3600
              {{- end }}
            redirect_uri: {{ printf "https://%s%s" (include "beluga.ssoHost" (dict "host" $catalogUiEp.host "root" $)) $catalogUiEp.redirectPath | quote }}
            logout_path: {{ $catalogUiEp.logoutPath | default "/logout" | quote }}
            ssl_verify: true
            set_userinfo_header: {{ if $catalogUiEp.allowedGroups }}true{{ else }}false{{ end }}
            scope: "openid profile email"
        - name: proxy-rewrite
          enable: true
          config:
            headers:
              remove:
                {{- if not $catalogUiEp.allowedGroups }}
                - "X-Userinfo"
                {{- end }}
                - "X-Access-Token"
                - "X-ID-Token"
        {{- if $catalogUiEp.allowedGroups }}
        # D-MSSO-14: X-Userinfo는 위 proxy-rewrite(rewrite 단계)가 아니라 아래 Lua(access 단계)가 검사 후 제거한다.
        {{- include "beluga.ssoGroupGuard" $catalogUiEp.allowedGroups | trim | nindent 8 }}
        {{- end }}
        {{- end }}
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                X-Content-Type-Options: "nosniff"
