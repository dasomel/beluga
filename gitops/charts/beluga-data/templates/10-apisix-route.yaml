            redirect_uri: {{ printf "https://%s%s" (include "beluga.ssoHost" (dict "host" $flinkEp.host "root" $)) $flinkEp.redirectPath | quote }}
            logout_path: {{ $flinkEp.logoutPath | default "/logout" | quote }}
            ssl_verify: true
            set_userinfo_header: {{ if $flinkEp.allowedGroups }}true{{ else }}false{{ end }}
            scope: "openid profile email"
        - name: proxy-rewrite
          enable: true
          config:
            headers:
              remove:
                {{- if not $flinkEp.allowedGroups }}
                - "X-Userinfo"
                {{- end }}
                - "X-Access-Token"
                - "X-ID-Token"
        {{- if $flinkEp.allowedGroups }}
        # D-MSSO-14: X-Userinfo는 위 proxy-rewrite(rewrite 단계)가 아니라 아래 Lua(access 단계)가 검사 후 제거한다.
        {{- include "beluga.ssoGroupGuard" $flinkEp.allowedGroups | trim | nindent 8 }}
