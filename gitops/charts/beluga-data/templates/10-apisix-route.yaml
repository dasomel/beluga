# D11: APISIX Routes — narwhal ApisixUpstream + ApisixRoute 패턴
# 각 서비스별 Upstream(externalNodes) + Route(host-based) 분리 정의
# 모든 서비스는 *.local.beluga.internal:80 으로 통일 접근
---
# Trino Coordinator
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: trino
  namespace: analytics
spec:
  externalNodes:
    - type: Domain
      name: trino.analytics.svc.cluster.local
      port: {{ .Values.trino.port }}
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: trino
  namespace: analytics
spec:
  http:
    - name: trino
      match:
        hosts:
          - trino.{{ .Values.baseDomain }}
        paths:
          - "/*"
      upstreams:
        - name: trino
      plugins:
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                X-Content-Type-Options: "nosniff"
                X-Frame-Options: "SAMEORIGIN"
---
