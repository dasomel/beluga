# D11: APISIX Routes — narwhal ApisixUpstream + ApisixRoute 패턴
# 각 서비스별 Upstream(externalNodes) + Route(host-based) 분리 정의
# 모든 서비스는 *.local.beluga.internal:80 으로 통일 접근
---
# Trino Coordinator
# Task 16 최종 리뷰 C-1(실측): 코디네이터가 OAuth2 인증을 켠 뒤로는
# http-server.process-forwarded=true 때문에 APISIX가 넘기는
# X-Forwarded-Proto: http를 그대로 신뢰해 요청을 insecure로 판정하고
# 403 Forbidden(Authentication over HTTP is not enabled)으로 거부한다 —
# 문서화된 유일한 진입점(포트 80)이 이 커밋 전까지 완전히 막혀 있었다.
# 업스트림을 코디네이터의 실제 TLS 리스너(8443, Task 15가 발급한
# cert-manager 인증서)로 올려 이 경로 자체를 HTTPS로 만든다.
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: trino
  namespace: analytics
spec:
  scheme: https
  externalNodes:
    - type: Domain
      name: trino.analytics.svc.cluster.local
      port: 8443
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: trino
  namespace: analytics
spec:
  http:
    - name: trino
      match:
        hosts:
          - trino.{{ .Values.baseDomain }}
        paths:
          - "/*"
      upstreams:
        - name: trino
      plugins:
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                X-Content-Type-Options: "nosniff"
                X-Frame-Options: "SAMEORIGIN"
---
