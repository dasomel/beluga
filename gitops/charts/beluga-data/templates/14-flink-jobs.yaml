# D3: Flink SQL 제출 Job — 세션 클러스터(flink-cluster-rest:8081)에 SQL 파일 순차 제출
---
{{- define "beluga-data.hook.flink-sql-files" -}}
{{- if .Values.flink.sqlJobsEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-sql-files
  namespace: streaming
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
data:
  events_sessionization.sql: |-
{{ .Files.Get "files/flink-sql/events_sessionization.sql" | replace "__LK_AUTH_OPTIONS__" (ternary "    'rest.auth.type' = 'oauth2',\n    'oauth2-server-uri' = 'http://keycloak.iam.svc.cluster.local:8080/realms/beluga/protocol/openid-connect/token',\n    'credential' = '__FLINK_LAKEKEEPER_CREDENTIAL__',\n    'scope' = 'lakekeeper',\n" "" .Values.lakekeeper.openfga.enabled) | indent 4 }}
  cdc_orders.sql: |-
{{ .Files.Get "files/flink-sql/cdc_orders.sql" | replace "__LK_AUTH_OPTIONS__" (ternary "    'rest.auth.type' = 'oauth2',\n    'oauth2-server-uri' = 'http://keycloak.iam.svc.cluster.local:8080/realms/beluga/protocol/openid-connect/token',\n    'credential' = '__FLINK_LAKEKEEPER_CREDENTIAL__',\n    'scope' = 'lakekeeper',\n" "" .Values.lakekeeper.openfga.enabled) | indent 4 }}
  cdc_customers.sql: |-
{{ .Files.Get "files/flink-sql/cdc_customers.sql" | replace "__LK_AUTH_OPTIONS__" (ternary "    'rest.auth.type' = 'oauth2',\n    'oauth2-server-uri' = 'http://keycloak.iam.svc.cluster.local:8080/realms/beluga/protocol/openid-connect/token',\n    'credential' = '__FLINK_LAKEKEEPER_CREDENTIAL__',\n    'scope' = 'lakekeeper',\n" "" .Values.lakekeeper.openfga.enabled) | indent 4 }}
{{- end }}
{{- end }}
{{ include "beluga-data.hook.flink-sql-files" . }}

---
{{- define "beluga-data.hook.flink-sql-submit" -}}
{{- if .Values.flink.sqlJobsEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: flink-sql-submit
  namespace: streaming
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: flink-sql-submit
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        seccompProfile:
          type: RuntimeDefault
      # D-ES-36 (#403): 실측 없음: SQL 렌더 16Mi + 기존 flink-log 512Mi + JVM tmp 256Mi, 단기 제출 예산.
      # 비용: Job 퇴거 시 재시도/재동기화 필요(진행 중 작업 중단).
      # limit은 마운트 합계 + 쓰기 계층/stdout >=128Mi; request는 실측/미측정 최소 예약.
      # 탈출구: docs/ephemeral-storage-bounds.md 실측 후 예산/보존 재산정; kubelet 주기 검사이지 hard quota 아님.
      containers:
        - name: submit-sql
          image: ghcr.io/dasomel/beluga-flink:sha-7b897d214759c3c0989b4338fa91b4bac05c3dab@sha256:d3a9b60ac8e0ae919787d67da21ab10aaeea2aa06fba3c6d2d489e088eb030c7
          securityContext:
            allowPrivilegeEscalation: false
            # #117 D-RO3: 쓰기 경로 = /work/flink-sql(렌더 SQL),
            # /opt/flink/log(sql-client 로그), /tmp(sql-client 임시/블롭). 라이브 미검증 가정:
            # sql-client -f가 이 외(예: $HOME 히스토리·conf)에 쓰지 않는다.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: FLINK_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: flink-s3-credential
                  key: access-key
            - name: FLINK_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flink-s3-credential
                  key: secret-key
            {{- if .Values.lakekeeper.openfga.enabled }}
            - name: FLINK_LAKEKEEPER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-flink-client-secret
                  key: flink
            {{- end }}
          resources:
            requests:
              ephemeral-storage: 128Mi
              cpu: 250m
              memory: 512Mi
            limits:
              ephemeral-storage: 1Gi
              cpu: 1000m
              memory: 1536Mi
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /work/flink-sql
              for src in /sql-src/*.sql; do
                sed \
                  -e "s|__FLINK_S3_ACCESS_KEY__|${FLINK_S3_ACCESS_KEY}|g" \
                  -e "s|__FLINK_S3_SECRET_KEY__|${FLINK_S3_SECRET_KEY}|g" \
                  {{- if .Values.lakekeeper.openfga.enabled }}
                  -e "s|__FLINK_LAKEKEEPER_CREDENTIAL__|flink:${FLINK_LAKEKEEPER_CLIENT_SECRET}|g" \
                  {{- end }}
                  "${src}" > "/work/flink-sql/$(basename "${src}")"
              done
              echo "Waiting for Lakekeeper warehouse lake..."
              {{- if .Values.lakekeeper.openfga.enabled }}
              LK_TOKEN=""
              for attempt in $(seq 1 60); do
                LK_TOKEN=$(curl -fsS -u "flink:${FLINK_LAKEKEEPER_CLIENT_SECRET}" \
                  -d grant_type=client_credentials \
                  "http://keycloak.iam.svc.cluster.local:8080/realms/beluga/protocol/openid-connect/token" 2>/dev/null \
                  | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p' || true)
                [ -n "${LK_TOKEN}" ] && break
                sleep 5
              done
              test -n "${LK_TOKEN}"
              until curl -fsS -H "Authorization: Bearer ${LK_TOKEN}" \
                http://lakekeeper.lakehouse.svc.cluster.local:8181/management/v1/warehouse \
                | grep -q '"name":"lake"'; do sleep 5; done
              {{- else }}
              until curl -fsS http://lakekeeper.lakehouse.svc.cluster.local:8181/management/v1/warehouse | grep -q '"name":"lake"'; do sleep 5; done
              {{- end }}
              echo "Waiting for Flink session cluster REST API (flink-cluster-rest:8081)..."
              until curl -sf http://flink-cluster-rest:8081/overview > /dev/null; do
                echo "Flink REST API not ready yet, retrying in 5 seconds..."
                sleep 5
              done
              echo "Flink Session Cluster is ready. Submitting SQL jobs..."

              # 이슈 #114: 이 훅은 ArgoCD sync마다 재실행된다 — 아래 사전 체크가 없으면
              # INSERT INTO가 sync마다 새 스트리밍 잡으로 재제출되어 동일 파이프라인의
              # 미관리 잡이 계속 쌓인다. jobs/overview에서 파일별 pipeline.name과 동일한
              # 이름의 잡이 활성 상태면 건너뛰어 재실행을 안전(idempotent)하게 만든다.
              # flink:1.20 이미지에는 jq가 없어 grep/sed로 파싱한다 — jobs/overview 응답은
              # {"jobs":[{"jid":"...","name":"...","state":"RUNNING",...}, ...]} 형태라
              # '{' 기준으로 줄을 쪼개면 name/state가 같은 줄에 남는다 — Flink JobDetails 직렬화 순서상
              # name, state가 중첩 객체 tasks보다 앞에 오기 때문 (실측; 순서가 바뀌면 파싱이 깨진다).
              # D2: 활성 상태 = RUNNING/CREATED/INITIALIZING/RESTARTING/RECONCILING/CANCELLING/
              # FAILING. FAILED/CANCELED/FINISHED는 의도적으로 제외 — 이미 죽은 파이프라인의
              # 재제출은 사고가 아니라 원하는 자동 복구 동작이다.
              ACTIVE_STATE_RE='"state":"(RUNNING|CREATED|INITIALIZING|RESTARTING|RECONCILING|CANCELLING|FAILING)"'

              # $1: jobs/overview 응답 본문(이미 fetch된 문자열), $2: pipeline name.
              # sh에는 pipefail이 없어, curl 실패를 이 파이프라인 안에 두면 마지막 단계(sed)가
              # 빈 입력에도 exit 0을 내 실패가 조용히 삼켜진다 — 그래서 curl은 이 함수 밖,
              # submit()에서 fail-closed로 별도 처리한다. `|| true`는 grep이 매치 0건일 때
              # set -e 아래에서 함수 자체가 죽지 않게 하는 방어용.
              active_job_state() {
                overview="$1"
                name="$2"
                printf '%s' "${overview}" \
                  | tr '{' '\n' \
                  | grep -F "\"name\":\"${name}\"" \
                  | grep -oE "${ACTIVE_STATE_RE}" \
                  | head -1 \
                  | sed -E 's/.*"state":"([A-Z]+)".*/\1/' || true
              }

              echo "Checking for unmanaged active jobs (이슈 #114 안전장치 — beluga- 접두사가 아닌 활성 잡은 건드리지 않고 경고만 남긴다)..."
              GUARD_OVERVIEW=$(curl -sf http://flink-cluster-rest:8081/jobs/overview 2>/dev/null) || GUARD_OVERVIEW=""
              if [ -n "${GUARD_OVERVIEW}" ]; then
                UNMANAGED=$(printf '%s' "${GUARD_OVERVIEW}" \
                  | tr '{' '\n' \
                  | grep -E "${ACTIVE_STATE_RE}" \
                  | grep -oE '"name":"[^"]*"' \
                  | grep -v '"name":"beluga-' \
                  | sort -u) || true
                if [ -n "${UNMANAGED}" ]; then
                  echo "WARN: unmanaged active jobs present, not touching: ${UNMANAGED}"
                fi
              else
                echo "WARN: jobs/overview query FAILED during legacy-job guard — skipping advisory check (제출 게이트는 별도 fail-closed 처리됨)"
              fi

              # sql-client는 SQL 오류에도 exit 0일 수 있음 — 출력의 [ERROR]를 게이트로 (green-gate 실측)
              submit() {
                file="$1"
                name="beluga-$(basename "${file}" .sql)"
                # P0 fail-closed: REST 조회 자체가 실패하면 활성 여부를 알 수 없으므로
                # "없다"로 간주해 제출하지 않는다 — 일시적 REST 장애 때 중복 제출되는 사고 방지.
                OVERVIEW=$(curl -sf http://flink-cluster-rest:8081/jobs/overview 2>/dev/null) || {
                  echo "jobs/overview query FAILED — refusing to submit ${name} (fail-closed, 이슈 #114)"
                  exit 1
                }
                state=$(active_job_state "${OVERVIEW}" "${name}")
                if [ -n "${state}" ]; then
                  echo "SKIP ${name} already ${state}"
                  return
                fi
                echo "SUBMIT ${name}"
                OUT=$(/opt/flink/bin/sql-client.sh -Drest.address=flink-cluster-rest -Drest.port=8081 -f "${file}" 2>&1)
                echo "$OUT" | tail -20
                if echo "$OUT" | grep -q "\[ERROR\]"; then
                  echo "SQL submission FAILED for ${file}"; exit 1
                fi
              }
              submit /work/flink-sql/events_sessionization.sql
              submit /work/flink-sql/cdc_orders.sql
              submit /work/flink-sql/cdc_customers.sql
              echo "Flink SQL jobs submitted successfully."
          volumeMounts:
            - name: sql-files
              mountPath: /sql-src
              readOnly: true
            - name: rendered-sql-files
              mountPath: /work/flink-sql
            - name: flink-log
              mountPath: /opt/flink/log
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sql-files
          configMap:
            name: flink-sql-files
        - name: rendered-sql-files
          emptyDir:
            sizeLimit: 16Mi
        # #117 D-RO6: sql-client 로그 전용(제출 Job 1회성). 512Mi는 보수적 상한이며 초과 시 파드 eviction.
        - name: flink-log
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
{{- end }}
{{- end }}
{{ include "beluga-data.hook.flink-sql-submit" . }}
