# KubernetesPodOperator가 파드를 생성·관찰하기 위한 최소 RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow
  namespace: orchestration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-pod-operator
  namespace: orchestration
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/status"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-pod-operator
  namespace: orchestration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-pod-operator
subjects:
  - kind: ServiceAccount
    name: airflow
    namespace: orchestration
---
# 네임스페이스 재편(platform-system/iam/database/...) 이후 iceberg_maintenance DAG의
# KubernetesPodOperator가 analytics 네임스페이스(trino와 동일)에 파드를 띄운다
# (트리노를 short-name(`trino:8080`)으로 호출하려면 같은 네임스페이스여야 함) —
# ServiceAccount는 orchestration에 그대로 두고 analytics에 별도 Role/RoleBinding으로 권한만 부여
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-pod-operator
  namespace: analytics
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/status"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-pod-operator
  namespace: analytics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-pod-operator
subjects:
  - kind: ServiceAccount
    name: airflow
    namespace: orchestration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-webserver-config
  namespace: orchestration
data:
  webserver_config.py: |
    import os
    from flask_appbuilder.security.manager import AUTH_OAUTH

    # Airflow 3 FAB auth manager Keycloak OIDC integration (D13)
    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = 'Viewer'

    # apache/airflow#54098: Airflow 3 Keycloak role mapping bug.
    # AUTH_ROLES_MAPPING / AUTH_ROLES_SYNC_AT_LOGIN are omitted to restrict integration to login-only.
    OAUTH_PROVIDERS = [
        {
            "name": "keycloak",
            "icon": "fa-key",
            "token_key": "access_token",
            "remote_app": {
                "client_id": "airflow",
                # D-K(이슈 #104): webserver_config.py는 컨테이너 기동 시 파이썬으로 직접
                # 실행되므로, Helm이 값을 구워 넣는 대신 컨테이너 env(secretKeyRef)를
                # os.environ으로 런타임에 읽는다.
                "client_secret": os.environ["AIRFLOW_OIDC_CLIENT_SECRET"],
                "api_base_url": "https://sso.{{ .Values.baseDomain }}/realms/beluga/protocol/openid-connect",
                "access_token_url": "https://sso.{{ .Values.baseDomain }}/realms/beluga/protocol/openid-connect/token",
                "authorize_url": "https://sso.{{ .Values.baseDomain }}/realms/beluga/protocol/openid-connect/auth",
                "server_metadata_url": "https://sso.{{ .Values.baseDomain }}/realms/beluga/.well-known/openid-configuration",
                "client_kwargs": {
                    "scope": "openid email profile"
                },
            },
        }
    ]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-dags
  namespace: orchestration
data:
  iceberg_maintenance.py: |
{{ .Files.Get "files/dags/iceberg_maintenance.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      serviceAccountName: airflow
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Codex 리뷰 실측(이슈 #2): 메인 컨테이너가 기동 커맨드에서 곧바로 `pip install`을
      # 하는데, REQUESTS_CA_BUNDLE이 내부 CA 단일 파일이면 pip가 PyPI 공인 인증서를
      # 검증하지 못해 기동 자체가 실패한다. pip install보다 먼저 끝나야 하므로
      # initContainer로 병합 번들을 만든다(새 이미지 없이 같은 앱 이미지 재사용).
      initContainers:
        - name: build-ca-bundle
          image: {{ .Values.airflow.image }}
          securityContext:
            allowPrivilegeEscalation: false
            # #117: 쓰기는 ca-bundle emptyDir(/etc/ca-bundle)뿐 — `>`가 덮어쓰므로 재실행 안전.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c", "cat /etc/ssl/certs/ca-certificates.crt /etc/internal-ca/ca.crt > /etc/ca-bundle/ca-bundle.crt"]
          volumeMounts:
            - name: internal-ca
              mountPath: /etc/internal-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/ca-bundle
        # #117 D-RO2: 메인 컨테이너를 읽기 전용 루트로 돌리면 기동 커맨드의 `pip install`이
        # 사용자 사이트(/home/airflow/.local — 공식 이미지는 airflow 자체도 여기에 설치됨)에
        # 쓸 수 없다. emptyDir를 그냥 덮으면 설치된 airflow가 가려지므로, 같은 이미지로
        # 홈 디렉터리를 먼저 emptyDir에 복사해 두고 메인이 그 위에서 pip install 한다.
        # `cp -a SRC/. DST/`는 비루트 UID가 루트 소유 emptyDir 루트의 시간을 보존하려다 실패하므로
        # 최상위 항목만 복사한다(`-exec … +`: `\;`와 달리 cp 실패가 find 종료코드로 전파된다). Cost: 기동 시 홈 복사 시간/디스크 — 실측 du -sh /home/airflow
        # = 1.9G라 sizeLimit 4Gi(복사 + 런타임 pip 여유). ephemeral-storage request는 노드 용량을
        # 모르는 Vagrant에서 Pending 위험이라 넣지 않았다(후속 과제). Escape hatch: 메인의
        # readOnlyRootFilesystem과 이 initContainer, airflow-home 마운트를 함께 제거하거나,
        # 의존성(authlib·cncf-kubernetes)을 내장한 이미지를 빌드해 홈 복사를 없앤다.
        # 라이브 미검증 가정: pip가 /home/airflow/.local(사용자 사이트)에 설치한다.
        - name: copy-airflow-home
          image: {{ .Values.airflow.image }}
          securityContext:
            # 50000 = 공식 airflow 이미지의 airflow 사용자(문서화된 UID). 신규 runAsNonRoot 갭을 만들지 않는다.
            runAsNonRoot: true
            runAsUser: 50000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c", "set -e; find /home/airflow -mindepth 1 -maxdepth 1 -exec cp -a -t /airflow-home/ {} +"]
          volumeMounts:
            - name: airflow-home
              mountPath: /airflow-home
      containers:
        - name: airflow
          image: {{ .Values.airflow.image }}
          securityContext:
            allowPrivilegeEscalation: false
            # #117 D-RO2: 쓰기 경로 = /home/airflow(pip 사용자 설치·캐시), /opt/airflow(airflow.cfg
            # 자동 생성·logs·pid; dags/webserver_config.py subPath는 그 위에 겹쳐 마운트), /tmp.
            # 라이브 미검증 가정: 이 외 경로 쓰기 없음. Escape hatch는 위 copy-airflow-home 주석.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - "bash"
            - "-c"
            - |
              cleanup() {
                trap - SIGTERM SIGINT EXIT
                kill -TERM $(jobs -p) 2>/dev/null || true
                wait 2>/dev/null || true
              }
              trap cleanup SIGTERM SIGINT EXIT

              pip install --no-cache-dir authlib apache-airflow-providers-cncf-kubernetes && \
              airflow db migrate && \
              airflow fab-db migrate || exit 1

              airflow scheduler &
              airflow dag-processor &
              airflow triggerer &
              airflow api-server &

              wait -n
              EXIT_CODE=$?
              cleanup
              [ "${EXIT_CODE}" -eq 0 ] && EXIT_CODE=1
              exit "${EXIT_CODE}"
          env:
            # D-AIRFLOW-EXECUTOR: Airflow 3 런타임 실행자(Executor) 구성
            # Reason: 과거 'airflow standalone'은 내부 standalone_command.py:180-181에서 비-로컬
            # 실행자를 LocalExecutor로 강제했으나, 직접 프로세스 분리 기동(scheduler/dag-processor/
            # triggerer/api-server)으로 전환하면서 선언값(KubernetesExecutor)이 실제 적용됨.
            # KubernetesExecutor는 default 네임스페이스 pods CRUD RBAC 부재로 scheduler가 403 Forbidden
            # 에러와 함께 CrashLoopBackOff에 빠지므로, 실제 런타임 동작 보존을 위해 LocalExecutor로 명시.
            # Cost: 단일 파드 내 멀티프로세스로 태스크를 실행하므로 분산 워커 파드 확장성에 제약.
            # Escape hatch: 분산 실행 필요 시 orchestration 네임스페이스 전용 Role/RoleBinding,
            # pod_template_file 생성 및 AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE=orchestration 설정 후 전환.
            - name: AIRFLOW__CORE__EXECUTOR
              value: {{ .Values.airflow.executor | default "LocalExecutor" | quote }}
            # AIRFLOW__CORE__EXECUTION_API_SERVER_URL 제거 근거:
            # LocalExecutor 환경에서는 모든 태스크 러너가 동일 컨테이너 내에서 실행되므로
            # BaseExecutor.get_execution_api_server_url() 기본값인 http://localhost:8080/execution/
            # (루프백)으로 충분하며, ClusterIP Service FQDN 경유에 따른 Cilium 서비스 프록시 의존성,
            # DNS 해석 지연 및 서비스 엔드포인트 미등록 시점의 초기화 실패 위험을 제거하기 위해 명시 변수 삭제.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credential
                  key: password
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://beluga_admin:$(PGPASSWORD)@postgres-main-rw.database.svc.cluster.local:5432/beluga_meta"
            - name: AIRFLOW_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: airflow
            # 이슈 #2: issuer가 https로 전환되면서 authlib(webserver_config.py의 OAuth
            # 클라이언트)가 내부 CA를 신뢰해야 한다 — superset과 동일한 이유로 두 변수를 함께
            # 지정한다. Codex 리뷰 실측: 내부 CA 단일 파일이 아니라 build-ca-bundle
            # initContainer가 만든 병합 번들을 가리켜야 pip install(기동 커맨드 일부)의
            # PyPI 공인 인증서 검증도 계속 통과한다.
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/ca-bundle/ca-bundle.crt"
            - name: SSL_CERT_FILE
              value: "/etc/ca-bundle/ca-bundle.crt"
            # 이슈 #2: APISIX가 TLS를 종단하고 X-Forwarded-Proto: https로 프록시하므로,
            # ProxyFix 없이는 웹서버가 생성하는 redirect_uri가 http://...가 되어 Keycloak이
            # 거부한다(Invalid parameter: redirect_uri). Airflow 3.3.0 실측 키는
            # [fab] enable_proxy_fix ([webserver] 아님).
            - name: AIRFLOW__FAB__ENABLE_PROXY_FIX
              value: "True"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW__CORE__AUTH_MANAGER
              value: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
            - name: AIRFLOW__FAB__WEBSERVER_CONFIG
              value: "/opt/airflow/webserver_config.py"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /api/v2/monitor/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "1024Mi"
              cpu: "500m"
            limits:
              memory: "2048Mi"
              cpu: "1000m"
          volumeMounts:
            - name: airflow-home
              mountPath: /home/airflow
            - name: airflow-state
              mountPath: /opt/airflow
            - name: tmp
              mountPath: /tmp
            - name: webserver-config
              mountPath: /opt/airflow/webserver_config.py
              subPath: webserver_config.py
            - name: airflow-dags
              mountPath: /opt/airflow/dags/iceberg_maintenance.py
              subPath: iceberg_maintenance.py
            # 이슈 #2: build-ca-bundle initContainer가 만든 병합 번들 — REQUESTS_CA_BUNDLE/
            # SSL_CERT_FILE이 가리키는 실제 파일.
            - name: ca-bundle
              mountPath: /etc/ca-bundle
              readOnly: true
      volumes:
        - name: webserver-config
          configMap:
            name: airflow-webserver-config
        - name: airflow-dags
          configMap:
            name: airflow-dags
        # internal-ca-distribution.yaml이 orchestration 네임스페이스에 새로 복제하는
        # ConfigMap — build-ca-bundle initContainer 전용 입력(원본 CA), 메인 컨테이너는
        # 병합 번들만 본다.
        - name: internal-ca
          configMap:
            name: beluga-internal-ca
        - name: ca-bundle
          emptyDir: {}
        - name: airflow-home
          emptyDir:
            sizeLimit: 4Gi
        # #117 D-RO5: /opt/airflow(airflow.cfg·logs·pid)는 로그가 쌓이는 무제한 emptyDir였다. 2Gi = 이미지 빈
        # 상태에서 시작해 task/scheduler 로그가 며칠 쌓여도 충분한 보수적 상한. 초과 시 파드 eviction(재생성되면 초기화).
        # Escape hatch: 로그를 stdout/원격 로깅으로 돌리거나 값을 키운다.
        - name: airflow-state
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: orchestration
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: airflow

