{{- define "openmetadata.databaseEnv" -}}
- name: DB_HOST
  value: postgres-main-rw.database.svc.cluster.local
- name: DB_PORT
  value: "5432"
- name: DB_USER
  value: beluga_admin
- name: DB_USER_PASSWORD
  valueFrom:
    secretKeyRef:
      name: postgres-admin-credential
      key: password
- name: OM_DATABASE
  value: openmetadata
- name: DB_DRIVER_CLASS
  value: org.postgresql.Driver
- name: DB_SCHEME
  value: postgresql
- name: SEARCH_TYPE
  value: opensearch
- name: ELASTICSEARCH_HOST
  value: opensearch
- name: ELASTICSEARCH_PORT
  value: "9200"
- name: ELASTICSEARCH_SCHEME
  value: http
{{- end -}}
{{ if (dig "openmetadata" "enabled" false .Values.AsMap) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: governance
  labels:
    app: opensearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # #117 D-RO4: 읽기 전용 루트에서 OpenSearch는 기동 시 config/opensearch.keystore(.tmp)를 만들려다
      # 실패한다(docker --read-only 실측: "opensearch.keystore.tmp: Read-only file system").
      # config를 emptyDir로 그냥 덮으면 opensearch.yml/jvm.options/log4j2.properties가 사라지므로(이미지에
      # 내용 있음) 같은 이미지로 config 최상위 항목을 먼저 복사한다. 이미지에는 `find`가 없어
      # `set -eu` + 글롭 `cp -a -t`를 쓴다(미매치 글롭/cp 실패는 즉시 비0 종료). config에는 점 파일이
      # 없음을 실측 확인했다. 쓰기 경로 = config(keystore), data, logs, /tmp. 비용: 기동 시 config 복사(~200KB).
      # Escape hatch: 메인의 readOnlyRootFilesystem, 이 initContainer, config/logs/tmp 마운트를 함께 제거.
      # 라이브 미검증 가정: k8s emptyDir(root 소유 0777)에서 UID 1000 복사/쓰기 성공(docker 볼륨으로만 실측).
      initContainers:
        - name: copy-opensearch-config
          image: opensearchproject/opensearch:2.18.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c", "set -eu; cp -a -t /opensearch-config/ /usr/share/opensearch/config/*"]
          volumeMounts:
            - name: opensearch-config
              mountPath: /opensearch-config
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.18.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: discovery.type
              value: "single-node"
            # 하나만 사용 — 둘 다 넣으면 이미지가 같은 설정으로 변환해
            # "setting already set" 기동 실패 (E2E 실측)
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx1g"
          ports:
            - containerPort: 9200
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
            - name: opensearch-config
              mountPath: /usr/share/opensearch/config
            - name: opensearch-logs
              mountPath: /usr/share/opensearch/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: opensearch-data
          emptyDir: {}
        - name: opensearch-config
          emptyDir:
            sizeLimit: 64Mi
        - name: opensearch-logs
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: governance
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: 9200
      name: http
  selector:
    app: opensearch
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openmetadata-migration
  namespace: governance
  # #117 D-RO7: Job spec.template은 불변이라 일반 Job이면 템플릿 변경(이번 readOnlyRootFilesystem·
  # 볼륨, 이미지 bump 등) 시 기존 설치의 ArgoCD sync가 거부된다. 차트의 다른 Job과 같은 Sync hook +
  # BeforeHookCreation으로 매 sync 재생성한다(migrate는 멱등). Escape hatch: 어노테이션 제거 후
  # 기존 Job을 수동 삭제하는 업그레이드 절차로 되돌린다.
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    metadata:
      labels:
        app: openmetadata-migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openmetadata-migration
          image: openmetadata/server:1.13.3
          securityContext:
            allowPrivilegeEscalation: false
            # #117 D-RO4: reseed-security-config initContainer와 같은 ops 스크립트라 쓰기 경로도 같다
            # (/tmp, /opt/openmetadata/logs — 이미지에 logs 디렉터리 없음 확인). 라이브 미검증 가정: migrate
            # 서브커맨드가 이 외 경로에 쓰지 않음(docker --read-only로 DB 연결 단계까지만 확인).
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/bash
            - -c
            - /opt/openmetadata/bootstrap/openmetadata-ops.sh migrate
          env:
{{ include "openmetadata.databaseEnv" . | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: openmetadata-logs
              mountPath: /opt/openmetadata/logs
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: openmetadata-logs
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmetadata
  namespace: governance
  labels:
    app: openmetadata
  # #117 D-RO8: 같은 웨이브(0)면 ArgoCD는 kind 순서상 Deployment를 Job(마이그레이션 훅)보다 먼저
  # 적용해, 이미지 bump 시 새 서버가 마이그레이션 전 스키마로 기동한다. 웨이브 1로 미뤄 웨이브 0
  # 전체(마이그레이션 Job 성공, opensearch 등)가 Healthy가 된 뒤에 롤아웃한다. 비용: 마이그레이션이
  # 실패하거나 웨이브 0 자원이 Unhealthy면 sync가 멈춰 서버가 갱신되지 않는다(의도). Escape hatch:
  # 이 어노테이션을 제거한다.
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  # D-recreate-strategy: 단일 replica 환경에서 롤링 업데이트 시 구 파드와 새 파드가 동시에 떠서
  # 구 파드가 DB openmetadata_settings를 재작성/경합하는 것을 방지하기 위해 strategy.type: Recreate를 사용한다.
  # 비용: 롤링 업데이트 대신 파드 교체 시 일시적 다운타임(수 초~수십 초) 발생.
  # 탈출구: 다중 replica/HA 구성 시 DB 분산 락을 도입하거나 설정 마이그레이션을 독립 잡으로 분리.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openmetadata
  template:
    metadata:
      labels:
        app: openmetadata
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # D-reseed-security-config: OM 1.13.3은 authenticationConfiguration/authorizerConfiguration을
        # openmetadata_settings DB 테이블에 영속화하고, 기동 시 'DB에 없을 때만' 컨테이너 env/YAML로 생성한다(SettingsCache.java:263-287 @1.13.3).
        # 컨테이너 env에 AUTHENTICATION_CLIENT_TYPE=confidential 등을 지정해도 기존 DB에 public/id_token이 남아있으면 덮어써지지 않으므로,
        # 매 재시작마다 remove-security-config --force를 실행해 DB 보안 설정을 초기화하고 컨테이너 env를 단일 진실 공급원(SSOT)으로 재시드한다.
        # 비용: UI/API에서 런타임에 동적으로 변경한 SSO/인증 설정이 파드 재시작 시 컨테이너 env 값으로 되돌아감.
        # 탈출구: UI에서 설정을 영구 관리해야 할 경우 이 initContainer를 비활성화하거나, 설정 변경을 Helm values/GitOps로 관리하도록 표준화.
        - name: reseed-security-config
          image: openmetadata/server:1.13.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/bash
            - -c
            - /opt/openmetadata/bootstrap/openmetadata-ops.sh remove-security-config --force
          env:
{{ include "openmetadata.databaseEnv" . | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: openmetadata-logs
              mountPath: /opt/openmetadata/logs
        - name: build-truststore
          image: openmetadata/server:1.13.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - >-
              rm -f /etc/openmetadata/truststore/truststore.p12 &&
              keytool -importkeystore
              -srckeystore /etc/ssl/certs/java/cacerts
              -srcstorepass changeit
              -destkeystore /etc/openmetadata/truststore/truststore.p12
              -deststoretype PKCS12
              -deststorepass changeit
              -noprompt &&
              exec keytool -importcert -noprompt
              -alias beluga-internal-ca
              -file /etc/openmetadata-ca/ca.crt
              -keystore /etc/openmetadata/truststore/truststore.p12
              -storepass changeit
          volumeMounts:
            - name: internal-ca
              mountPath: /etc/openmetadata-ca
              readOnly: true
            - name: truststore-volume
              mountPath: /etc/openmetadata/truststore
            - name: tmp
              mountPath: /tmp
      containers:
        - name: openmetadata
          image: openmetadata/server:1.13.3
          securityContext:
            allowPrivilegeEscalation: false
            # #117 D-RO4: 쓰기 경로 = /opt/openmetadata/logs(./logs/*.log, GC 로그 — 이미지에 없는 디렉터리라
            # 빈 emptyDir 안전), /tmp(Jetty/JVM 임시), 기존 truststore-volume. conf는 읽기만 한다.
            # 라이브 미검증 가정: 기동 후 런타임(수집/검색 재색인)이 이 외 경로에 쓰지 않음(docker --read-only로
            # DB 연결 단계까지만 확인). Escape hatch: readOnlyRootFilesystem 줄 제거.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8585
              name: http
          env:
{{ include "openmetadata.databaseEnv" . | indent 12 }}
            - name: OPENMETADATA_OPTS
              value: "-Djavax.net.ssl.trustStore=/etc/openmetadata/truststore/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12"
            - name: AUTHENTICATION_CLIENT_TYPE
              value: "confidential"
            - name: AUTHENTICATION_PROVIDER
              value: "custom-oidc"
            - name: AUTHENTICATION_RESPONSE_TYPE
              value: "code"
            - name: CUSTOM_OIDC_AUTHENTICATION_PROVIDER_NAME
              value: "keycloak"
            - name: AUTHENTICATION_AUTHORITY
              value: "https://sso.{{ .Values.baseDomain }}/realms/beluga"
            - name: AUTHENTICATION_PUBLIC_KEYS
              value: "[https://sso.{{ .Values.baseDomain }}/realms/beluga/protocol/openid-connect/certs, http://localhost:8585/api/v1/system/config/jwks]"
            - name: AUTHENTICATION_CLIENT_ID
              value: "openmetadata"
            - name: AUTHENTICATION_CALLBACK_URL
              value: "https://metadata.{{ .Values.baseDomain }}/callback"
            - name: AUTHENTICATION_JWT_PRINCIPAL_CLAIMS
              value: "[preferred_username, email, sub]"
            - name: OIDC_CLIENT_ID
              value: "openmetadata"
            - name: OIDC_TYPE
              value: "keycloak"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: openmetadata
            - name: OIDC_SCOPE
              value: "openid email profile"
            - name: OIDC_DISCOVERY_URI
              value: "https://sso.{{ .Values.baseDomain }}/realms/beluga/.well-known/openid-configuration"
            - name: OIDC_SERVER_URL
              value: "https://metadata.{{ .Values.baseDomain }}"
            - name: OIDC_CALLBACK
              value: "https://metadata.{{ .Values.baseDomain }}/callback"
            - name: OIDC_RESPONSE_TYPE
              value: "code"
            - name: OIDC_PREFERRED_JWS
              value: "RS256"
            # D-SSO: OM 1.13.3 기본 설정(/opt/openmetadata/conf/openmetadata.yaml:390: prompt: ${OIDC_PROMPT_TYPE:-"consent"})
            - name: OIDC_PROMPT_TYPE
              value: "consent"
            - name: OIDC_OM_REFRESH_TOKEN_VALIDITY
              value: "3600"
            - name: AUTHORIZER_CLASS_NAME
              value: "org.openmetadata.service.security.DefaultAuthorizer"
            - name: AUTHORIZER_ADMIN_PRINCIPALS
              value: "[beluga-admin]"
            - name: AUTHORIZER_PRINCIPAL_DOMAIN
              value: "beluga.local"
          volumeMounts:
            - name: truststore-volume
              mountPath: /etc/openmetadata/truststore
            - name: tmp
              mountPath: /tmp
            - name: openmetadata-logs
              mountPath: /opt/openmetadata/logs
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
      volumes:
        - name: truststore-volume
          emptyDir: {}
        - name: internal-ca
          configMap:
            name: beluga-internal-ca
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: openmetadata-logs
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openmetadata
  namespace: governance
spec:
  type: ClusterIP
  ports:
    - port: 8585
      targetPort: 8585
      name: http
  selector:
    app: openmetadata
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: openmetadata
  namespace: governance
spec:
  externalNodes:
    - type: Domain
      name: openmetadata.governance.svc.cluster.local
      port: 8585
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: openmetadata
  namespace: governance
spec:
  http:
    - name: openmetadata
      match:
        hosts:
          - metadata.{{ .Values.baseDomain }}
        paths:
          - "/*"
      upstreams:
        - name: openmetadata
      plugins:
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                X-Content-Type-Options: "nosniff"
                X-Frame-Options: "SAMEORIGIN"
---
# OpenSearch는 시큐리티 플러그인 off(단일노드 데모) — 대신 NetworkPolicy로
# OpenMetadata 서버/마이그레이션 파드 외 접근을 차단한다 (Cilium이 집행)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-allow-openmetadata-only
  namespace: governance
spec:
  podSelector:
    matchLabels:
      app: opensearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: openmetadata
        - podSelector:
            matchLabels:
              app: openmetadata-migration
      ports:
        - protocol: TCP
          port: 9200
---
# OpenMetadata 및 마이그레이션 잡은 governance 네임스페이스의 default-deny 하에서
# 메타스토어 PostgreSQL(5432) 및 검색 엔진 OpenSearch(9200)로의 Egress가 필수적이다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openmetadata-egress
  namespace: governance
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [openmetadata, openmetadata-migration]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-main
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: opensearch
      ports:
        - protocol: TCP
          port: 9200
    # OIDC discovery / JWKS / 토큰 교환: sso.<baseDomain>(10.43.0.200, apisix-gateway) 443 호출
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-system
          podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 443
---
# default-deny 하에서 APISIX(platform-system)가 metadata 라우트 업스트림인 8585에 붙으려면
# 인그레스 허용이 필요하다 — 없으면 UI 요청이 게이트웨이에서 타임아웃된다(실측).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openmetadata-allow-apisix
  namespace: governance
spec:
  podSelector:
    matchLabels:
      app: openmetadata
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-system
          podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 8585
{{ end }}
