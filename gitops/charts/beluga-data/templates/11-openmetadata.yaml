{{ if (dig "openmetadata" "enabled" false .Values.AsMap) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: governance
  labels:
    app: opensearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.18.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: discovery.type
              value: "single-node"
            # 하나만 사용 — 둘 다 넣으면 이미지가 같은 설정으로 변환해
            # "setting already set" 기동 실패 (E2E 실측)
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx1g"
          ports:
            - containerPort: 9200
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
      volumes:
        - name: opensearch-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: governance
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: 9200
      name: http
  selector:
    app: opensearch
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openmetadata-migration
  namespace: governance
spec:
  template:
    metadata:
      labels:
        app: openmetadata-migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openmetadata-migration
          image: openmetadata/server:1.13.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/bash
            - -c
            - /opt/openmetadata/bootstrap/openmetadata-ops.sh migrate
          env:
            - name: DB_HOST
              value: postgres-main-rw.database.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: beluga_admin
            - name: DB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credential
                  key: password
            - name: OM_DATABASE
              value: openmetadata
            - name: DB_DRIVER_CLASS
              value: org.postgresql.Driver
            - name: DB_SCHEME
              value: postgresql
            - name: SEARCH_TYPE
              value: opensearch
            - name: ELASTICSEARCH_HOST
              value: opensearch
            - name: ELASTICSEARCH_PORT
              value: "9200"
            - name: ELASTICSEARCH_SCHEME
              value: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmetadata
  namespace: governance
  labels:
    app: openmetadata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openmetadata
  template:
    metadata:
      labels:
        app: openmetadata
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: build-truststore
          image: openmetadata/server:1.13.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - >-
              rm -f /etc/openmetadata/truststore/truststore.p12 &&
              keytool -importkeystore
              -srckeystore /etc/ssl/certs/java/cacerts
              -srcstorepass changeit
              -destkeystore /etc/openmetadata/truststore/truststore.p12
              -deststoretype PKCS12
              -deststorepass changeit
              -noprompt &&
              exec keytool -importcert -noprompt
              -alias beluga-internal-ca
              -file /etc/openmetadata-ca/ca.crt
              -keystore /etc/openmetadata/truststore/truststore.p12
              -storepass changeit
          volumeMounts:
            - name: internal-ca
              mountPath: /etc/openmetadata-ca
              readOnly: true
            - name: truststore-volume
              mountPath: /etc/openmetadata/truststore
      containers:
        - name: openmetadata
          image: openmetadata/server:1.13.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8585
              name: http
          env:
            - name: DB_HOST
              value: postgres-main-rw.database.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: beluga_admin
            - name: DB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credential
                  key: password
            - name: OM_DATABASE
              value: openmetadata
            - name: DB_DRIVER_CLASS
              value: org.postgresql.Driver
            - name: DB_SCHEME
              value: postgresql
            - name: SEARCH_TYPE
              value: opensearch
            - name: ELASTICSEARCH_HOST
              value: opensearch
            - name: ELASTICSEARCH_PORT
              value: "9200"
            - name: ELASTICSEARCH_SCHEME
              value: http
            - name: OPENMETADATA_OPTS
              value: "-Djavax.net.ssl.trustStore=/etc/openmetadata/truststore/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12"
            - name: AUTHENTICATION_CLIENT_TYPE
              value: "confidential"
            - name: AUTHENTICATION_PROVIDER
              value: "custom-oidc"
            - name: AUTHENTICATION_RESPONSE_TYPE
              value: "code"
            - name: CUSTOM_OIDC_AUTHENTICATION_PROVIDER_NAME
              value: "keycloak"
            - name: AUTHENTICATION_AUTHORITY
              value: "https://sso.{{ .Values.baseDomain }}/realms/beluga"
            - name: AUTHENTICATION_PUBLIC_KEYS
              value: "[https://sso.{{ .Values.baseDomain }}/realms/beluga/protocol/openid-connect/certs, http://localhost:8585/api/v1/system/config/jwks]"
            - name: AUTHENTICATION_CLIENT_ID
              value: "openmetadata"
            - name: AUTHENTICATION_CALLBACK_URL
              value: "https://metadata.{{ .Values.baseDomain }}/callback"
            - name: AUTHENTICATION_JWT_PRINCIPAL_CLAIMS
              value: "[preferred_username, email, sub]"
            - name: OIDC_CLIENT_ID
              value: "openmetadata"
            - name: OIDC_TYPE
              value: "keycloak"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: openmetadata
            - name: OIDC_SCOPE
              value: "openid email profile"
            - name: OIDC_DISCOVERY_URI
              value: "https://sso.{{ .Values.baseDomain }}/realms/beluga/.well-known/openid-configuration"
            - name: OIDC_SERVER_URL
              value: "https://metadata.{{ .Values.baseDomain }}"
            - name: OIDC_CALLBACK
              value: "https://metadata.{{ .Values.baseDomain }}/callback"
            - name: OIDC_RESPONSE_TYPE
              value: "code"
            - name: OIDC_PREFERRED_JWS
              value: "RS256"
            # D-SSO: OM 1.13.3 기본 설정(/opt/openmetadata/conf/openmetadata.yaml:390: prompt: ${OIDC_PROMPT_TYPE:-"consent"})
            - name: OIDC_PROMPT_TYPE
              value: "consent"
            - name: OIDC_OM_REFRESH_TOKEN_VALIDITY
              value: "3600"
            - name: AUTHORIZER_CLASS_NAME
              value: "org.openmetadata.service.security.DefaultAuthorizer"
            - name: AUTHORIZER_ADMIN_PRINCIPALS
              value: "[beluga-admin]"
            - name: AUTHORIZER_PRINCIPAL_DOMAIN
              value: "beluga.local"
          volumeMounts:
            - name: truststore-volume
              mountPath: /etc/openmetadata/truststore
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
      volumes:
        - name: truststore-volume
          emptyDir: {}
        - name: internal-ca
          configMap:
            name: beluga-internal-ca
---
apiVersion: v1
kind: Service
metadata:
  name: openmetadata
  namespace: governance
spec:
  type: ClusterIP
  ports:
    - port: 8585
      targetPort: 8585
      name: http
  selector:
    app: openmetadata
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: openmetadata
  namespace: governance
spec:
  externalNodes:
    - type: Domain
      name: openmetadata.governance.svc.cluster.local
      port: 8585
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: openmetadata
  namespace: governance
spec:
  http:
    - name: openmetadata
      match:
        hosts:
          - metadata.{{ .Values.baseDomain }}
        paths:
          - "/*"
      upstreams:
        - name: openmetadata
      plugins:
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                X-Content-Type-Options: "nosniff"
                X-Frame-Options: "SAMEORIGIN"
---
# OpenSearch는 시큐리티 플러그인 off(단일노드 데모) — 대신 NetworkPolicy로
# OpenMetadata 서버/마이그레이션 파드 외 접근을 차단한다 (Cilium이 집행)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-allow-openmetadata-only
  namespace: governance
spec:
  podSelector:
    matchLabels:
      app: opensearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: openmetadata
        - podSelector:
            matchLabels:
              app: openmetadata-migration
      ports:
        - protocol: TCP
          port: 9200
---
# OpenMetadata 및 마이그레이션 잡은 governance 네임스페이스의 default-deny 하에서
# 메타스토어 PostgreSQL(5432) 및 검색 엔진 OpenSearch(9200)로의 Egress가 필수적이다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openmetadata-egress
  namespace: governance
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [openmetadata, openmetadata-migration]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-main
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: opensearch
      ports:
        - protocol: TCP
          port: 9200
    # OIDC discovery / JWKS / 토큰 교환: sso.<baseDomain>(10.43.0.200, apisix-gateway) 443 호출
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-system
          podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 443
---
# default-deny 하에서 APISIX(platform-system)가 metadata 라우트 업스트림인 8585에 붙으려면
# 인그레스 허용이 필요하다 — 없으면 UI 요청이 게이트웨이에서 타임아웃된다(실측).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openmetadata-allow-apisix
  namespace: governance
spec:
  podSelector:
    matchLabels:
      app: openmetadata
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-system
          podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 8585
{{ end }}
