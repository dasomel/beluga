{{ if (dig "openmetadata" "enabled" false .Values.AsMap) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: governance
  labels:
    app: opensearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.18.0
          env:
            - name: discovery.type
              value: "single-node"
            # 하나만 사용 — 둘 다 넣으면 이미지가 같은 설정으로 변환해
            # "setting already set" 기동 실패 (E2E 실측)
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx1g"
          ports:
            - containerPort: 9200
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
      volumes:
        - name: opensearch-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: governance
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: 9200
      name: http
  selector:
    app: opensearch
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openmetadata-migration
  namespace: governance
spec:
  template:
    metadata:
      labels:
        app: openmetadata-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: openmetadata-migration
          image: openmetadata/server:1.13.3
          command:
            - /bin/bash
            - -c
            - /opt/openmetadata/bootstrap/openmetadata-ops.sh migrate
          env:
            - name: DB_HOST
              value: postgres-main-rw.database.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: beluga_admin
            - name: DB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credential
                  key: password
            - name: OM_DATABASE
              value: openmetadata
            - name: DB_DRIVER_CLASS
              value: org.postgresql.Driver
            - name: DB_SCHEME
              value: postgresql
            - name: SEARCH_TYPE
              value: opensearch
            - name: ELASTICSEARCH_HOST
              value: opensearch
            - name: ELASTICSEARCH_PORT
              value: "9200"
            - name: ELASTICSEARCH_SCHEME
              value: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmetadata
  namespace: governance
  labels:
    app: openmetadata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openmetadata
  template:
    metadata:
      labels:
        app: openmetadata
    spec:
      containers:
        - name: openmetadata
          image: openmetadata/server:1.13.3
          ports:
            - containerPort: 8585
              name: http
          env:
            - name: DB_HOST
              value: postgres-main-rw.database.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: beluga_admin
            - name: DB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credential
                  key: password
            - name: OM_DATABASE
              value: openmetadata
            - name: DB_DRIVER_CLASS
              value: org.postgresql.Driver
            - name: DB_SCHEME
              value: postgresql
            - name: SEARCH_TYPE
              value: opensearch
            - name: ELASTICSEARCH_HOST
              value: opensearch
            - name: ELASTICSEARCH_PORT
              value: "9200"
            - name: ELASTICSEARCH_SCHEME
              value: http
            - name: AUTHENTICATION_PROVIDER
              value: "custom-oidc"
            - name: CUSTOM_OIDC_AUTHENTICATION_PROVIDER_NAME
              value: "keycloak"
            # 이슈 #2: 현재 비활성(enabled:false) 컴포넌트라 URL만 https로 맞춰 둔다 —
            # 실제로 켤 때는 Trino(06-trino.yaml initContainer 패턴)처럼 JVM 트러스트스토어에
            # 내부 CA를 별도로 넣어야 discovery/JWKS 호출이 통과한다(미구현).
            - name: AUTHENTICATION_AUTHORITY
              value: "https://sso.local.beluga.internal/realms/beluga"
            - name: AUTHENTICATION_PUBLIC_KEYS
              value: "[https://sso.local.beluga.internal/realms/beluga/protocol/openid-connect/certs, http://localhost:8585/api/v1/system/config/jwks]"
            - name: AUTHENTICATION_CLIENT_ID
              value: "openmetadata"
            - name: OIDC_CLIENT_ID
              value: "openmetadata"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: openmetadata
            - name: OIDC_DISCOVERY_URI
              value: "https://sso.local.beluga.internal/realms/beluga/.well-known/openid-configuration"
            - name: AUTHENTICATION_CALLBACK_URL
              value: "https://metadata.local.beluga.internal/callback"
            - name: AUTHORIZER_CLASS_NAME
              value: "org.openmetadata.service.security.DefaultAuthorizer"
            - name: AUTHORIZER_ADMIN_PRINCIPALS
              value: "[admin]"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openmetadata
  namespace: governance
spec:
  type: ClusterIP
  ports:
    - port: 8585
      targetPort: 8585
      name: http
  selector:
    app: openmetadata
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: openmetadata
  namespace: governance
spec:
  externalNodes:
    - type: Domain
      name: openmetadata.governance.svc.cluster.local
      port: 8585
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: openmetadata
  namespace: governance
spec:
  http:
    - name: openmetadata
      match:
        hosts:
          - metadata.{{ .Values.baseDomain }}
        paths:
          - "/*"
      upstreams:
        - name: openmetadata
      plugins:
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                X-Content-Type-Options: "nosniff"
                X-Frame-Options: "SAMEORIGIN"
---
# OpenSearch는 시큐리티 플러그인 off(단일노드 데모) — 대신 NetworkPolicy로
# OpenMetadata 서버/마이그레이션 파드 외 접근을 차단한다 (Cilium이 집행)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-allow-openmetadata-only
  namespace: governance
spec:
  podSelector:
    matchLabels:
      app: opensearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: openmetadata
        - podSelector:
            matchLabels:
              app: openmetadata-migration
      ports:
        - protocol: TCP
          port: 9200
---
# OpenMetadata 및 마이그레이션 잡은 governance 네임스페이스의 default-deny 하에서
# 메타스토어 PostgreSQL(5432) 및 검색 엔진 OpenSearch(9200)로의 Egress가 필수적이다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openmetadata-egress
  namespace: governance
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [openmetadata, openmetadata-migration]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-main
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: opensearch
      ports:
        - protocol: TCP
          port: 9200
---
# default-deny 하에서 APISIX(platform-system)가 metadata 라우트 업스트림인 8585에 붙으려면
# 인그레스 허용이 필요하다 — 없으면 UI 요청이 게이트웨이에서 타임아웃된다(실측).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openmetadata-allow-apisix
  namespace: governance
spec:
  podSelector:
    matchLabels:
      app: openmetadata
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-system
          podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 8585
{{ end }}
