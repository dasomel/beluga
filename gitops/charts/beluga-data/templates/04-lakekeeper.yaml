# D4: Lakekeeper (Iceberg REST Catalog) — quay.io/lakekeeper/catalog
# D14: OpenFGA 인가 백엔드는 values.lakekeeper.openfga.enabled로 게이트 (기본 allowall)
# 웨어하우스 생성은 부트스트랩 API(POST /management/v1/warehouse) — demo 초기화에서 수행 (후속)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lakekeeper-migrate
  namespace: beluga-data
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    metadata:
      labels:
        app: lakekeeper-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ .Values.lakekeeper.image }}
          args:
            - "migrate"
          env:
            - name: LAKEKEEPER__PG_DATABASE_URL_READ
              value: "postgresql://beluga_admin:{{ .Values.credentials.pgPassword }}@postgres-main-rw.beluga-data.svc.cluster.local:5432/lakekeeper"
            - name: LAKEKEEPER__PG_DATABASE_URL_WRITE
              value: "postgresql://beluga_admin:{{ .Values.credentials.pgPassword }}@postgres-main-rw.beluga-data.svc.cluster.local:5432/lakekeeper"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakekeeper
  namespace: beluga-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lakekeeper
  template:
    metadata:
      labels:
        app: lakekeeper
    spec:
      containers:
        - name: lakekeeper
          image: {{ .Values.lakekeeper.image }}
          args:
            - "serve"
          env:
            - name: LAKEKEEPER__PG_DATABASE_URL_READ
              value: "postgresql://beluga_admin:{{ .Values.credentials.pgPassword }}@postgres-main-rw.beluga-data.svc.cluster.local:5432/lakekeeper"
            - name: LAKEKEEPER__PG_DATABASE_URL_WRITE
              value: "postgresql://beluga_admin:{{ .Values.credentials.pgPassword }}@postgres-main-rw.beluga-data.svc.cluster.local:5432/lakekeeper"
            # BASE_URI는 config 응답의 overrides.uri로 클라이언트에 전파됨 — 외부 도메인이면
            # 클러스터 내부 클라이언트(Trino/Flink)가 APISIX로 우회하게 됨 (404 실측). 내부 URI 고정
            - name: LAKEKEEPER__BASE_URI
              value: "http://lakekeeper.beluga-data.svc.cluster.local:8181"
            {{- if .Values.lakekeeper.openfga.enabled }}
            - name: LAKEKEEPER__AUTHZ_BACKEND
              value: "openfga"
            - name: LAKEKEEPER__OPENFGA__ENDPOINT
              value: {{ .Values.lakekeeper.openfga.endpoint | quote }}
            {{- else }}
            - name: LAKEKEEPER__AUTHZ_BACKEND
              value: "allowall"
            {{- end }}
          ports:
            - containerPort: {{ .Values.lakekeeper.port }}
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: lakekeeper
  namespace: beluga-data
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.lakekeeper.port }}
      targetPort: {{ .Values.lakekeeper.port }}
      name: http
  selector:
    app: lakekeeper
