# D4: Lakekeeper (Iceberg REST Catalog) — quay.io/lakekeeper/catalog
# D14: OpenFGA 인가 백엔드는 values.lakekeeper.openfga.enabled로 게이트 (기본 allowall)
# 웨어하우스 생성은 부트스트랩 API(POST /management/v1/warehouse) — demo 초기화에서 수행 (후속)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lakekeeper-migrate
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
spec:
  template:
    metadata:
      labels:
        app: lakekeeper-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ .Values.lakekeeper.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "migrate"
          # D-K(이슈 #104): PGPASSWORD를 secretKeyRef로 먼저 정의하면, 뒤따르는 env의 value는
          # K8s의 "dependent environment variables" 치환으로 $(PGPASSWORD)를 그 값으로
          # 채워 넣는다 — Helm 렌더 시점 굽기 없이 URI를 조립하는 표준 K8s 기능이다.
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credential
                  key: password
            - name: LAKEKEEPER__PG_DATABASE_URL_READ
              value: "postgresql://beluga_admin:$(PGPASSWORD)@postgres-main-rw.database.svc.cluster.local:5432/lakekeeper"
            - name: LAKEKEEPER__PG_DATABASE_URL_WRITE
              value: "postgresql://beluga_admin:$(PGPASSWORD)@postgres-main-rw.database.svc.cluster.local:5432/lakekeeper"
            {{- if .Values.lakekeeper.openfga.enabled }}
            - name: LAKEKEEPER__AUTHZ_BACKEND
              value: openfga
            - name: LAKEKEEPER__OPENFGA__ENDPOINT
              value: {{ .Values.lakekeeper.openfga.endpoint | quote }}
            - name: LAKEKEEPER__OPENFGA__API_KEY
              valueFrom:
                secretKeyRef:
                  name: openfga-authn-credential
                  key: key
            {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakekeeper
  namespace: lakehouse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lakekeeper
  template:
    metadata:
      labels:
        app: lakekeeper
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: internal-ca
          configMap:
            name: beluga-internal-ca
      containers:
        - name: lakekeeper
          image: {{ .Values.lakekeeper.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "serve"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-credential
                  key: password
            - name: LAKEKEEPER__PG_DATABASE_URL_READ
              value: "postgresql://beluga_admin:$(PGPASSWORD)@postgres-main-rw.database.svc.cluster.local:5432/lakekeeper"
            - name: LAKEKEEPER__PG_DATABASE_URL_WRITE
              value: "postgresql://beluga_admin:$(PGPASSWORD)@postgres-main-rw.database.svc.cluster.local:5432/lakekeeper"
            # BASE_URI는 config 응답의 overrides.uri로 클라이언트에 전파됨 — 외부 도메인이면
            # 클러스터 내부 클라이언트(Trino/Flink)가 APISIX로 우회하게 됨 (404 실측). 내부 URI 고정
            - name: LAKEKEEPER__BASE_URI
              value: "http://lakekeeper.lakehouse.svc.cluster.local:8181"
            {{- if .Values.lakekeeper.openfga.enabled }}
            - name: LAKEKEEPER__AUTHZ_BACKEND
              value: "openfga"
            - name: LAKEKEEPER__OPENFGA__ENDPOINT
              value: {{ .Values.lakekeeper.openfga.endpoint | quote }}
            - name: LAKEKEEPER__OPENFGA__API_KEY
              valueFrom:
                secretKeyRef:
                  name: openfga-authn-credential
                  key: key
            - name: SSL_CERT_FILE
              value: /etc/beluga-ca/ca.crt
            - name: LAKEKEEPER__OPENID_PROVIDER_URI
              value: "http://keycloak.iam.svc.cluster.local:8080/realms/beluga"
            - name: LAKEKEEPER__OPENID_AUDIENCE
              value: lakekeeper
            - name: LAKEKEEPER__OPENID_ADDITIONAL_ISSUERS
              value: "https://sso.local.beluga.internal/realms/beluga"
            - name: LAKEKEEPER__OPENID_SUBJECT_CLAIM
              value: "preferred_username,sub"
            - name: LAKEKEEPER__INSTANCE_ADMINS
              value: '["oidc~service-account-lakekeeper-admin"]'
            {{- else }}
            - name: LAKEKEEPER__AUTHZ_BACKEND
              value: "allowall"
            {{- end }}
          ports:
            - containerPort: {{ .Values.lakekeeper.port }}
              name: http
          volumeMounts:
            - name: internal-ca
              mountPath: /etc/beluga-ca
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: lakekeeper
  namespace: lakehouse
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.lakekeeper.port }}
      targetPort: {{ .Values.lakekeeper.port }}
      name: http
  selector:
    app: lakekeeper
