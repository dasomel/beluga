apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakekeeper
  namespace: beluga-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lakekeeper
  template:
    metadata:
      labels:
        app: lakekeeper
    spec:
      containers:
        - name: lakekeeper
          image: {{ .Values.lakekeeper.image }}
          env:
            - name: CATALOG_WAREHOUSE
              value: "s3://iceberg-warehouse/"
            - name: CATALOG_IO__IMPL
              value: "org.apache.iceberg.aws.s3.S3FileIO"
            - name: CATALOG_S3_ENDPOINT
              value: "http://seaweedfs-s3:8333"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              value: "any"
            - name: AWS_SECRET_ACCESS_KEY
              value: "any"
          ports:
            - containerPort: {{ .Values.lakekeeper.port }}
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: lakekeeper
  namespace: beluga-data
spec:
  type: NodePort
  ports:
    - port: {{ .Values.lakekeeper.port }}
      targetPort: {{ .Values.lakekeeper.port }}
      nodePort: 30181
      name: http
  selector:
    app: lakekeeper
