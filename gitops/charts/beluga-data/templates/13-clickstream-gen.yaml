# 클릭스트림 생성기 배포 — ConfigMap 스크립트 + python:3.12-slim 런타임
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickstream-producer-script
  namespace: streaming
data:
  clickstream-producer.py: |
{{ .Files.Get "files/clickstream-producer.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickstream-gen
  namespace: streaming
  labels:
    app: clickstream-gen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickstream-gen
  template:
    metadata:
      labels:
        app: clickstream-gen
    spec:
      # 이슈 #117(KSV-0014/0118): 비루트 + 읽기 전용 루트 FS. 런타임 pip install 대상은
      # 쓰기 가능한 emptyDir(/pylibs)로 돌리고 PYTHONPATH로 주입한다(kafka-python-ng는 순수
      # Python이라 --target 설치로 충분).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # D-ES-35 (#403): pylibs 2432KiB·tmp 4KiB에 패키지 설치/런타임 임시 여유.
      # 비용: 단일 파드 퇴거/재생성 중 서비스 중단·임시 데이터 소실(기존 PVC 불변).
      # limit은 마운트 합계 + 쓰기 계층/stdout >=128Mi; request는 실측/미측정 최소 예약.
      # 탈출구: docs/ephemeral-storage-bounds.md 실측 후 예산/보존 재산정; kubelet 주기 검사이지 hard quota 아님.
      containers:
        - name: producer
          image: python:3.12-slim
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - "/bin/sh"
            - "-c"
            - "pip install --no-cache-dir --target /pylibs kafka-python-ng==2.2.2 && python /app/clickstream-producer.py"
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONPATH
              value: /pylibs
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: KAFKA_BOOTSTRAP
              value: "beluga-kafka-kafka-bootstrap:9092"
          resources:
            requests:
              ephemeral-storage: 32Mi
              cpu: "50m"
              memory: "64Mi"
            limits:
              ephemeral-storage: 384Mi
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: script
              mountPath: /app
            - name: pylibs
              mountPath: /pylibs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pylibs
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: script
          configMap:
            name: clickstream-producer-script
