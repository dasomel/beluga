apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog-iceberg
  namespace: beluga-data
data:
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://lakekeeper:8181
    fs.native-s3.enabled=true
    s3.endpoint=http://seaweedfs-s3:8333
    s3.path-style-access=true
    s3.aws-access-key=any
    s3.aws-secret-key=any
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: beluga-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
      role: coordinator
  template:
    metadata:
      labels:
        app: trino
        role: coordinator
    spec:
      containers:
        - name: trino
          image: {{ .Values.trino.image }}
          env:
            - name: TRINO_ENVIRONMENT
              value: "production"
          ports:
            - containerPort: {{ .Values.trino.port }}
              name: http
          volumeMounts:
            - name: catalog-volume
              mountPath: /etc/trino/catalog
          resources:
            requests:
              memory: "1536Mi"
              cpu: "1000m"
            limits:
              memory: "2048Mi"
              cpu: "2000m"
      volumes:
        - name: catalog-volume
          configMap:
            name: trino-catalog-iceberg
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: beluga-data
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.trino.port }}
      targetPort: {{ .Values.trino.port }}
      name: http
  selector:
    app: trino
    role: coordinator
