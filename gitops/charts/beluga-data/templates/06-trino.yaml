apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog-iceberg
  namespace: analytics
data:
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://lakekeeper.lakehouse.svc.cluster.local:8181/catalog
    iceberg.rest-catalog.warehouse=lake
    fs.native-s3.enabled=true
    # D-K/#105와 동일 클래스 결함(실측): Trino(analytics 네임스페이스)에서 SeaweedFS
    # S3(storage 네임스페이스)를 short-name으로 부르면 크로스 네임스페이스 DNS 해석이
    # 실패한다 — SELECT 시 Iceberg 메타데이터 파일을 읽으려다
    # UnknownHostException: seaweedfs-s3: Name or service not known으로 실패(실측).
    # SHOW TABLES 등 메타데이터 전용 오퍼레이션은 S3를 안 건드려 이 결함이 숨어 있었다.
    s3.endpoint=http://seaweedfs-s3.storage.svc.cluster.local:8333
    s3.path-style-access=true
    s3.aws-access-key=${ENV:TRINO_S3_ACCESS_KEY}
    s3.aws-secret-key=${ENV:TRINO_S3_SECRET_KEY}
    s3.region=us-east-1
---
# 프록시 경유 접근(APISIX)에서 Trino가 X-Forwarded-* 헤더를 거부해 406을 반환한다
# (헤더별 실측: X-Forwarded-For/Proto/Host → 406, 미포함 → 303). 전달 헤더 처리 활성화
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-coordinator-config
  namespace: analytics
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port={{ .Values.trino.port }}
    discovery.uri=http://trino:{{ .Values.trino.port }}
    http-server.process-forwarded=true
    # Task 16(D-E 2/2) 실측 결함: 클라이언트-코디네이터 인증(oauth2)이 켜지면 Trino는
    # 노드 간 내부 통신에도 공유 시크릿을 요구한다 — 없으면 부팅 자체가 실패한다
    # (Guice IllegalArgumentException: "Shared secret (internal-communication.shared-secret)
    # is required when authentication is enabled", 코디네이터 크래시루프로 실측). 계획서
    # 초안에는 이 속성이 없었다. 코디네이터·워커 전 노드에 동일 값이어야 한다
    # (https://trino.io/docs/current/security/internal-communication.html).
    internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
    # Task 15: cert-manager 발급 PKCS12 키스토어로 코디네이터 자체 HTTPS 활성화.
    # Task 16(OAuth2)의 전제조건 — HTTP 리스너는 인증 전환 전까지 그대로 유지한다.
    http-server.https.enabled=true
    http-server.https.port=8443
    http-server.https.keystore.path=/etc/trino/tls/keystore.p12
    http-server.https.keystore.key=${ENV:TRINO_KEYSTORE_PASSWORD}
    # Task 16(D-E 2/2): OAuth2 인증 — 이게 켜지는 순간 X-Trino-User 자칭 구멍이 닫힌다.
    # principal-field=preferred_username: 그룹 프로바이더(Task 13)가 identity.user를
    # ldap.user-search-filter=(uid={0})에 그대로 넣어 OpenLDAP에서 찾으므로, 기본값인
    # 불투명 sub(UUID)가 아니라 OpenLDAP uid와 동일한 값(Keycloak-LDAP 페더레이션이 이미
    # usernameLDAPAttribute: uid로 동기화)을 써야 한다.
    # 실측: Keycloak 자체 discovery 문서(/realms/beluga/.well-known/openid-configuration)의
    # issuer는 클러스터 내부 DNS(keycloak.iam.svc.cluster.local)가 아니라
    # http://sso.local.beluga.internal/realms/beluga다 — 발급 토큰의 iss 클레임도 이 값과
    # 일치한다. 이 호스트명은 코디네이터 파드 안에서도 200으로 해석·응답된다(실측). 여기를
    # 클러스터 내부 DNS로 잘못 설정하면 iss 불일치로 모든 토큰 검증이 조용히 실패한다.
    # 이슈 #2: 게이트웨이가 HTTPS로 전환되면서 issuer도 https로 바뀐다. 코디네이터가
    # OIDC discovery/JWKS를 https://sso...로 가져오려면 내부 CA를 신뢰해야 하는데,
    # Trino의 oauth2 HTTP 클라이언트에는 truststore 전용 설정이 없다(공식 문서 확인,
    # http-server.authentication.oauth2.* 아래 ssl/truststore 키 전무) — JVM 표준
    # trustStore(jvm.config, 아래 ConfigMap)로 해결한다.
    http-server.authentication.type=oauth2
    http-server.authentication.oauth2.issuer=https://sso.{{ .Values.baseDomain }}/realms/beluga
    http-server.authentication.oauth2.client-id=trino
    http-server.authentication.oauth2.client-secret=${ENV:TRINO_OIDC_CLIENT_SECRET}
    http-server.authentication.oauth2.principal-field=preferred_username
---
# 이슈 #2: 코디네이터 JVM이 https://sso... OIDC discovery/JWKS 호출 시 내부 CA를
# 신뢰하도록 하는 JVM 표준 trustStore. trinodb/trino:483 이미지의 /etc/trino/jvm.config
# 실측값(2026-08-26, Temurin 25.0.3)을 그대로 복제 + trustStore 3줄만 추가 — 기존 JVM
# 튜닝을 절대 누락하지 않는다. 주의: 문서 예시의 -XX:GCLockerRetryAllocationCount,
# +UnlockDiagnosticVMOptions, +EnableDynamicAgentLoading 은 JDK 25에서 제거/불필요한
# 옵션이라 JVM 기동 자체가 실패한다(실배포 CrashLoopBackOff로 실측). 이미지 버전을
# 올릴 때는 반드시 컨테이너 안의 /etc/trino/jvm.config 를 다시 읽어 대조할 것.
# trustStore 비밀번호는 공개 CA 인증서만 담는 파일의 무결성 체크용이라 비밀이 아니다
# (Java 관용 기본값 'changeit') — jvm.config는 Trino의 ${ENV:...} 치환 대상이 아니라
# java 실행기에 그대로 전달되는 파일이라 시크릿 참조 자체가 불가능하다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-jvm-config
  namespace: analytics
data:
  jvm.config: |
    -server
    -agentpath:/usr/lib/trino/bin/libjvmkill.so
    -XX:InitialRAMPercentage=80
    -XX:MaxRAMPercentage=80
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -XX:-OmitStackTraceInFastThrow
    -XX:ReservedCodeCacheSize=256M
    -XX:PerMethodRecompilationCutoff=10000
    -XX:PerBytecodeRecompilationCutoff=10000
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000
    -Djavax.net.ssl.trustStore=/etc/trino/truststore/truststore.p12
    -Djavax.net.ssl.trustStorePassword=changeit
    -Djavax.net.ssl.trustStoreType=PKCS12
---
# Task 15: cert-manager CA(beluga-internal-ca-issuer, beluga-platform 차트)로 발급하는
# 코디네이터 TLS 인증서 — PKCS12 키스토어를 같은 Secret에 함께 생성한다(Trino가 요구하는 포맷).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trino-coordinator-tls
  namespace: analytics
spec:
  secretName: trino-coordinator-tls-secret
  dnsNames:
    - trino
    - trino.analytics.svc.cluster.local
    - trino.{{ .Values.baseDomain }}
  issuerRef:
    name: beluga-internal-ca-issuer
    kind: ClusterIssuer
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: trino-keystore-password
        key: password
---
# D14: 중앙 OPA access control — Trino 438+ 내장 opa 플러그인 (Trino 468 사용 중)
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-access-control
  namespace: analytics
data:
  access-control.properties: |
    access-control.name=opa
    opa.policy.uri=http://opa.iam.svc.cluster.local:8181/v1/data/trino/allow
    # Task 14: opa.policy.uri만으로는 Trino가 행 필터·컬럼 마스킹을 절대 요청하지
    # 않는다(Task 8 리뷰 실측) — 아래 두 URI가 그 갭을 닫는다. 경로는 rego.ts가
    # 방출하는 규칙 이름(rowFilters/columnMask, package trino)과 정확히 일치해야
    # 한다 — 다르면 OPA가 항상 undefined를 반환해 조용히 무적용 상태가 된다.
    opa.policy.row-filters-uri=http://opa.iam.svc.cluster.local:8181/v1/data/trino/rowFilters
    opa.policy.column-masking-uri=http://opa.iam.svc.cluster.local:8181/v1/data/trino/columnMask
    opa.log-requests=true
---
# D-D(Task 13): LDAP 그룹 프로바이더 — OPA 입력의 identity.groups를 채운다. OpenLDAP에
# memberOf 오버레이가 없어(전수 확인) 검색 모드만 쓴다. 연결 정보는 keycloak-ldap-federation.yaml이
# 이미 쓰는 값과 동일 — 이 클러스터에서 실제로 동작 중인 값을 재사용한다.
# ldap.group-search-filter는 (member={0})처럼 사용자별 자리표시자를 받는 필드가 아니다
# (Trino 공식 문서 https://trino.io/docs/current/security/group-mapping.html 확인 — 예시가
# (cn=trino_*)처럼 후보 그룹을 고르는 정적 필터다. 사용자 DN이 실제로 멤버인지는
# ldap.group-search-member-attribute로 별도 판정한다). 우리 그룹 3개(admins/engineers/
# analysts)는 모두 objectClass: groupOfNames이므로 그 클래스 전체를 후보로 준다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-group-provider
  namespace: analytics
data:
  group-provider.properties: |
    group-provider.name=ldap
    ldap.url=ldap://openldap.iam.svc.cluster.local:389
    ldap.allow-insecure=true
    ldap.admin-user=cn=admin,dc=beluga,dc=internal
    ldap.admin-password=${ENV:LDAP_ADMIN_PASSWORD}
    ldap.user-base-dn=ou=users,dc=beluga,dc=internal
    ldap.user-search-filter=(uid={0})
    ldap.use-group-filter=true
    ldap.group-base-dn=ou=groups,dc=beluga,dc=internal
    ldap.group-search-filter=(objectClass=groupOfNames)
    ldap.group-search-member-attribute=member
    ldap.group-name-attribute=cn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
      role: coordinator
  template:
    metadata:
      labels:
        app: trino
        role: coordinator
    spec:
      # 이슈 #2: trino 이미지 자체(JVM 번들)의 keytool로 내부 CA PEM을 PKCS12
      # trustStore로 변환한다. /etc/trino/tls는 이미 읽기 전용 Secret 볼륨이라(위 아래
      # tls-volume) 같은 경로에 쓸 수 없으므로 별도 쓰기 가능 emptyDir(truststore-volume)에
      # 만든다.
      initContainers:
        - name: build-truststore
          image: {{ .Values.trino.image }}
          command:
            - keytool
            - -importcert
            - -noprompt
            - -alias
            - beluga-internal-ca
            - -file
            - /etc/trino-ca/ca.crt
            - -keystore
            - /etc/trino/truststore/truststore.p12
            - -storetype
            - PKCS12
            - -storepass
            - changeit
          volumeMounts:
            - name: internal-ca
              mountPath: /etc/trino-ca
              readOnly: true
            - name: truststore-volume
              mountPath: /etc/trino/truststore
      containers:
        - name: trino
          image: {{ .Values.trino.image }}
          env:
            - name: TRINO_ENVIRONMENT
              value: "production"
            # Task 15: PKCS12 키스토어 비밀번호 — config.properties의 ${ENV:...} 치환으로
            # 평문 없이 주입(D15). Secret은 bootstrap 스크립트가 analytics 네임스페이스에 생성.
            - name: TRINO_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-keystore-password
                  key: password
            # D-D(Task 13): group-provider.properties의 ${ENV:...} 치환으로 평문 없이 주입(D15).
            # Secret은 bootstrap 스크립트가 analytics 네임스페이스에 생성.
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ldap-admin-credential
                  key: password
            # Task 16(D-E 2/2): config.properties의 oauth2.client-secret ${ENV:...} 치환.
            # keycloak-client-secrets는 D-K(이슈 #104)가 analytics 네임스페이스에 이미 복제해
            # 뒀다 — 새 Secret 불필요.
            - name: TRINO_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: trino
            # Task 16(D-E 2/2) 실측 결함: 인증이 켜지면 내부 통신 공유 시크릿이 필수다.
            - name: TRINO_INTERNAL_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: trino-internal-shared-secret
                  key: secret
            - name: TRINO_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: trino-s3-credential
                  key: access-key
            - name: TRINO_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: trino-s3-credential
                  key: secret-key
          ports:
            - containerPort: {{ .Values.trino.port }}
              name: http
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: catalog-volume
              mountPath: /etc/trino/catalog
            - name: access-control-volume
              mountPath: /etc/trino/access-control.properties
              subPath: access-control.properties
            - name: group-provider-volume
              mountPath: /etc/trino/group-provider.properties
              subPath: group-provider.properties
            - name: coordinator-config
              mountPath: /etc/trino/config.properties
              subPath: config.properties
            - name: jvm-config-volume
              mountPath: /etc/trino/jvm.config
              subPath: jvm.config
            - name: tls-volume
              mountPath: /etc/trino/tls
            - name: truststore-volume
              mountPath: /etc/trino/truststore
          resources:
            requests:
              memory: "1536Mi"
              cpu: "100m"
            limits:
              memory: "2048Mi"
              cpu: "1000m"
      volumes:
        - name: catalog-volume
          configMap:
            name: trino-catalog-iceberg
        - name: access-control-volume
          configMap:
            name: trino-access-control
        - name: group-provider-volume
          configMap:
            name: trino-group-provider
        - name: coordinator-config
          configMap:
            name: trino-coordinator-config
        - name: jvm-config-volume
          configMap:
            name: trino-jvm-config
        - name: tls-volume
          secret:
            secretName: trino-coordinator-tls-secret
        - name: truststore-volume
          emptyDir: {}
        - name: internal-ca
          configMap:
            name: beluga-internal-ca
{{- if .Values.trino.workerEnabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-worker-config
  namespace: analytics
data:
  config.properties: |
    coordinator=false
    http-server.http.port=8080
    discovery.uri=http://trino:8080
    # Task 16(D-E 2/2): 코디네이터와 동일한 이유 — 값도 반드시 동일해야 한다.
    internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-worker
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
      role: worker
  template:
    metadata:
      labels:
        app: trino
        role: worker
    spec:
      containers:
        - name: trino
          image: {{ .Values.trino.image }}
          env:
            - name: TRINO_ENVIRONMENT
              value: "production"
            # D-D(Task 13): 코디네이터와 동일 — 워커도 group-provider.properties를 로드하므로
            # 같은 env가 필요하다.
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ldap-admin-credential
                  key: password
            # Task 16(D-E 2/2) 실측 결함: 코디네이터와 동일한 값이어야 하는 내부 통신
            # 공유 시크릿.
            - name: TRINO_INTERNAL_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: trino-internal-shared-secret
                  key: secret
            - name: TRINO_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: trino-s3-credential
                  key: access-key
            - name: TRINO_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: trino-s3-credential
                  key: secret-key
          ports:
            - containerPort: {{ .Values.trino.port }}
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /etc/trino/config.properties
              subPath: config.properties
            - name: catalog-volume
              mountPath: /etc/trino/catalog
            - name: access-control-volume
              mountPath: /etc/trino/access-control.properties
              subPath: access-control.properties
            - name: group-provider-volume
              mountPath: /etc/trino/group-provider.properties
              subPath: group-provider.properties
          resources:
            requests:
              memory: "1536Mi"
              cpu: "100m"
            limits:
              memory: "2048Mi"
              cpu: "1000m"
      volumes:
        - name: config-volume
          configMap:
            name: trino-worker-config
        - name: catalog-volume
          configMap:
            name: trino-catalog-iceberg
        - name: access-control-volume
          configMap:
            name: trino-access-control
        - name: group-provider-volume
          configMap:
            name: trino-group-provider
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: analytics
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.trino.port }}
      targetPort: {{ .Values.trino.port }}
      name: http
    - port: 8443
      targetPort: 8443
      name: https
  selector:
    app: trino
    role: coordinator
