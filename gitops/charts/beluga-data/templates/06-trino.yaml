apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog-iceberg
  namespace: analytics
data:
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://lakekeeper.lakehouse.svc.cluster.local:8181/catalog
    iceberg.rest-catalog.warehouse=lake
    fs.native-s3.enabled=true
    s3.endpoint=http://seaweedfs-s3:8333
    s3.path-style-access=true
    s3.aws-access-key=any
    s3.aws-secret-key=any
    s3.region=us-east-1
---
# 프록시 경유 접근(APISIX)에서 Trino가 X-Forwarded-* 헤더를 거부해 406을 반환한다
# (헤더별 실측: X-Forwarded-For/Proto/Host → 406, 미포함 → 303). 전달 헤더 처리 활성화
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-coordinator-config
  namespace: analytics
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port={{ .Values.trino.port }}
    discovery.uri=http://trino:{{ .Values.trino.port }}
    http-server.process-forwarded=true
    # Task 15: cert-manager 발급 PKCS12 키스토어로 코디네이터 자체 HTTPS 활성화.
    # Task 16(OAuth2)의 전제조건 — HTTP 리스너는 인증 전환 전까지 그대로 유지한다.
    http-server.https.enabled=true
    http-server.https.port=8443
    http-server.https.keystore.path=/etc/trino/tls/keystore.p12
    http-server.https.keystore.key=${ENV:TRINO_KEYSTORE_PASSWORD}
---
# Task 15: cert-manager CA(beluga-internal-ca-issuer, beluga-platform 차트)로 발급하는
# 코디네이터 TLS 인증서 — PKCS12 키스토어를 같은 Secret에 함께 생성한다(Trino가 요구하는 포맷).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trino-coordinator-tls
  namespace: analytics
spec:
  secretName: trino-coordinator-tls-secret
  dnsNames:
    - trino
    - trino.analytics.svc.cluster.local
    - trino.{{ .Values.baseDomain }}
  issuerRef:
    name: beluga-internal-ca-issuer
    kind: ClusterIssuer
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: trino-keystore-password
        key: password
---
# D14: 중앙 OPA access control — Trino 438+ 내장 opa 플러그인 (Trino 468 사용 중)
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-access-control
  namespace: analytics
data:
  access-control.properties: |
    access-control.name=opa
    opa.policy.uri=http://opa.iam.svc.cluster.local:8181/v1/data/trino/allow
---
# D-D(Task 13): LDAP 그룹 프로바이더 — OPA 입력의 identity.groups를 채운다. OpenLDAP에
# memberOf 오버레이가 없어(전수 확인) 검색 모드만 쓴다. 연결 정보는 keycloak-ldap-federation.yaml이
# 이미 쓰는 값과 동일 — 이 클러스터에서 실제로 동작 중인 값을 재사용한다.
# ldap.group-search-filter는 (member={0})처럼 사용자별 자리표시자를 받는 필드가 아니다
# (Trino 공식 문서 https://trino.io/docs/current/security/group-mapping.html 확인 — 예시가
# (cn=trino_*)처럼 후보 그룹을 고르는 정적 필터다. 사용자 DN이 실제로 멤버인지는
# ldap.group-search-member-attribute로 별도 판정한다). 우리 그룹 3개(admins/engineers/
# analysts)는 모두 objectClass: groupOfNames이므로 그 클래스 전체를 후보로 준다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-group-provider
  namespace: analytics
data:
  group-provider.properties: |
    group-provider.name=ldap
    ldap.url=ldap://openldap.iam.svc.cluster.local:389
    ldap.allow-insecure=true
    ldap.admin-user=cn=admin,dc=beluga,dc=internal
    ldap.admin-password=${ENV:LDAP_ADMIN_PASSWORD}
    ldap.user-base-dn=ou=users,dc=beluga,dc=internal
    ldap.user-search-filter=(uid={0})
    ldap.use-group-filter=true
    ldap.group-base-dn=ou=groups,dc=beluga,dc=internal
    ldap.group-search-filter=(objectClass=groupOfNames)
    ldap.group-search-member-attribute=member
    ldap.group-name-attribute=cn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
      role: coordinator
  template:
    metadata:
      labels:
        app: trino
        role: coordinator
    spec:
      containers:
        - name: trino
          image: {{ .Values.trino.image }}
          env:
            - name: TRINO_ENVIRONMENT
              value: "production"
            # Task 15: PKCS12 키스토어 비밀번호 — config.properties의 ${ENV:...} 치환으로
            # 평문 없이 주입(D15). Secret은 bootstrap 스크립트가 analytics 네임스페이스에 생성.
            - name: TRINO_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-keystore-password
                  key: password
            # D-D(Task 13): group-provider.properties의 ${ENV:...} 치환으로 평문 없이 주입(D15).
            # Secret은 bootstrap 스크립트가 analytics 네임스페이스에 생성.
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ldap-admin-credential
                  key: password
          ports:
            - containerPort: {{ .Values.trino.port }}
              name: http
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: catalog-volume
              mountPath: /etc/trino/catalog
            - name: access-control-volume
              mountPath: /etc/trino/access-control.properties
              subPath: access-control.properties
            - name: group-provider-volume
              mountPath: /etc/trino/group-provider.properties
              subPath: group-provider.properties
            - name: coordinator-config
              mountPath: /etc/trino/config.properties
              subPath: config.properties
            - name: tls-volume
              mountPath: /etc/trino/tls
          resources:
            requests:
              memory: "1536Mi"
              cpu: "100m"
            limits:
              memory: "2048Mi"
              cpu: "1000m"
      volumes:
        - name: catalog-volume
          configMap:
            name: trino-catalog-iceberg
        - name: access-control-volume
          configMap:
            name: trino-access-control
        - name: group-provider-volume
          configMap:
            name: trino-group-provider
        - name: coordinator-config
          configMap:
            name: trino-coordinator-config
        - name: tls-volume
          secret:
            secretName: trino-coordinator-tls-secret
{{- if .Values.trino.workerEnabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-worker-config
  namespace: analytics
data:
  config.properties: |
    coordinator=false
    http-server.http.port=8080
    discovery.uri=http://trino:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-worker
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
      role: worker
  template:
    metadata:
      labels:
        app: trino
        role: worker
    spec:
      containers:
        - name: trino
          image: {{ .Values.trino.image }}
          env:
            - name: TRINO_ENVIRONMENT
              value: "production"
            # D-D(Task 13): 코디네이터와 동일 — 워커도 group-provider.properties를 로드하므로
            # 같은 env가 필요하다.
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ldap-admin-credential
                  key: password
          ports:
            - containerPort: {{ .Values.trino.port }}
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /etc/trino/config.properties
              subPath: config.properties
            - name: catalog-volume
              mountPath: /etc/trino/catalog
            - name: access-control-volume
              mountPath: /etc/trino/access-control.properties
              subPath: access-control.properties
            - name: group-provider-volume
              mountPath: /etc/trino/group-provider.properties
              subPath: group-provider.properties
          resources:
            requests:
              memory: "1536Mi"
              cpu: "100m"
            limits:
              memory: "2048Mi"
              cpu: "1000m"
      volumes:
        - name: config-volume
          configMap:
            name: trino-worker-config
        - name: catalog-volume
          configMap:
            name: trino-catalog-iceberg
        - name: access-control-volume
          configMap:
            name: trino-access-control
        - name: group-provider-volume
          configMap:
            name: trino-group-provider
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: analytics
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.trino.port }}
      targetPort: {{ .Values.trino.port }}
      name: http
    - port: 8443
      targetPort: 8443
      name: https
  selector:
    app: trino
    role: coordinator
