apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog-iceberg
  namespace: beluga-data
data:
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://lakekeeper:8181
    fs.native-s3.enabled=true
    s3.endpoint=http://seaweedfs-s3:8333
    s3.path-style-access=true
    s3.aws-access-key=any
    s3.aws-secret-key=any
    s3.region=us-east-1
---
# D14: 중앙 OPA access control — Trino 438+ 내장 opa 플러그인 (Trino 468 사용 중)
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-access-control
  namespace: beluga-data
data:
  access-control.properties: |
    access-control.name=opa
    opa.policy.uri=http://opa.beluga-system.svc.cluster.local:8181/v1/data/trino/allow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: beluga-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
      role: coordinator
  template:
    metadata:
      labels:
        app: trino
        role: coordinator
    spec:
      containers:
        - name: trino
          image: {{ .Values.trino.image }}
          env:
            - name: TRINO_ENVIRONMENT
              value: "production"
          ports:
            - containerPort: {{ .Values.trino.port }}
              name: http
          volumeMounts:
            - name: catalog-volume
              mountPath: /etc/trino/catalog
            - name: access-control-volume
              mountPath: /etc/trino/access-control.properties
              subPath: access-control.properties
          resources:
            requests:
              memory: "1536Mi"
              cpu: "100m"
            limits:
              memory: "2048Mi"
              cpu: "1000m"
      volumes:
        - name: catalog-volume
          configMap:
            name: trino-catalog-iceberg
        - name: access-control-volume
          configMap:
            name: trino-access-control
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: beluga-data
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.trino.port }}
      targetPort: {{ .Values.trino.port }}
      name: http
  selector:
    app: trino
    role: coordinator
