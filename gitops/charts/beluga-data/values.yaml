# Beluga Data Stack Values (VERSIONS.md & Spec D1~D8 참조)

# D11: APISIX 도메인 기반 라우팅
baseDomain: "local.beluga.internal"

seaweedfs:
  image: "chrislusf/seaweedfs:3.80"
  s3Port: 8333
  filerPort: 8888

cnpg:
  image: "ghcr.io/cloudnative-pg/cloudnative-pg:1.25.0"
  postgresVersion: "17"
  dbNameShop: "shop"
  dbNameMeta: "beluga_meta"

strimzi:
  operatorVersion: "0.45.0"
  kafkaVersion: "3.9.0"
  replicas: 3
  externalPort: 9094
  # D14 — opa-kafka-plugin authorizer. JAR가 포함된 커스텀 Kafka 이미지 필요(후속) — 기본 off
  opaAuthorizer: false

lakekeeper:
  image: "quay.io/lakekeeper/catalog:v0.14.0"
  port: 8181
  openfga:
    enabled: false  # D14 — OpenFGA 연동은 스토어 부트스트랩 후 활성 (재시작 시 in-memory 스토어 초기화 주의)
    endpoint: "http://openfga.beluga-system.svc.cluster.local:8080"

# D12: 거버넌스 카탈로그 — 32GB 프로파일 기본 off, 48GB+에서 up.sh가 활성 (D8)
openmetadata:
  enabled: false

flink:
  operatorVersion: "1.10.0"
  jobManagerMemory: "1024m"
  taskManagerMemory: "2048m"
  uiPort: 8081

trino:
  image: "trinodb/trino:468"
  port: 8080
  heapSizeGB: 2

airflow:
  image: "apache/airflow:3.0.0-python3.11"
  executor: "KubernetesExecutor"
  uiPort: 8085

superset:
  image: "apache/superset:4.1.1"
  uiPort: 8088
