# Beluga Data Stack Values (VERSIONS.md & Spec D1~D8 참조)

# D11: APISIX 도메인 기반 라우팅
baseDomain: "local.beluga.internal"

seaweedfs:
  image: "chrislusf/seaweedfs:3.80"
  s3Port: 8333
  filerPort: 8888

cnpg:
  image: "ghcr.io/cloudnative-pg/cloudnative-pg:1.25.0"
  postgresVersion: "17"
  dbNameShop: "shop"
  dbNameMeta: "beluga_meta"

strimzi:
  operatorVersion: "0.45.0"
  kafkaVersion: "3.9.0"
  replicas: 3
  externalPort: 9094

lakekeeper:
  image: "tabulario/iceberg-rest:latest"
  port: 8181

flink:
  operatorVersion: "1.10.0"
  jobManagerMemory: "1024m"
  taskManagerMemory: "2048m"
  uiPort: 8081

trino:
  image: "trinodb/trino:468"
  port: 8080
  heapSizeGB: 2

airflow:
  image: "apache/airflow:3.0.0-python3.11"
  executor: "KubernetesExecutor"
  uiPort: 8085

superset:
  image: "apache/superset:4.1.1"
  uiPort: 8088
