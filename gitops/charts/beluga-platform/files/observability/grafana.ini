; Grafana 설정 (templates/observability.yaml이 tpl로 렌더, 읽기 전용 마운트). defaults.ini 위에 덮어쓴다.
; D-OBS-5: SSO 전용(Keycloak grafana 클라이언트). 클라이언트 시크릿은 이 파일이 아니라
; Secret(keycloak-client-secrets/grafana) -> env GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET로만 주입한다.
[server]
http_port = {{ .Values.observability.grafana.port }}
root_url = https://grafana.{{ .Values.baseDomain }}

[log]
mode = console

; 외부 호출/자동 설치 차단(업데이트 확인, 분석, 뉴스피드, Grafana 12+ 기본 플러그인 사전 설치).
; 서드파티 플러그인은 별도 라이선스 검토 필요(policies/license-policy.yaml Grafana 예외 조건 4).
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[plugins]
preinstall_disabled = true
plugin_admin_enabled = false

[users]
allow_sign_up = false

[security]
cookie_secure = true
; 초기 admin/admin 계정을 만들지 않는다 — 모든 사용자는 SSO로만 들어온다.
disable_initial_admin_creation = true

[auth]
disable_login_form = true
; Grafana 로그아웃이 Keycloak 세션도 끝내도록 end-session 엔드포인트로 보낸다([auth] 섹션 — 13.3.0 defaults.ini 확인).
signout_redirect_url = {{ printf "https://sso.%s/realms/%s/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%%3A%%2F%%2Fgrafana.%s%%2F" .Values.baseDomain .realm .Values.baseDomain }}

; SSO 전용: 로그인 폼만 숨기면 Basic Auth(API)가 남으므로 명시적으로 끈다. 익명/프록시/JWT 인증도 끈다.
; break-glass는 두지 않는다(이 리포에 Grafana용 패턴 없음) — 탈출구는 templates/observability.yaml D-OBS-5 주석.
[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[auth.proxy]
enabled = false

[auth.jwt]
enabled = false

[auth.generic_oauth]
enabled = true
name = Keycloak
auto_login = true
client_id = grafana
scopes = openid profile email groups
auth_url = https://sso.{{ .Values.baseDomain }}/realms/{{ .realm }}/protocol/openid-connect/auth
token_url = https://sso.{{ .Values.baseDomain }}/realms/{{ .realm }}/protocol/openid-connect/token
api_url = https://sso.{{ .Values.baseDomain }}/realms/{{ .realm }}/protocol/openid-connect/userinfo
use_pkce = true
login_attribute_path = preferred_username
name_attribute_path = name
; 그룹 -> 역할(policies/groups.yaml의 admins/engineers/analysts, Superset AUTH_ROLES_MAPPING과 같은 계열).
; 어느 그룹에도 없으면 strict로 로그인을 거부한다(기본 Viewer 부여 금지).
role_attribute_path = contains(groups[*], 'admins') && 'Admin' || contains(groups[*], 'engineers') && 'Editor' || contains(groups[*], 'analysts') && 'Viewer'
role_attribute_strict = true
