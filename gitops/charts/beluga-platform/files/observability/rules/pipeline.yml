# D-ALERT-9: incident-derived thresholds before node eviction / 1GiB slot cap.
# Cost: heuristic lead time; escape hatch: tune after measured growth/evaluation latency.
groups:
- name: pipeline
  interval: 30s
  rules:
  - alert: ScrapeTargetDown
    expr: up == 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Scrape target {{ $labels.job }}/{{ $labels.instance }} down
      description: Target has failed scrapes for 10m. Check discovery, NetworkPolicy, kubelet TLS/RBAC and exporter
        health.
      runbook_url: https://github.com/dasomel/beluga/blob/main/docs/runbooks/cdc-slot-wal-retention.md
  - alert: Watchdog
    expr: vector(1)
    for: 1m
    labels:
      severity: info
    annotations:
      summary: Alerting pipeline watchdog
      description: Always fires after 1m. Presence in vmalert and Alertmanager proves evaluation and delivery only;
        no external notification channel is configured.
      runbook_url: https://github.com/dasomel/beluga/blob/main/docs/runbooks/cdc-slot-wal-retention.md
  # D-ALERT-21 (#412): Flink JobManager 비응답/실행 중 잡 0개 및 반복 재시작 경보.
  # 비용: 5m 평가 지연, 정적 Service로 JobManager만 직접 스크레이프; 탈출구: 임계값/주기를 실측 후 조정.
  - alert: FlinkNoRunningJobs
    expr: up{job="flink"} == 0 or absent(flink_jobmanager_numRunningJobs{job="flink"}) or flink_jobmanager_numRunningJobs{job="flink"} < 1
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Flink JobManager down or no RUNNING jobs
      description: Flink JobManager metrics endpoint is down, the RUNNING job metric is absent, or it reports 0 RUNNING jobs for 5m. Inspect JobManager logs for broken HA checkpoint handles and verify SeaweedFS chunks.
      runbook_url: https://github.com/dasomel/beluga/blob/main/docs/runbooks/flink-ha-broken-checkpoint.md
  - alert: FlinkJobManagerRestarting
    expr: changes(container_start_time_seconds{job="kubelet-resource",namespace="streaming",container="flink-main-container"}[15m]) >= 2 or resets(flink_jobmanager_Status_JVM_CPU_Time{job="flink"}[15m]) >= 2
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Flink container or JobManager JVM restarting repeatedly
      description: Flink container start time changed or JobManager JVM uptime reset at least twice in 15m ({{ $value }}). Check JobManager logs and HA checkpoint ConfigMaps in namespace streaming.
      runbook_url: https://github.com/dasomel/beluga/blob/main/docs/runbooks/flink-ha-broken-checkpoint.md
  # D-ALERT-22: working-set headroom, not Linux MemAvailable; includes kernel pressure.
  # 22/24 GiB leaves 8.3%: warn <15%/5m, critical <10%/2m before exhaustion.
  # Cost: heuristic, inactive cache accounting differs; escape: tune from live samples.
  - alert: NodeMemoryLow
    expr: 100 * (1 - max by (node) (node_memory_working_set_bytes{job="kubelet-resource"}) / (max by (node) (machine_memory_bytes{job="kubelet-cadvisor"}) > 0)) < 15
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Node memory headroom low on {{ $labels.node }}
      description: Working-set headroom is {{ $value }}% (<15%). Inspect node memory, kernel slab and OOM events from the operator host; reduce load before the API becomes unavailable.
      runbook_url: https://github.com/dasomel/beluga/blob/main/docs/monitoring-alerting-coverage.md
  - alert: NodeMemoryLow
    expr: 100 * (1 - max by (node) (node_memory_working_set_bytes{job="kubelet-resource"}) / (max by (node) (machine_memory_bytes{job="kubelet-cadvisor"}) > 0)) < 10
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Node memory headroom low on {{ $labels.node }}
      description: Working-set headroom is {{ $value }}% (<10%). Inspect node memory, kernel slab and OOM events from the operator host; reduce load before the API becomes unavailable.
      runbook_url: https://github.com/dasomel/beluga/blob/main/docs/monitoring-alerting-coverage.md
  # D-ALERT-26: absent inputs silently empty the headroom expression; use the
  # exact inputs and existing filesystem absence grace (15m) across node restarts.
  # Cost: fleet-wide absence only, delayed warning; escape: reviewed per-node inventory.
  - alert: NodeMemoryMetricsMissing
    expr: absent(node_memory_working_set_bytes{job="kubelet-resource"}) or absent(machine_memory_bytes{job="kubelet-cadvisor"})
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Node memory headroom inputs missing
      description: Working-set or machine capacity series have been absent for 15m. NodeMemoryLow cannot evaluate without both inputs. Check kubelet resource/cAdvisor scrapes and metric filters; partial node loss needs per-node inventory checks.
      runbook_url: https://github.com/dasomel/beluga/blob/main/docs/monitoring-alerting-coverage.md
  # D-ALERT-23: resource metrics lack owner labels. Allowlist chart Deployment/StatefulSet
  # pod names with Kubernetes safe-encoded hashes, excluding chart Jobs.
  # Count each unchanged pod/container identity, never sum rollouts.
  # Cost: operator/custom workloads uncovered; escape: reviewed owner metadata source.
  # D-SHOP-7: include shop-gen so invalid-config exits are visible.
  # Cost: allowlist maintenance; escape hatch: adopt reviewed owner metadata.
  - alert: ContainerRestartingFrequently
    expr: changes(container_start_time_seconds{job="kubelet-resource",pod=~"(apisix|apisix-ingress-controller|apisix-etcd|manager-domain-api|manager-web|vmalert|alertmanager|grafana|keycloak|opa|openfga|openldap|debezium-connect|lakekeeper|trino-coordinator|trino-worker|opensearch|openmetadata|airflow-webserver|superset|clickstream-gen|shop-gen)-[bcdfghjklmnpqrstvwxz2456789]+-[a-z0-9]+|(victoria-metrics|seaweedfs)-[0-9]+"}[30m]) >= 3
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} restarting
      description: Container start time changed at least three times in 30m ({{ $value }}). Inspect previous logs and OOM events. Only allowlisted chart Deployment/StatefulSet pod names are covered; Jobs are excluded.
      runbook_url: https://github.com/dasomel/beluga/blob/main/docs/monitoring-alerting-coverage.md
