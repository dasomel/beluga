# D13: Keycloak SSO User Provisioning Job (iam)
# D20/D-J: 계정 원천은 LDAP이다. keycloak.yaml의 realm import는 "groups"를 빈 배열로 둔다
# (로컬 그룹은 LDAP과 이름 공간이 갈라져 write-back이 안 된다). 이 Job이 대상으로 삼는
# admins/engineers/analysts는 keycloak-group-mapper가 등록한 group-ldap-mapper(LDAP_ONLY)를
# 통해 노출되는 LDAP 기반 그룹이므로, 사용자를 여기 넣으면 LDAP ou=groups의 member 속성에
# write-through 된다. realm 롤(beluga-admin 등)은 로컬 그룹 삭제로 실릴 곳이 없어졌으므로
# 이 Job이 각 LDAP 기반 그룹에 직접 매핑한다(REALM_ROLE_MAP, 4번 단계).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-users
  namespace: iam
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # sync-wave: LDAP 페더레이션(웨이브 3)이 붙은 **뒤에** 실행돼야 한다. 그러지 않으면
    # 여기서 만든 사용자가 Keycloak 로컬 계정이 되어 LDAP에 기록되지 않는다
    # (federationLink 없음 → ou=users 비어 있음으로 실측). 페더레이션이 editMode=WRITABLE
    # 이므로 순서만 맞으면 Keycloak이 사용자를 LDAP에 써 준다. D20("LDAP이 계정 원천")의
    # 전제가 이 순서에 달려 있다.
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: keycloak-users
          image: python:3.12-slim
          command:
            - python3
            - -c
            - |
              import sys
              import time
              import json
              import urllib.request
              import urllib.parse
              import urllib.error

              KC_BASE = "http://keycloak.iam.svc.cluster.local:8080"
              REALM = "beluga"
              ADMIN_USER = "admin"
              ADMIN_PASS = {{ .Values.credentials.keycloakAdminPassword | quote }}

              # D-J: 그룹명은 LDAP 기준 복수형(admins/engineers/analysts) — openldap.yaml의
              # ou=groups,dc=beluga,dc=internal 아래 실제로 존재하는 이름과 맞춘다.
              USERS = [
                  {
                      "username": "beluga-admin",
                      "password": {{ .Values.credentials.userPasswords.admin | quote }},
                      "group": "admins",
                      "firstName": "Admin",
                      "lastName": "Beluga",
                      "email": "beluga-admin@beluga.local"
                  },
                  {
                      "username": "beluga-engineer",
                      "password": {{ .Values.credentials.userPasswords.engineer | quote }},
                      "group": "engineers",
                      "firstName": "Engineer",
                      "lastName": "Beluga",
                      "email": "beluga-engineer@beluga.local"
                  },
                  {
                      "username": "beluga-analyst",
                      "password": {{ .Values.credentials.userPasswords.analyst | quote }},
                      "group": "analysts",
                      "firstName": "Analyst",
                      "lastName": "Beluga",
                      "email": "beluga-analyst@beluga.local"
                  }
              ]

              # D-J: 로컬 그룹 삭제로 realmRoles를 realm import에 실을 곳이 없어졌으므로,
              # 이 Job이 각 LDAP 기반 그룹에 해당 realm 롤을 직접(멱등하게) 매핑한다.
              REALM_ROLE_MAP = {
                  "admins": "beluga-admin",
                  "engineers": "beluga-engineer",
                  "analysts": "beluga-analyst"
              }

              def make_req(url, data=None, headers=None, method=None):
                  if headers is None:
                      headers = {}
                  if data is not None and isinstance(data, (dict, list)):
                      data = json.dumps(data).encode("utf-8")
                      headers["Content-Type"] = "application/json"
                  elif data is not None and isinstance(data, str):
                      data = data.encode("utf-8")

                  req = urllib.request.Request(url, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req) as resp:
                          body = resp.read().decode("utf-8")
                          return resp.status, body
                  except urllib.error.HTTPError as e:
                      err_body = e.read().decode("utf-8")
                      print(f"HTTPError: {e.code} for {url}: {err_body}")
                      raise e
                  except Exception as e:
                      print(f"Error for {url}: {e}")
                      raise e

              # 1. Wait for Keycloak realm endpoint
              print("Waiting for Keycloak realm beluga to be ready...")
              realm_url = f"{KC_BASE}/realms/{REALM}"
              ready = False
              for i in range(60):
                  try:
                      status, _ = make_req(realm_url)
                      if status == 200:
                          print("Keycloak realm is ready!")
                          ready = True
                          break
                  except Exception:
                      pass
                  time.sleep(5)

              if not ready:
                  print("Keycloak did not become ready in time.")
                  sys.exit(1)

              # 2. Get master admin token
              print("Obtaining admin token...")
              token_url = f"{KC_BASE}/realms/master/protocol/openid-connect/token"
              token_data = urllib.parse.urlencode({
                  "client_id": "admin-cli",
                  "grant_type": "password",
                  "username": ADMIN_USER,
                  "password": ADMIN_PASS
              }).encode("utf-8")
              headers = {"Content-Type": "application/x-www-form-urlencoded"}

              try:
                  status, body = make_req(token_url, data=token_data, headers=headers, method="POST")
                  if status != 200:
                      print(f"Failed to get admin token, status: {status}")
                      sys.exit(1)
                  token_json = json.loads(body)
                  access_token = token_json["access_token"]
              except Exception as e:
                  print(f"Error obtaining admin token: {e}")
                  sys.exit(1)

              auth_headers = {"Authorization": f"Bearer {access_token}"}

              # 3. Get groups mapping
              # D-J: group-ldap-mapper(LDAP_ONLY)가 붙은 직후에는 LDAP 기반 그룹이 아직
              # Keycloak에 노출되지 않을 수 있으므로, 필요한 그룹 3개가 모두 보일 때까지
              # 재시도한다(5초 간격 최대 60회 = 5분). 1번 단계의 준비-대기 관용구와 동일하다.
              print("Fetching realm groups...")
              groups_url = f"{KC_BASE}/admin/realms/{REALM}/groups"
              required_groups = set(REALM_ROLE_MAP.keys())
              group_map = {}
              for i in range(60):
                  try:
                      status, body = make_req(groups_url, headers=auth_headers)
                      if status == 200:
                          groups_list = json.loads(body)
                          group_map = {g["name"]: g["id"] for g in groups_list}
                          if required_groups.issubset(group_map.keys()):
                              print(f"Group map: {group_map}")
                              break
                          print(f"Waiting for groups {required_groups - group_map.keys()} to appear via LDAP mapper...")
                      else:
                          print(f"Failed to fetch groups, status: {status}")
                  except Exception as e:
                      print(f"Error fetching groups: {e}")
                  time.sleep(5)
              else:
                  print(f"Required groups {required_groups} did not all appear within 5 minutes. Got: {group_map}")
                  sys.exit(1)

              # 4. Map realm roles to groups (idempotent)
              print("Mapping realm roles to LDAP-backed groups...")
              for group_name, role_name in REALM_ROLE_MAP.items():
                  group_id = group_map[group_name]

                  # 롤 representation 조회
                  role_url = f"{KC_BASE}/admin/realms/{REALM}/roles/{role_name}"
                  try:
                      status, body = make_req(role_url, headers=auth_headers)
                      if status != 200:
                          print(f"Failed to fetch role {role_name}, status: {status}")
                          sys.exit(1)
                      role_rep = json.loads(body)
                  except Exception as e:
                      print(f"Error fetching role {role_name}: {e}")
                      sys.exit(1)

                  # 이미 매핑됐는지 확인 (재실행 안전성)
                  mappings_url = f"{KC_BASE}/admin/realms/{REALM}/groups/{group_id}/role-mappings/realm"
                  try:
                      status, body = make_req(mappings_url, headers=auth_headers)
                      if status != 200:
                          print(f"Failed to fetch role mappings for group {group_name}, status: {status}")
                          sys.exit(1)
                      existing_roles = {r["name"] for r in json.loads(body)}
                  except Exception as e:
                      print(f"Error fetching role mappings for group {group_name}: {e}")
                      sys.exit(1)

                  if role_name in existing_roles:
                      print(f"Role {role_name} already mapped to group {group_name}, skipping.")
                      continue

                  try:
                      status, _ = make_req(mappings_url, data=[role_rep], headers=auth_headers, method="POST")
                      if status != 204:
                          print(f"Failed to map role {role_name} to group {group_name}, status: {status}")
                          sys.exit(1)
                      print(f"Mapped role {role_name} to group {group_name}.")
                  except Exception as e:
                      print(f"Error mapping role {role_name} to group {group_name}: {e}")
                      sys.exit(1)

              # 5. Create/update users
              for u in USERS:
                  username = u["username"]
                  group_name = u["group"]
                  password = u["password"]

                  if group_name not in group_map:
                      print(f"Error: Group '{group_name}' not found in Keycloak realm!")
                      sys.exit(1)
                  group_id = group_map[group_name]

                  user_payload = {
                      "username": username,
                      "enabled": True,
                      "emailVerified": True,
                      "email": u["email"],
                      "firstName": u["firstName"],
                      "lastName": u["lastName"]
                  }

                  # Check if user exists
                  search_url = f"{KC_BASE}/admin/realms/{REALM}/users?username={urllib.parse.quote(username)}&exact=true"
                  user_id = None
                  try:
                      status, body = make_req(search_url, headers=auth_headers)
                      if status == 200:
                          found_users = json.loads(body)
                          for fu in found_users:
                              if fu.get("username") == username:
                                  user_id = fu.get("id")
                                  break
                  except Exception as e:
                      print(f"Error searching user {username}: {e}")
                      sys.exit(1)

                  if not user_id:
                      print(f"Creating user {username}...")
                      create_url = f"{KC_BASE}/admin/realms/{REALM}/users"
                      try:
                          status, _ = make_req(create_url, data=user_payload, headers=auth_headers, method="POST")
                          if status != 201:
                              print(f"Failed to create user {username}, status: {status}")
                              sys.exit(1)
                      except Exception as e:
                          print(f"Error creating user {username}: {e}")
                          sys.exit(1)

                      # Get ID of created user
                      try:
                          status, body = make_req(search_url, headers=auth_headers)
                          found_users = json.loads(body)
                          for fu in found_users:
                              if fu.get("username") == username:
                                  user_id = fu.get("id")
                                  break
                      except Exception as e:
                          print(f"Error getting ID for created user {username}: {e}")
                          sys.exit(1)

                      if not user_id:
                          print(f"Created user {username} but couldn't retrieve ID!")
                          sys.exit(1)
                  else:
                      print(f"Updating existing user {username} (ID: {user_id})...")
                      update_url = f"{KC_BASE}/admin/realms/{REALM}/users/{user_id}"
                      try:
                          status, _ = make_req(update_url, data=user_payload, headers=auth_headers, method="PUT")
                          if status not in (200, 204):
                              print(f"Failed to update user {username}, status: {status}")
                              sys.exit(1)
                      except Exception as e:
                          print(f"Error updating user {username}: {e}")
                          sys.exit(1)

                  # Set password
                  print(f"Setting password for {username}...")
                  pwd_url = f"{KC_BASE}/admin/realms/{REALM}/users/{user_id}/reset-password"
                  pwd_payload = {
                      "type": "password",
                      "value": password,
                      "temporary": False
                  }
                  try:
                      status, _ = make_req(pwd_url, data=pwd_payload, headers=auth_headers, method="PUT")
                      if status not in (200, 204):
                          print(f"Failed to set password for {username}, status: {status}")
                          sys.exit(1)
                  except Exception as e:
                      print(f"Error setting password for {username}: {e}")
                      sys.exit(1)

                  # Join Group
                  # D-J: 대상 그룹이 LDAP 기반(group-ldap-mapper, LDAP_ONLY)이므로 이 PUT은
                  # Keycloak을 거쳐 LDAP ou=groups의 member 속성에 write-through 된다.
                  print(f"Assigning user {username} to group {group_name} (ID: {group_id})...")
                  grp_url = f"{KC_BASE}/admin/realms/{REALM}/users/{user_id}/groups/{group_id}"
                  try:
                      status, _ = make_req(grp_url, data="", headers=auth_headers, method="PUT")
                      if status not in (200, 204):
                          print(f"Failed to assign group for {username}, status: {status}")
                          sys.exit(1)
                  except Exception as e:
                      print(f"Error assigning group for {username}: {e}")
                      sys.exit(1)

              print("Keycloak user configuration completed successfully.")
