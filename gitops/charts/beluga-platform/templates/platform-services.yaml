{{- if .Values.certManager.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
{{- end }}
{{- if .Values.prometheusGrafana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: grafana-external
  namespace: beluga-system
spec:
  type: NodePort
  ports:
    - port: {{ .Values.prometheusGrafana.grafanaPort }}
      targetPort: 3000
      nodePort: 30000
      name: http
  selector:
    app.kubernetes.io/name: grafana
{{- end }}
