# D20: ldapium OpenLDAP 2.6.14 Server & Initial Directory Structure Job (iam)
# ldapium is maintained by dasomel and never seeds sample/demo accounts.
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  namespace: iam
spec:
  type: ClusterIP
  ports:
    - name: ldap
      port: 389
      targetPort: 389
    - name: ldaps
      port: 636
      targetPort: 636
  selector:
    app: openldap
---
# 이슈 #2: Keycloak→LDAP federation의 LDAPS 전환용 서버 인증서. ldapium 자체 문서(GitHub
# README) 확인 결과 LDAP_TLS_ENABLED=true는 636을 389와 함께(둘 다) 연다 — 평문 389를
# 끄는 옵션은 이미지에 없다. federation 쪽(keycloak-ldap-federation.yaml)에서 ldaps://만
# 쓰도록 전환해 실사용 경로를 TLS로 만든다.
#
# Codex 리뷰 실측(이슈 #2): LDAP_TLS_ENABLED=true는 부트스트랩(최초 기동, cn=config가
# 비어 있을 때) 시점에만 cn=config에 olcTLSCertificateFile 등을 굽는다(ldapium
# /usr/local/bin/entrypoint.sh L315-317 실측 확인 — "changing TLS on an already-bootstrapped
# volume requires editing cn=config manually"). 이 PVC(openldap-data/-config)는 TLS 도입
# (34699c2) 이전에 이미 부트스트랩돼 cn=config에 olcTLS*가 전혀 없다(라이브 파드
# ldapsearch로 빈 결과 실측) → 636 리스너에 인증서가 없어 모든 LDAPS 핸드셰이크가
# handshake_failure로 실패한다. GitOps 재현성(D1) 유지를 위해 수동 cn=config 편집 대신
# 아래 openldap 컨테이너의 postStart 훅이 매 기동마다 멱등 ldapmodify로 수렴시킨다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openldap-tls
  namespace: iam
spec:
  secretName: openldap-tls-secret
  dnsNames:
    - openldap
    - openldap.iam.svc.cluster.local
  issuerRef:
    name: beluga-internal-ca-issuer
    kind: ClusterIssuer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openldap-data
  namespace: iam
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openldap-config
  namespace: iam
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-seed-ldifs
  namespace: iam
data:
  10-beluga-structure.ldif: |
    dn: ou=users,dc=beluga,dc=internal
    objectClass: organizationalUnit
    ou: users

    dn: ou=groups,dc=beluga,dc=internal
    objectClass: organizationalUnit
    ou: groups

    dn: cn=admins,ou=groups,dc=beluga,dc=internal
    objectClass: groupOfNames
    cn: admins
    member: cn=admin,dc=beluga,dc=internal

    dn: cn=engineers,ou=groups,dc=beluga,dc=internal
    objectClass: groupOfNames
    cn: engineers
    member: cn=admin,dc=beluga,dc=internal

    dn: cn=analysts,ou=groups,dc=beluga,dc=internal
    objectClass: groupOfNames
    cn: analysts
    member: cn=admin,dc=beluga,dc=internal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: iam
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
        - name: openldap
          image: ghcr.io/dasomel/ldapium:nightly-4e85165
          env:
            - name: LDAP_ROOT_DN
              value: "dc=beluga,dc=internal"
            - name: LDAP_ORG_NAME
              value: "Beluga"
            - name: LDAP_ADMIN_DN
              value: "cn=admin,dc=beluga,dc=internal"
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ldap-admin-credential
                  key: password
            - name: LDAP_TLS_ENABLED
              value: "true"
            - name: LDAP_TLS_CERT_FILE
              value: "/etc/openldap/tls/tls.crt"
            - name: LDAP_TLS_KEY_FILE
              value: "/etc/openldap/tls/tls.key"
            - name: LDAP_TLS_CA_FILE
              value: "/etc/openldap/tls/ca.crt"
            - name: LDAP_SEED_DIR
              value: "/opt/ldifs"
          ports:
            - containerPort: 389
              name: ldap
            - containerPort: 636
              name: ldaps
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: ldap-data
              mountPath: /var/lib/openldap/data
            - name: ldap-config
              mountPath: /etc/openldap/slapd.d
            - name: seed-ldifs
              mountPath: /opt/ldifs
              readOnly: true
            - name: ldap-tls
              mountPath: /etc/openldap/tls
              readOnly: true
          # Codex 리뷰 실측(이슈 #2): 이미 부트스트랩된 PVC(openldap-config)의 cn=config에
          # olcTLS* 속성이 없어 636 리스너가 인증서 없이 열린다(위 Certificate 주석 참고).
          # ldapi:// 유닉스 소켓(entrypoint.sh가 쓰는 것과 동일 경로/방식)으로
          # cn=admin,cn=config(디렉터리 admin과 동일 비밀번호 재사용 — 02-cn-config-admin.ldif
          # 확인)에 바인드해 olcTLSCertificateFile/-KeyFile/-CACertificateFile을
          # replace한다. 매 기동마다 실행되는 멱등 연산(같은 값 재적용은 무해)이라
          # GitOps 재현성(D1)을 지키면서 수동 cn=config 편집을 피한다. 최초 부트스트랩
          # 파드에서는 entrypoint.sh가 임시 slapd로 같은 ldapi 소켓을 먼저 띄우므로
          # (같은 값 replace라 무해) 경합해도 안전하다.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -eu
                    if [ "$LDAP_TLS_ENABLED" != "true" ] && [ "$LDAP_TLS_ENABLED" != "1" ]; then
                      echo "[tls-converge] LDAP_TLS_ENABLED not true — skipping."
                      exit 0
                    fi
                    umask 077
                    LDAPI_URL="ldapi://%2Fvar%2Flib%2Fopenldap%2Frun%2Fldapi"
                    ADMIN_PW_FILE=$(mktemp)
                    TLS_LDIF=$(mktemp)
                    trap 'rm -f "$ADMIN_PW_FILE" "$TLS_LDIF"' EXIT
                    printf '%s' "$LDAP_ADMIN_PASSWORD" > "$ADMIN_PW_FILE"

                    echo "[tls-converge] waiting for cn=config over ldapi (up to 90s)..."
                    i=0
                    until ldapsearch -x -H "$LDAPI_URL" -D "cn=admin,cn=config" -y "$ADMIN_PW_FILE" -s base -b "cn=config" "(objectClass=*)" 1.1 >/dev/null 2>&1; do
                      i=$((i + 1))
                      if [ "$i" -ge 45 ]; then
                        echo "[tls-converge] cn=config unreachable after 90s — failing closed (D2)." >&2
                        exit 1
                      fi
                      sleep 2
                    done

                    {
                      printf 'dn: cn=config\n'
                      printf 'changetype: modify\n'
                      printf 'replace: olcTLSCertificateFile\n'
                      printf 'olcTLSCertificateFile: %s\n' "$LDAP_TLS_CERT_FILE"
                      printf '%s\n' '-'
                      printf 'replace: olcTLSCertificateKeyFile\n'
                      printf 'olcTLSCertificateKeyFile: %s\n' "$LDAP_TLS_KEY_FILE"
                      if [ -n "${LDAP_TLS_CA_FILE:-}" ]; then
                        printf '%s\n' '-'
                        printf 'replace: olcTLSCACertificateFile\n'
                        printf 'olcTLSCACertificateFile: %s\n' "$LDAP_TLS_CA_FILE"
                      fi
                    } > "$TLS_LDIF"

                    if ldapmodify -x -H "$LDAPI_URL" -D "cn=admin,cn=config" -y "$ADMIN_PW_FILE" -f "$TLS_LDIF"; then
                      echo "[tls-converge] cn=config TLS attributes converged."
                    else
                      echo "[tls-converge] ldapmodify failed — failing closed (D2)." >&2
                      exit 1
                    fi
          readinessProbe:
            exec:
              command: ["ldapwhoami", "-x", "-H", "ldap://localhost:389"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["ldapwhoami", "-x", "-H", "ldap://localhost:389"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: ldap-data
          persistentVolumeClaim:
            claimName: openldap-data
        - name: ldap-config
          persistentVolumeClaim:
            claimName: openldap-config
        - name: seed-ldifs
          configMap:
            name: openldap-seed-ldifs
        - name: ldap-tls
          secret:
            secretName: openldap-tls-secret
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openldap-init
  namespace: iam
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # sync-wave: 이 Job은 ldapium 서버가 뜬 뒤에 실행돼야 한다. 서버 Deployment는 웨이브
    # 미지정(=0)이므로 이 Job은 반드시 0보다 커야 한다. 예전에는 -2였는데, 서버와 Job이
    # 같은 네임스페이스에 이미 존재하던 동안에는 서버가 살아 있어 문제가 드러나지 않았다.
    # 네임스페이스를 새로 만들어 처음부터 배포하자 "존재하지 않는 서버를 기다리는 Job이
    # 서버 배포를 막는" 데드락이 됐다(ArgoCD가 훅 완료 전까지 일반 리소스를 적용하지 않음).
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: openldap-init
          image: ghcr.io/dasomel/ldapium:nightly-4e85165
          env:
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ldap-admin-credential
                  key: password
            # D-M(이슈 #110): Trino PASSWORD 인증(password-authenticator.properties)이
            # direct bind로 검증할 전용 서비스 계정. 사람 계정이 아니라 ou=users가 아닌
            # ou=services 아래 둔다 — 이슈 #106이 검토 중인 읽기 전용 group-provider bind
            # 계정과 같은 자리를 공유할 수 있게 미리 마련해 둔 OU.
            - name: TRINO_LDAP_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-ldap-service-credential
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              LDAP_HOST="openldap.iam.svc.cluster.local"
              BASE_DN="dc=beluga,dc=internal"
              ADMIN_DN="cn=admin,dc=beluga,dc=internal"
              ADMIN_PW="$LDAP_ADMIN_PASSWORD"

              echo "Waiting for ldapium at $LDAP_HOST:389..."
              until ldapsearch -x -H "ldap://$LDAP_HOST:389" -b "$BASE_DN" -D "$ADMIN_DN" -w "$ADMIN_PW" "(objectClass=*)" >/dev/null 2>&1; do
                echo "ldapium not ready yet, sleeping 2s..."
                sleep 2
              done
              echo "ldapium is ready."

              add_if_missing() {
                dn="$1"
                ldif="$2"
                if ldapsearch -x -H "ldap://$LDAP_HOST:389" -b "$dn" -s base -D "$ADMIN_DN" -w "$ADMIN_PW" "(objectClass=*)" >/dev/null 2>&1; then
                  echo "Entry $dn already exists. Skipping."
                else
                  echo "Adding entry $dn..."
                  printf '%s\n' "$ldif" | ldapadd -x -H "ldap://$LDAP_HOST:389" -D "$ADMIN_DN" -w "$ADMIN_PW"
                fi
              }

              # D-M(이슈 #110): 그룹 엔트리는 이미 add_if_missing으로 존재하지만, 거기 새
              # member DN 하나를 추가하는 건 별도 연산이다(add_if_missing은 엔트리 자체의
              # 존재만 보고 스킵) — member 값 자체의 존재 여부로 멱등성을 판단한다.
              add_member_if_missing() {
                group_dn="$1"
                member_dn="$2"
                if ldapsearch -x -H "ldap://$LDAP_HOST:389" -b "$group_dn" -s base -D "$ADMIN_DN" -w "$ADMIN_PW" "(member=$member_dn)" 2>/dev/null | grep -qi "^dn:"; then
                  echo "$member_dn already a member of $group_dn. Skipping."
                else
                  echo "Adding $member_dn to $group_dn..."
                  printf 'dn: %s\nchangetype: modify\nadd: member\nmember: %s\n' "$group_dn" "$member_dn" \
                    | ldapmodify -x -H "ldap://$LDAP_HOST:389" -D "$ADMIN_DN" -w "$ADMIN_PW"
                fi
              }

              add_if_missing "ou=users,$BASE_DN" "dn: ou=users,$BASE_DN
              objectClass: organizationalUnit
              ou: users"
              add_if_missing "ou=groups,$BASE_DN" "dn: ou=groups,$BASE_DN
              objectClass: organizationalUnit
              ou: groups"
              add_if_missing "cn=admins,ou=groups,$BASE_DN" "dn: cn=admins,ou=groups,$BASE_DN
              objectClass: groupOfNames
              cn: admins
              member: $ADMIN_DN"
              add_if_missing "cn=engineers,ou=groups,$BASE_DN" "dn: cn=engineers,ou=groups,$BASE_DN
              objectClass: groupOfNames
              cn: engineers
              member: $ADMIN_DN"
              add_if_missing "cn=analysts,ou=groups,$BASE_DN" "dn: cn=analysts,ou=groups,$BASE_DN
              objectClass: groupOfNames
              cn: analysts
              member: $ADMIN_DN"

              # D-M(이슈 #110): Trino PASSWORD 인증용 서비스 계정 — 클리어텍스트를 그대로
              # 굽지 않고 slappasswd로 {SSHA} 해시해 userPassword에 넣는다.
              add_if_missing "ou=services,$BASE_DN" "dn: ou=services,$BASE_DN
              objectClass: organizationalUnit
              ou: services"
              TRINO_SVC_HASH="$(slappasswd -s "$TRINO_LDAP_SERVICE_PASSWORD")"
              add_if_missing "uid=trino-svc,ou=services,$BASE_DN" "dn: uid=trino-svc,ou=services,$BASE_DN
              objectClass: inetOrgPerson
              uid: trino-svc
              cn: trino-svc
              sn: service-account
              userPassword: $TRINO_SVC_HASH"

              # D-M(이슈 #110 실배포 실측): PASSWORD 인증만으로는 부족하다 — Trino의
              # group-provider가 그룹을 못 찾으면 OPA(default allow=false)가 모든 쿼리를
              # "Access Denied: Cannot execute query"로 거부한다(실측). analysts는 이
              # 서비스 계정(Superset 대시보드가 iceberg 카탈로그를 SELECT만 하면 되는
              # 최소 권한)에 필요한 catalog access/execute-query/이 대시보드가 쓰는
              # events_enriched·orders 컬럼 select를 전부 커버한다(trino.rego 확인).
              add_member_if_missing "cn=analysts,ou=groups,$BASE_DN" "uid=trino-svc,ou=services,$BASE_DN"

              echo "ldapium initial directory structure completed successfully."
