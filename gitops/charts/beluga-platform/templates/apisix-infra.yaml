# D11: APISIX etcd backend (narwhal apisix-infra.yaml 패턴)
# registry.k8s.io/etcd: K8s 공식 레지스트리, ARM64 지원, no Bitnami
# 이슈 #109 실배포 실측: emptyDir였을 때 노드 재기동으로 파드가 재생성되며 etcd가
# 빈 상태로 재초기화됐다. apisix-ingress-controller는 파드 재기동 없이 계속 살아있어
# "이미 동기화됨" 인메모리 캐시를 유지한 채라 빈 etcd에 아무것도 다시 밀어넣지 않았고,
# 그 결과 게이트웨이가 전 호스트 404로 죽었다(컨트롤러 파드를 수동으로 지워야만 복구).
# OpenLDAP(D20)·SeaweedFS(#7)와 같은 유형의 "재기동 시 상태 소실" 결함 — PVC로 근본 해결.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apisix-etcd-data
  namespace: platform-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-etcd
  namespace: platform-system
spec:
  replicas: 1
  # RWO PVC이므로 신규 파드가 이전 파드의 볼륨을 붙잡고 있는 동안 기동할 수 없다
  # (OpenLDAP D20과 동일 교훈) — RollingUpdate 기본값 대신 명시.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: apisix-etcd
  template:
    metadata:
      labels:
        app: apisix-etcd
    spec:
      containers:
        - name: etcd
          image: registry.k8s.io/etcd:3.5.31-0
          command:
            - etcd
            - --data-dir=/var/etcd/data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://apisix-etcd.platform-system.svc.cluster.local:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://apisix-etcd.platform-system.svc.cluster.local:2380
            - --initial-cluster=default=http://apisix-etcd.platform-system.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --auto-compaction-mode=revision
            - --auto-compaction-retention=1000
          env:
            - name: ETCDCTL_API
              value: "3"
          ports:
            - containerPort: 2379
            - containerPort: 2380
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/etcd/data
          readinessProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: apisix-etcd-data
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-etcd
  namespace: platform-system
spec:
  selector:
    app: apisix-etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
