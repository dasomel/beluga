# D13: Keycloak SSO Server & Realm Config (iam 네임스페이스)
# D15: 자격증명 정책 — 부트스트랩 시 openssl rand 기반 동적 랜덤 생성 및 Secret 주입 (01-argocd-bootstrap.sh).
# D-J(이슈 #104): realm JSON의 clients 5종에는 더 이상 "secret" 필드가 없다. --import-realm은
# Keycloak 최초 기동 시 1회만 실행되므로, ConfigMap의 secret 값을 나중에 바꿔도 이미 만들어진
# realm의 클라이언트 시크릿에는 반영되지 않는다(실측: ConfigMap을 복구해 재동기화해도 DB의
# 값은 계속 옛값 SET-AT-BOOTSTRAP였다). secret을 비우면 Keycloak이 임의값으로 클라이언트를
# 만들고, keycloak-clients.yaml Job이 매 동기화마다 실제 목표값으로 PUT하여 교정한다 —
# "최초 1회만 적용되는 realm import"와 "재실행 가능해야 하는 자격증명 갱신"을 분리한 것이다.
# D-J: realm import의 "groups"는 의도적으로 빈 배열이다. 로컬 그룹(admin/engineer/analyst)은
# LDAP 그룹(admins/engineers/analysts, ou=groups,dc=beluga,dc=internal)과 이름 공간이 갈라져
# 있어, 사용자를 로컬 그룹에 넣어도 LDAP member 속성에 기록되지 않는다. 그룹은 LDAP이 원천이며
# 실제 그룹은 keycloak-group-mapper의 group-ldap-mapper(LDAP_ONLY)가 LDAP에서 노출하고,
# realm 롤 매핑은 keycloak-users Job이 그 LDAP 기반 그룹에 붙인다. realm 롤 정의(아래 roles.realm)
# 자체는 그대로 둔다 — 롤은 Keycloak이 원천이다.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: iam
data:
  beluga-realm.json: |
    {
      "realm": "beluga",
      "enabled": true,
      "registrationAllowed": false,
      "resetPasswordAllowed": true,
      "roles": {
        "realm": [
          {
            "name": "beluga-analyst",
            "description": "Beluga Analyst base role"
          },
          {
            "name": "beluga-engineer",
            "description": "Beluga Engineer role (includes beluga-analyst)",
            "composite": true,
            "composites": {
              "realm": [
                "beluga-analyst"
              ]
            }
          },
          {
            "name": "beluga-admin",
            "description": "Beluga Admin role (includes beluga-engineer)",
            "composite": true,
            "composites": {
              "realm": [
                "beluga-engineer"
              ]
            }
          }
        ]
      },
      "groups": [],
      "clientScopes": [
        {
          "name": "groups",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "groups",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "roles",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "realm roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "roles",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ],
      "defaultDefaultClientScopes": [
        "web-origins",
        "acr",
        "profile",
        "roles",
        "email",
        "groups"
      ],
      "clients": [
        {
          "clientId": "superset",
          "name": "Superset BI",
          "enabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "redirectUris": [
            "http://superset.{{ .Values.baseDomain }}/*"
          ],
          "directAccessGrantsEnabled": true,
          "standardFlowEnabled": true,
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "email",
            "groups"
          ]
        },
        {
          "clientId": "airflow",
          "name": "Airflow",
          "enabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "redirectUris": [
            "http://airflow.{{ .Values.baseDomain }}/*"
          ],
          "directAccessGrantsEnabled": true,
          "standardFlowEnabled": true,
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "email",
            "groups"
          ]
        },
        {
          "clientId": "openmetadata",
          "name": "OpenMetadata",
          "enabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "redirectUris": [
            "http://metadata.{{ .Values.baseDomain }}/*"
          ],
          "directAccessGrantsEnabled": true,
          "standardFlowEnabled": true,
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "email",
            "groups"
          ]
        },
        {
          "clientId": "grafana",
          "name": "Grafana",
          "enabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "redirectUris": [
            "http://grafana.{{ .Values.baseDomain }}/*"
          ],
          "directAccessGrantsEnabled": true,
          "standardFlowEnabled": true,
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "email",
            "groups"
          ]
        },
        {
          "clientId": "trino",
          "name": "Trino",
          "enabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "redirectUris": [
            "http://trino.{{ .Values.baseDomain }}/*",
            "https://trino.{{ .Values.baseDomain }}/*",
            "https://trino.analytics.svc.cluster.local:8443/*"
          ],
          "directAccessGrantsEnabled": true,
          "standardFlowEnabled": true,
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "email",
            "groups"
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: iam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.1
          command:
            - /opt/keycloak/bin/kc.sh
            - start
            - --import-realm
            - --http-enabled=true
            - --hostname=http://sso.{{ .Values.baseDomain }}
            - --proxy-headers=xforwarded
            - --health-enabled=true
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres-main-rw.database.svc.cluster.local:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credential
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credential
                  key: password
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credential
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credential
                  key: password
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
          # KC 25+: /health는 관리 포트(9000) 전용 — 8080 프로브는 404로 정상 서버를 죽임 (E2E 실측)
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 40
            periodSeconds: 15
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: iam
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: keycloak
  namespace: iam
spec:
  externalNodes:
    - type: Domain
      name: keycloak.iam.svc.cluster.local
      port: 8080
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: keycloak
  namespace: iam
spec:
  http:
    - name: keycloak
      match:
        hosts:
          - sso.{{ .Values.baseDomain }}
        paths:
          - "/*"
      upstreams:
        - name: keycloak
      plugins:
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                X-Content-Type-Options: "nosniff"
                X-Frame-Options: "SAMEORIGIN"
