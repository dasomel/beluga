# D19: LDAP 그룹 → Keycloak 그룹 동기화.
# 이것이 없으면 사용자만 임포트되고 그룹이 넘어오지 않아 "사용자→그룹→롤" 사슬이 끊긴다.
# Trino 권한과는 무관 — Trino는 LDAP 그룹 프로바이더로 identity.groups를 직접 채운다(D-D, Task 13).
# 이 매퍼가 필요한 건 Keycloak을 IdP로 쓰는 다른 서비스들: Superset AUTH_ROLES_MAPPING(그룹명 키),
# 계획 2의 매트릭스 화면.
# mode=LDAP_ONLY라야 Keycloak→LDAP 쓰기가 된다 (IMPORT/READ_ONLY는 쓰기 안 됨).
# 실측 결함(D-J 배포 후): group-ldap-mapper 컴포넌트를 등록하는 것만으로는 LDAP 그룹이
# Keycloak에 나타나지 않는다. 매퍼가 mode=LDAP_ONLY로 정상 등록된 상태에서 GET /groups는
# LDAP 그룹을 하나도 반환하지 않았고, sync?direction=fedToKeycloak을 명시 호출하자 응답이
# "3 imported groups"를 보고하며 admins/engineers/analysts가 즉시 나타났다. 그래서 sync를
# 명시적으로 호출하고, 실제로 그룹이 보이는지 GET으로 검증한 뒤에야 성공으로 간주한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-group-mapper
  namespace: iam
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # sync-wave: keycloak-ldap-federation(웨이브 3)이 만든 LDAP 프로바이더 컴포넌트 ID를
    # 조회해서 쓰므로 반드시 그 뒤여야 한다. 부트스트랩 스크립트는 kubectl wait로 순서를
    # 강제하지만 ArgoCD 동기화 경로에는 그 보장이 없어 웨이브로 명시한다.
    argocd.argoproj.io/sync-wave: "4"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: keycloak-group-mapper
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mapper
          image: python:3.12-slim
          command:
            - python3
            - -c
            - |
              import json, sys, time, urllib.error, urllib.parse, urllib.request

              KC = "http://keycloak.iam.svc.cluster.local:8080"
              REALM = "beluga"
              ADMIN_PASS = {{ .Values.credentials.keycloakAdminPassword | quote }}

              def req(url, data=None, headers=None, method=None):
                  headers = dict(headers or {})
                  if isinstance(data, (dict, list)):
                      data = json.dumps(data).encode()
                      headers["Content-Type"] = "application/json"
                  r = urllib.request.Request(url, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(r) as resp:
                          body = resp.read().decode()
                          return resp.status, (json.loads(body) if body else None)
                  except urllib.error.HTTPError as e:
                      return e.code, e.read().decode()

              # 1. Keycloak 준비 대기
              for _ in range(60):
                  s, _b = req(f"{KC}/realms/{REALM}")
                  if s == 200:
                      break
                  time.sleep(5)
              else:
                  print("Keycloak이 준비되지 않았다"); sys.exit(1)

              # 2. admin 토큰
              tok_data = urllib.parse.urlencode({
                  "client_id": "admin-cli", "grant_type": "password",
                  "username": "admin", "password": ADMIN_PASS,
              }).encode()
              s, body = req(f"{KC}/realms/master/protocol/openid-connect/token",
                            data=tok_data,
                            headers={"Content-Type": "application/x-www-form-urlencoded"},
                            method="POST")
              if s != 200:
                  print(f"토큰 실패: {s} {body}"); sys.exit(1)
              auth = {"Authorization": f"Bearer {body['access_token']}"}

              # 3. LDAP 프로바이더 컴포넌트 찾기
              #    서버측 type 필터는 빈 목록을 반환하므로 전체를 받아 클라이언트에서 거른다
              s, comps = req(f"{KC}/admin/realms/{REALM}/components", headers=auth)
              if s != 200:
                  print(f"컴포넌트 조회 실패: {s} {comps}"); sys.exit(1)
              ldap = [c for c in comps if c.get("providerId") == "ldap"]
              if len(ldap) != 1:
                  print(f"LDAP 프로바이더가 정확히 1개여야 한다 (현재 {len(ldap)}개)"); sys.exit(1)
              parent_id = ldap[0]["id"]

              # 4. group-ldap-mapper 멱등 생성
              #    groups.dn은 openldap.yaml의 openldap-init Job이 실제로 만드는 트리를 쓴다:
              #    cn={admins,engineers,analysts},ou=groups,dc=beluga,dc=internal
              #    대소문자는 매칭에 영향을 주지 않는다 — ou(organizationalUnitName)의 EQUALITY는
              #    caseIgnoreMatch라 ou=Groups와 ou=groups는 같은 DN으로 해소된다(openldap.yaml:57-60이
              #    vegardit 이미지의 ou=Groups와 init Job의 ou=groups가 충돌하지 않는 이유로 같은 사실을
              #    적고 있다). 소문자를 쓰는 건 실제 생성값과 표기를 맞추기 위함이지 매칭 요건이 아니다.
              existing = [c for c in comps
                          if c.get("providerId") == "group-ldap-mapper" and c.get("parentId") == parent_id]
              payload = {
                  "name": "beluga-groups",
                  "providerId": "group-ldap-mapper",
                  "providerType": "org.keycloak.storage.ldap.mappers.LDAPStorageMapper",
                  "parentId": parent_id,
                  "config": {
                      "groups.dn": ["ou=groups,dc=beluga,dc=internal"],
                      "group.name.ldap.attribute": ["cn"],
                      "group.object.classes": ["groupOfNames"],
                      "membership.ldap.attribute": ["member"],
                      "membership.attribute.type": ["DN"],
                      "membership.user.ldap.attribute": ["uid"],
                      "mode": ["LDAP_ONLY"],
                      "user.roles.retrieve.strategy": ["LOAD_GROUPS_BY_MEMBER_ATTRIBUTE"],
                      "preserve.group.inheritance": ["false"],
                      "drop.non.existing.groups.during.sync": ["false"],
                  },
              }
              if existing:
                  mapper_id = existing[0]["id"]
                  payload["id"] = mapper_id
                  s, b = req(f"{KC}/admin/realms/{REALM}/components/{mapper_id}",
                             data=payload, headers=auth, method="PUT")
                  ok = s in (200, 204)
              else:
                  s, b = req(f"{KC}/admin/realms/{REALM}/components", data=payload, headers=auth, method="POST")
                  ok = s == 201
                  # POST 응답 헤더(Location)는 req()가 반환하지 않으므로, 방금 만든 컴포넌트를
                  # 재조회해서 id를 얻는다.
                  mapper_id = None
                  if ok:
                      s2, comps2 = req(f"{KC}/admin/realms/{REALM}/components", headers=auth)
                      if s2 == 200:
                          created = [c for c in comps2
                                     if c.get("providerId") == "group-ldap-mapper" and c.get("parentId") == parent_id]
                          if created:
                              mapper_id = created[0]["id"]
              if not ok:
                  print(f"매퍼 생성/갱신 실패: {s} {b}"); sys.exit(1)
              if not mapper_id:
                  print("매퍼 id를 조회하지 못했다 (sync 호출 불가)"); sys.exit(1)
              print("group-ldap-mapper 등록 완료")

              # 5. fedToKeycloak 동기화 — 등록만으로는 LDAP 그룹이 넘어오지 않는다(위 실측 결함 참고).
              #    이 호출이 있어야 GET /groups에 admins/engineers/analysts가 즉시 나타난다.
              sync_url = f"{KC}/admin/realms/{REALM}/user-storage/{parent_id}/mappers/{mapper_id}/sync?direction=fedToKeycloak"
              s, b = req(sync_url, data=b"", headers=auth, method="POST")
              if s != 200:
                  print(f"그룹 동기화 실패: {s} {b}"); sys.exit(1)
              print(f"그룹 동기화 결과: {b}")

              # 6. 실제로 LDAP 기반 그룹 3개가 노출됐는지 검증 — "등록 완료" 로그만으로 성공을
              #    단정하지 않는다(이 결함이 26시간 숨어 있던 원인).
              s, groups_after = req(f"{KC}/admin/realms/{REALM}/groups", headers=auth)
              if s != 200:
                  print(f"동기화 후 그룹 조회 실패: {s} {groups_after}"); sys.exit(1)
              names_after = {g["name"] for g in groups_after}
              required = {"admins", "engineers", "analysts"}
              missing = required - names_after
              if missing:
                  print(f"동기화 후에도 그룹이 보이지 않는다: {missing} (전체: {names_after})"); sys.exit(1)
              print(f"그룹 노출 확인 완료: {names_after}")
