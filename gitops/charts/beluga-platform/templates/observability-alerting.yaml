{{- if .Values.observability.enabled }}
{{- $obs := .Values.observability }}
{{- $rules := .Files.Glob "files/observability/rules/*.yml" }}
# D-ALERT-7: 규칙은 tpl 없이 넣어 Prometheus annotation 템플릿을 보존한다.
# 비용: 규칙 내부 Helm values 불가; 탈출구: 별도 명시적 렌더 계약으로 변경.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: platform-system
data:
{{ $rules.AsConfig | indent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: platform-system
data:
  alertmanager.yml: |
{{ toYaml $obs.alertmanager.config | indent 4 }}
---
# D-ALERT-8: 단일 Alertmanager의 silence/nflog는 256Mi PVC에 보존한다.
# 이유: 재생성 시 silence 소실 방지. 비용: local-path 노드 의존; 탈출구: 복제 스토리지/HA 설계.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: platform-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: {{ $obs.alertmanager.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: platform-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
        app.kubernetes.io/name: vmalert
      annotations:
        checksum/config: {{ $rules.AsConfig | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmalert
          image: {{ $obs.vmalert.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "-httpListenAddr=:{{ $obs.vmalert.port }}"
            - "-rule=/etc/vmalert/rules/*.yml"
            - "-evaluationInterval=30s"
            - "-datasource.url=http://victoria-metrics.platform-system.svc.cluster.local:{{ $obs.victoriaMetrics.port }}"
            - "-remoteWrite.url=http://victoria-metrics.platform-system.svc.cluster.local:{{ $obs.victoriaMetrics.port }}"
            - "-remoteRead.url=http://victoria-metrics.platform-system.svc.cluster.local:{{ $obs.victoriaMetrics.port }}"
            - "-notifier.url=http://alertmanager.platform-system.svc.cluster.local:{{ $obs.alertmanager.port }}"
          ports:
            - name: http
              containerPort: {{ $obs.vmalert.port }}
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: platform-system
spec:
  type: ClusterIP
  selector:
    app: vmalert
  ports:
    - name: http
      port: {{ $obs.vmalert.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: platform-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
        app.kubernetes.io/name: alertmanager
      annotations:
        checksum/config: {{ toYaml $obs.alertmanager.config | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: {{ $obs.alertmanager.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "--web.listen-address=:{{ $obs.alertmanager.port }}"
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--data.retention=120h"
            - "--cluster.listen-address="
          ports:
            - name: http
              containerPort: {{ $obs.alertmanager.port }}
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 128Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: platform-system
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: http
      port: {{ $obs.alertmanager.port }}
      targetPort: http
{{- end }}
