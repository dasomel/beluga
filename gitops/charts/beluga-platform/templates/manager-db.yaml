# Beluga Manager 감사 DB (ADR-0009 D-MSSO-11/12, 롤아웃 ③): 전용 CNPG 클러스터 + 마이그레이션 Job.
#
# D-MSSO-11a: 스키마의 단일 원천은 files/manager-db/migrations/NNNN_*.sql 이다. Job이 매 동기화마다
#   manager_owner로 사전순 적용한다(각 파일은 재실행 가능해야 한다). Manager는 manager_writer로만 붙는다
#   (sso_change_event는 INSERT/SELECT만 — UPDATE/DELETE/TRUNCATE 불가).
# D-MSSO-11b: 두 롤의 비밀번호는 Git/렌더 값에 없다. 01-argocd-bootstrap.sh(--manager-db-secrets-only 포함)가
#   Secret manager-db-owner / manager-db-writer 를 만든다(D15/D-K 패턴).
# D-MSSO-11c: 백업 섹션 없음 — 감사 DB 백업(barman)은 후속이다. 이 결정의 두 번째 기록은 PR 본문이다.
# D-MSSO-11d: TLS는 CNPG가 만든 서버 인증서를 쓴다. 서버 인증서 SAN에는 <cluster>-rw.<ns>.svc.cluster.local 이
#   들어 있고(GetClusterAltDNSNames, v1.30.0 api/v1/cluster_funcs.go), CA는 Secret <cluster>-ca 의 ca.crt 다
#   (docs: https://cloudnative-pg.io/documentation/1.30/certificates/ — 소스 v1.30.0 docs/src/certificates.md 로 확인).
{{- $migrations := .Files.Glob "files/manager-db/migrations/*.sql" }}
{{- if not $migrations }}
{{- fail "files/manager-db/migrations/*.sql 이 하나도 없다 — 마이그레이션 Job이 빈 ConfigMap으로 성공해 버린다" }}
{{- end }}
{{- $all := "" }}
{{- range $path, $_ := $migrations }}
{{- $all = print $all (base $path) ($.Files.Get $path) }}
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: manager-db
  namespace: platform-system
  annotations:
    # 매니저 Deployment(웨이브 0)와 마이그레이션 Job(훅, 웨이브 5)보다 먼저 만든다.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:17.6"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: manager
      owner: manager_owner
      secret:
        name: manager-db-owner
  managed:
    roles:
      # CNPG 1.30 declarative role management:
      # https://cloudnative-pg.io/documentation/1.30/declarative_role_management/
      # 마이그레이션 SQL이 GRANT 대상으로 삼는 롤이라 CNPG가 먼저 만들고 Job이 존재를 기다린다.
      - name: manager_writer
        ensure: present
        login: true
        inherit: false
        connectionLimit: 20
        passwordSecret:
          name: manager-db-writer
---
# NetworkPolicy: manager-db 파드로의 인그레스를 domain-api, 마이그레이션 Job, CNPG 오퍼레이터(cnpg-system),
# 같은 클러스터 파드로 한정한다. kubelet 프로브는 노드 발신이라 영향 없다. 오퍼레이터는 상태 포트 8000과
# 5432를 쓴다. Egress는 건드리지 않는다(platform-system에 default-deny 없음 — manager.yaml 머리말 참고).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: manager-db-ingress
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: manager-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: manager-domain-api
        - podSelector:
            matchLabels:
              app: manager-db-migrate
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: manager-db
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: manager-db-migrations
  namespace: platform-system
data:
{{- range $path, $_ := $migrations }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: manager-db-migrate
  namespace: platform-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: manager-db-migrate
      annotations:
        # 마이그레이션 내용이 바뀌면 파드 템플릿이 바뀌어 재실행됨이 드러난다(훅이라 매 동기화마다 어차피 재생성).
        checksum/migrations: {{ $all | sha256sum | trunc 16 | quote }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/cloudnative-pg/postgresql:17.6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          env:
            - name: PGHOST
              value: manager-db-rw.platform-system.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: manager
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: manager-db-owner
                  key: username
            # 비밀번호는 argv/로그에 나오지 않는다(libpq가 환경변수에서 읽는다).
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: manager-db-owner
                  key: password
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/manager-db-ca/ca.crt
            - name: PGCONNECT_TIMEOUT
              value: "5"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # 서버가 응답하고 manager_writer 롤이 생길 때까지 기다린다(60x5s). CNPG 롤 reconcile은 비동기다.
              i=0
              until [ "$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'manager_writer'" 2>/dev/null || true)" = "1" ]; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo "manager-db not ready or role manager_writer missing after 300s" >&2
                  exit 1
                fi
                echo "waiting for manager-db and role manager_writer ($i/60)..."
                sleep 5
              done
              # 사전순 적용(NNNN_ 접두사). 각 파일은 재실행 가능해야 한다.
              for f in $(ls /migrations/*.sql | sort); do
                echo "applying $(basename "$f")"
                psql -v ON_ERROR_STOP=1 -f "$f"
              done
              echo "manager-db migrations applied"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
            - name: manager-db-ca
              mountPath: /etc/manager-db-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: migrations
          configMap:
            name: manager-db-migrations
        - name: manager-db-ca
          secret:
            secretName: manager-db-ca
            defaultMode: 0444
            # ca.key가 든 Secret 전체를 마운트하지 않는다(ca.crt만 투영).
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir: {}
