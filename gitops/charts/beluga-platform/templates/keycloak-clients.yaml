# D-J(이슈 #104): OIDC 클라이언트 시크릿 reconcile Job.
# --import-realm은 Keycloak 최초 기동 시 1회만 실행된다 — realm JSON(keycloak.yaml)에
# 클라이언트 시크릿을 박아 두면, 이후 ConfigMap 값을 아무리 바꿔도 이미 만들어진 realm의
# 클라이언트에는 반영될 경로가 없다(실측: 부트스트랩 파라미터를 복구해 재동기화해도 DB의
# 시크릿은 계속 SET-AT-BOOTSTRAP 플레이스홀더였다 — 그 사이 각 서비스는 K8s Secret의 실제
# 랜덤값을 쓰고 있어 SSO 로그인이 전부 401로 깨져 있었다). 그래서 keycloak.yaml은 secret
# 필드를 아예 비워 Keycloak이 임의값으로 클라이언트를 만들게 하고, 이 Job이 매 동기화마다
# 5개 클라이언트(superset/airflow/openmetadata/grafana/trino)의 시크릿을 목표값으로 PUT해
# 교정한다 — "최초 1회만 적용되는 realm import"와 "재실행 가능해야 하는 자격증명 갱신"의 분리.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-clients
  namespace: iam
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # sync-wave: keycloak-users와 동일한 웨이브. 페더레이션(3)·그룹 매퍼(4) 뒤에만 실행되면
    # 되고, 클라이언트 시크릿 교정은 사용자/그룹 프로비저닝과 순서 의존성이 없다.
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak-clients
          image: python:3.12-slim
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # D-K(이슈 #104): Helm 렌더 시점 굽기 대신 컨테이너 env(secretKeyRef)를 os.environ으로 읽는다.
          env:
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credential
                  key: password
            - name: CLIENT_SECRET_SUPERSET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: superset
            - name: CLIENT_SECRET_AIRFLOW
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: airflow
            - name: CLIENT_SECRET_OPENMETADATA
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: openmetadata
            - name: CLIENT_SECRET_GRAFANA
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: grafana
            - name: CLIENT_SECRET_TRINO
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: trino
            - name: CLIENT_SECRET_FLINK
              valueFrom:
                secretKeyRef:
                  name: keycloak-flink-client-secret
                  key: flink
            - name: CLIENT_SECRET_LAKEKEEPER_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-lakekeeper-admin-secret
                  key: lakekeeper-admin
            # D-SSO-3: apisix-gateway client secret from iam secret
            - name: CLIENT_SECRET_APISIX_GATEWAY
              valueFrom:
                secretKeyRef:
                  name: keycloak-apisix-client-secret
                  key: apisix-gateway
            # D-SSO-4: argocd client secret from iam secret
            - name: CLIENT_SECRET_ARGOCD
              valueFrom:
                secretKeyRef:
                  name: keycloak-argocd-client-secret
                  key: argocd
          command:
            - python3
            - -c
            - |
              import os
              import sys
              import time
              import json
              import urllib.request
              import urllib.parse
              import urllib.error

              KC_BASE = "http://keycloak.iam.svc.cluster.local:8080"
              REALM = "beluga"
              ADMIN_USER = "admin"
              ADMIN_PASS = os.environ["KEYCLOAK_ADMIN_PASSWORD"]

              # D-J: keycloak.yaml이 예전에 realm JSON에 박아 두던 것과 같은 자격증명.
              # D-SSO-3, D-SSO-4: apisix-gateway, argocd 추가
              CLIENT_SECRETS = {
                  "superset": os.environ["CLIENT_SECRET_SUPERSET"],
                  "airflow": os.environ["CLIENT_SECRET_AIRFLOW"],
                  "openmetadata": os.environ["CLIENT_SECRET_OPENMETADATA"],
                  "grafana": os.environ["CLIENT_SECRET_GRAFANA"],
                  "trino": os.environ["CLIENT_SECRET_TRINO"],
                  "flink": os.environ["CLIENT_SECRET_FLINK"],
                  "lakekeeper-admin": os.environ["CLIENT_SECRET_LAKEKEEPER_ADMIN"],
                  "apisix-gateway": os.environ["CLIENT_SECRET_APISIX_GATEWAY"],
                  "argocd": os.environ["CLIENT_SECRET_ARGOCD"],
              }

              # D-SSO-3, D-SSO-4: Single source redirect URIs derived from .Values.sso
              CLIENT_REDIRECT_URIS = {
                  "trino": [
                      "https://trino.{{ .Values.baseDomain }}/*",
                      "https://trino.analytics.svc.cluster.local:8443/*",
                  ],
                  "superset": [
                      "https://superset.{{ .Values.baseDomain }}/*",
                  ],
                  "airflow": [
                      "https://airflow.{{ .Values.baseDomain }}/*",
                  ],
                  "openmetadata": [
                      "https://metadata.{{ .Values.baseDomain }}/*",
                  ],
                  "grafana": [
                      "https://grafana.{{ .Values.baseDomain }}/*",
                  ],
                  "argocd": [
                  {{- $argocdUri := printf "https://argocd.%s/auth/callback" .Values.baseDomain }}
                  {{- if and .Values.sso .Values.sso.endpoints }}
                    {{- range .Values.sso.endpoints }}
                      {{- if eq .name "argocd" }}
                        {{- $argocdUri = printf "https://%s%s" (include "beluga.ssoHost" (dict "host" .host "root" $)) (.redirectPath | default "/auth/callback") }}
                      {{- end }}
                    {{- end }}
                  {{- end }}
                      "{{ $argocdUri }}",
                  ],
                  "beluga-manager": [
                  {{- $managerHost := printf "manager.%s" .Values.baseDomain }}
                  {{- $managerUri := printf "https://manager.%s/auth/callback" .Values.baseDomain }}
                  {{- if and .Values.sso .Values.sso.endpoints }}
                    {{- range .Values.sso.endpoints }}
                      {{- if eq .name "manager" }}
                        {{- $managerHost = (include "beluga.ssoHost" (dict "host" .host "root" $)) }}
                        {{- $managerUri = printf "https://%s%s" (include "beluga.ssoHost" (dict "host" .host "root" $)) (.redirectPath | default "/auth/callback") }}
                      {{- end }}
                    {{- end }}
                  {{- end }}
                      "{{ $managerUri }}",
                  ],
                  "apisix-gateway": [
                  {{- if and .Values.sso .Values.sso.endpoints }}
                    {{- $uris := list }}
                    {{- range .Values.sso.endpoints }}
                      {{- if eq .mode "gateway-oidc" }}
                        {{- $uris = append $uris (printf "https://%s/.apisix/redirect" (include "beluga.ssoHost" (dict "host" .host "root" $))) }}
                        {{- $uris = append $uris (printf "https://%s/*" (include "beluga.ssoHost" (dict "host" .host "root" $))) }}
                      {{- end }}
                    {{- end }}
                    {{- range $uris }}
                      "{{ . }}",
                    {{- end }}
                  {{- else }}
                      "https://flink.{{ .Values.baseDomain }}/.apisix/redirect",
                      "https://flink.{{ .Values.baseDomain }}/*",
                      "https://filer.{{ .Values.baseDomain }}/.apisix/redirect",
                      "https://filer.{{ .Values.baseDomain }}/*",
                      "https://catalog.{{ .Values.baseDomain }}/.apisix/redirect",
                      "https://catalog.{{ .Values.baseDomain }}/*",
                  {{- end }}
                  ],
                  "lakekeeper": [
                      "https://catalog.{{ .Values.baseDomain }}/ui/*",
                      "https://catalog.{{ .Values.baseDomain }}/*",
                  ],
              }

              def make_req(url, data=None, headers=None, method=None):
                  if headers is None:
                      headers = {}
                  if data is not None and isinstance(data, (dict, list)):
                      data = json.dumps(data).encode("utf-8")
                      headers["Content-Type"] = "application/json"
                  elif data is not None and isinstance(data, str):
                      data = data.encode("utf-8")

                  req = urllib.request.Request(url, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req) as resp:
                          body = resp.read().decode("utf-8")
                          return resp.status, body
                  except urllib.error.HTTPError as e:
                      err_body = e.read().decode("utf-8")
                      print(f"HTTPError: {e.code} for {url}: {err_body}")
                      raise e
                  except Exception as e:
                      print(f"Error for {url}: {e}")
                      raise e

              # 1. Wait for Keycloak realm endpoint
              print("Waiting for Keycloak realm beluga to be ready...")
              realm_url = f"{KC_BASE}/realms/{REALM}"
              ready = False
              for i in range(60):
                  try:
                      status, _ = make_req(realm_url)
                      if status == 200:
                          print("Keycloak realm is ready!")
                          ready = True
                          break
                  except Exception:
                      pass
                  time.sleep(5)

              if not ready:
                  print("Keycloak did not become ready in time.")
                  sys.exit(1)

              # 2. Get master admin token
              # D-J: keycloak-users.yaml과 동일한 이유로 함수로 뽑는다 — 토큰 기본 수명 1분,
              # 클라이언트 5개를 순회하는 동안 만료될 수 있으므로 필요할 때마다 새로 받는다.
              def get_admin_token():
                  print("Obtaining admin token...")
                  token_url = f"{KC_BASE}/realms/master/protocol/openid-connect/token"
                  token_data = urllib.parse.urlencode({
                      "client_id": "admin-cli",
                      "grant_type": "password",
                      "username": ADMIN_USER,
                      "password": ADMIN_PASS
                  }).encode("utf-8")
                  headers = {"Content-Type": "application/x-www-form-urlencoded"}
                  try:
                      status, body = make_req(token_url, data=token_data, headers=headers, method="POST")
                      if status != 200:
                          print(f"Failed to get admin token, status: {status}")
                          sys.exit(1)
                      return json.loads(body)["access_token"]
                  except Exception as e:
                      print(f"Error obtaining admin token: {e}")
                      sys.exit(1)

              auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}

              # 3. Get clients mapping (clientId -> internal id)
              print("Fetching realm clients...")
              clients_url = f"{KC_BASE}/admin/realms/{REALM}/clients"
              try:
                  status, body = make_req(clients_url, headers=auth_headers)
                  if status != 200:
                      print(f"Failed to fetch clients, status: {status}")
                      sys.exit(1)
                  clients_list = json.loads(body)
                  client_map = {c["clientId"]: c["id"] for c in clients_list}
              except Exception as e:
                  print(f"Error fetching clients: {e}")
                  sys.exit(1)

              # 클라이언트별 속성 선언. 생성 본문(아래 CLIENT_SPECS)과 5b 단계의 reconcile이 같은 선언을 쓴다.
              #  - flink: 5b 주석 참고(토큰 교환).
              #  - beluga-manager (D-MSSO-6): PKCE S256 강제 + 로그아웃 후 리다이렉트 허용 URI.
              CLIENT_ATTRIBUTES = {
                  "flink": {"standard.token.exchange.enabled": "true"},
                  "beluga-manager": {
                      "pkce.code.challenge.method": "S256",
                      "post.logout.redirect.uris": "https://{{ $managerHost }}/",
                  },
              }

              # 생성 시점에만 반영되던 클라이언트 설정. 5c 단계가 기존 클라이언트에도 PUT 병합으로 교정한다
              # (공개 클라이언트·직접 grant 금지·웹 오리진은 보안 경계라 수동 변경이 남지 않게 한다).
              CLIENT_SETTINGS = {
                  "beluga-manager": {
                      "publicClient": True,
                      "directAccessGrantsEnabled": False,
                      "implicitFlowEnabled": False,
                      "serviceAccountsEnabled": False,
                      "standardFlowEnabled": True,
                      "webOrigins": ["https://{{ $managerHost }}"],
                  },
              }

              # D-SSO-3, D-SSO-4: Idempotently CREATE missing clients on already-bootstrapped clusters
              CLIENT_SPECS = {
                  "apisix-gateway": {
                      "clientId": "apisix-gateway",
                      "name": "APISIX Gateway OIDC",
                      "enabled": True,
                      "publicClient": False,
                      "protocol": "openid-connect",
                      "directAccessGrantsEnabled": False,
                      "standardFlowEnabled": True,
                      "redirectUris": CLIENT_REDIRECT_URIS.get("apisix-gateway", []),
                      "webOrigins": ["+"],
                      "defaultClientScopes": ["web-origins", "acr", "profile", "roles", "email", "groups"],
                  },
                  "argocd": {
                      "clientId": "argocd",
                      "name": "ArgoCD",
                      "enabled": True,
                      "publicClient": False,
                      "protocol": "openid-connect",
                      "directAccessGrantsEnabled": False,
                      "standardFlowEnabled": True,
                      "redirectUris": CLIENT_REDIRECT_URIS.get("argocd", []),
                      "webOrigins": ["+"],
                      "defaultClientScopes": ["web-origins", "acr", "profile", "roles", "email", "groups"],
                  },
                  # D-MSSO-6/7a (ADR-0009): Beluga Manager SPA 공개 클라이언트. 공유 'groups' 스코프(apisix-gateway용,
                  # full.path=false)는 일부러 뺀다 — 아래 6b 단계가 클라이언트 전용 groups(full.path=true)/audience
                  # 매퍼를 붙인다. defaultClientScopes를 명시하면 Keycloak은 realm 기본 스코프를 자동 추가하지 않는다.
                  "beluga-manager": {
                      "clientId": "beluga-manager",
                      "name": "Beluga Manager",
                      "enabled": True,
                      "protocol": "openid-connect",
                      **CLIENT_SETTINGS["beluga-manager"],
                      "attributes": CLIENT_ATTRIBUTES["beluga-manager"],
                      "redirectUris": CLIENT_REDIRECT_URIS.get("beluga-manager", []),
                      "defaultClientScopes": ["web-origins", "acr", "profile", "roles", "email"],
                  },
                  "lakekeeper": {
                      "clientId": "lakekeeper",
                      "name": "Lakekeeper Web UI",
                      "enabled": True,
                      "publicClient": True,
                      "protocol": "openid-connect",
                      "directAccessGrantsEnabled": False,
                      "standardFlowEnabled": True,
                      "attributes": {
                          "pkce.code.challenge.method": "S256"
                      },
                      "redirectUris": CLIENT_REDIRECT_URIS.get("lakekeeper", []),
                      "webOrigins": ["https://catalog.{{ .Values.baseDomain }}"],
                      "defaultClientScopes": ["web-origins", "acr", "profile", "roles", "email", "groups", "lakekeeper"],
                  },
              }

              for client_id_name, client_spec in CLIENT_SPECS.items():
                  if client_id_name not in client_map:
                      print(f"Client '{client_id_name}' not found in realm '{REALM}', creating idempotently...")
                      auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
                      try:
                          status, _ = make_req(clients_url, data=client_spec, headers=auth_headers, method="POST")
                          if status != 201:
                              print(f"Failed to create client '{client_id_name}', status: {status}")
                              sys.exit(1)
                          print(f"Client '{client_id_name}' created successfully.")
                      except Exception as e:
                          print(f"Error creating client '{client_id_name}': {e}")
                          sys.exit(1)

              # Re-fetch clients to ensure internal IDs are populated
              auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
              status, body = make_req(clients_url, headers=auth_headers)
              if status != 200:
                  print(f"Failed to re-fetch clients, status: {status}")
                  sys.exit(1)
              client_map = {c["clientId"]: c["id"] for c in json.loads(body)}

              missing = set(CLIENT_SECRETS.keys()) - set(client_map.keys())
              if missing:
                  print(f"Error: clients not found in realm after creation attempt: {missing}")
                  sys.exit(1)

              # 4. Reconcile each client secret (idempotent) and verify
              for client_id_name, target_secret in CLIENT_SECRETS.items():
                  internal_id = client_map[client_id_name]

                  # 토큰이 오래됐을 수 있으니 클라이언트마다 새로 받는다.
                  auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}

                  secret_url = f"{KC_BASE}/admin/realms/{REALM}/clients/{internal_id}/client-secret"
                  try:
                      status, body = make_req(secret_url, headers=auth_headers)
                      if status != 200:
                          print(f"Failed to fetch current secret for {client_id_name}, status: {status}")
                          sys.exit(1)
                      current_secret = json.loads(body).get("value", "")
                  except Exception as e:
                      print(f"Error fetching current secret for {client_id_name}: {e}")
                      sys.exit(1)

                  if current_secret == target_secret:
                      print(f"Client {client_id_name}: secret already up to date (prefix {current_secret[:6]}...), skipping.")
                      continue

                  print(f"Client {client_id_name}: secret mismatch (current prefix {current_secret[:6]}...), updating...")
                  update_url = f"{KC_BASE}/admin/realms/{REALM}/clients/{internal_id}"
                  try:
                      status, _ = make_req(update_url, data={"secret": target_secret}, headers=auth_headers, method="PUT")
                      if status != 204:
                          print(f"Failed to update secret for {client_id_name}, status: {status}")
                          sys.exit(1)
                  except Exception as e:
                      print(f"Error updating secret for {client_id_name}: {e}")
                      sys.exit(1)

                  # 반영 검증 — 실값은 절대 로그에 찍지 않고 앞 6자만 비교/출력한다.
                  try:
                      status, body = make_req(secret_url, headers=auth_headers)
                      if status != 200:
                          print(f"Failed to verify secret for {client_id_name}, status: {status}")
                          sys.exit(1)
                      verified_secret = json.loads(body).get("value", "")
                  except Exception as e:
                      print(f"Error verifying secret for {client_id_name}: {e}")
                      sys.exit(1)

                  if verified_secret != target_secret:
                      print(f"Secret verification failed for {client_id_name}: expected prefix {target_secret[:6]}..., got {verified_secret[:6]}...")
                      sys.exit(1)

                  print(f"Client {client_id_name}: secret verified (prefix {verified_secret[:6]}...).")

              # 5. Task 16(D-E 2/2): redirectUris도 같은 이유(realm import 1회성)로 여기서
              #    교정한다 — keycloak.yaml의 ConfigMap을 고쳐도 이미 임포트된 realm의
              #    클라이언트에는 반영되지 않는다(실측: 배포 후에도 구 HTTP URI만 남아 있었다).
              #    이슈 #2: superset/airflow/openmetadata/grafana도 trino와 동일하게
              #    https로 교정한다(게이트웨이 전역 HTTP→HTTPS 301 전환에 맞춤).
              for client_id_name, target_uris in CLIENT_REDIRECT_URIS.items():
                  internal_id = client_map[client_id_name]
                  auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}

                  client_url = f"{KC_BASE}/admin/realms/{REALM}/clients/{internal_id}"
                  try:
                      status, body = make_req(client_url, headers=auth_headers)
                      if status != 200:
                          print(f"Failed to fetch client {client_id_name}, status: {status}")
                          sys.exit(1)
                      current_uris = json.loads(body).get("redirectUris", [])
                  except Exception as e:
                      print(f"Error fetching client {client_id_name}: {e}")
                      sys.exit(1)

                  if sorted(current_uris) == sorted(target_uris):
                      print(f"Client {client_id_name}: redirectUris already up to date, skipping.")
                      continue

                  print(f"Client {client_id_name}: redirectUris mismatch (current: {current_uris}), updating...")
                  try:
                      status, _ = make_req(client_url, data={"redirectUris": target_uris}, headers=auth_headers, method="PUT")
                      if status != 204:
                          print(f"Failed to update redirectUris for {client_id_name}, status: {status}")
                          sys.exit(1)
                  except Exception as e:
                      print(f"Error updating redirectUris for {client_id_name}: {e}")
                      sys.exit(1)
                  print(f"Client {client_id_name}: redirectUris updated to {target_uris}.")

              # 5b. 실측 결함(Flink 서명 토큰 만료): Flink의 Iceberg 1.7.1 S3 서명 클라이언트
              #    (S3V4RestSignerClient)는 자기 OAuth 토큰(client_credentials, expires_in=300,
              #    refresh_token 없음)을 갱신할 때 RFC 8693 토큰 교환을 시도한다. Keycloak이
              #    flink 클라이언트에 대해 "Standard token exchange is not enabled for the
              #    requested client"(HTTP 400)로 거부하면 5분 뒤부터 만료된 JWT를 계속 보내
              #    Lakekeeper의 /signer/.../s3/sign만 401(ExpiredSignature)이 된다 — 카탈로그
              #    호출은 별도 토큰이라 성공해 가려지고, Flink 잡이 재시작을 반복하며 Pending
              #    TaskManager가 쌓인다(실측: 3시간 466건). realm import는 1회성이라 이미
              #    부트스트랩된 realm에는 속성이 안 실리므로 여기서 교정한다. PUT에는 대상 키만
              #    실어 보낸다(Keycloak은 전달된 attributes 키만 갱신 — 다른 속성 보존). 탈출구: Iceberg >=1.10 +
              #    'token-exchange-enabled'='false' 로 갱신을 client_credentials 재발급으로 전환.
              # (선언은 위 CLIENT_ATTRIBUTES — 생성 본문과 공유)
              for client_id_name, target_attrs in CLIENT_ATTRIBUTES.items():
                  internal_id = client_map[client_id_name]
                  auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}

                  client_url = f"{KC_BASE}/admin/realms/{REALM}/clients/{internal_id}"
                  try:
                      status, body = make_req(client_url, headers=auth_headers)
                      if status != 200:
                          print(f"Failed to fetch client {client_id_name}, status: {status}")
                          sys.exit(1)
                      current_attrs = json.loads(body).get("attributes", {}) or {}
                  except Exception as e:
                      print(f"Error fetching client {client_id_name}: {e}")
                      sys.exit(1)

                  if all(current_attrs.get(k) == v for k, v in target_attrs.items()):
                      print(f"Client {client_id_name}: attributes already up to date, skipping.")
                      continue

                  print(f"Client {client_id_name}: attributes mismatch, updating {sorted(target_attrs)}...")
                  try:
                      status, _ = make_req(client_url, data={"attributes": target_attrs}, headers=auth_headers, method="PUT")
                      if status != 204:
                          print(f"Failed to update attributes for {client_id_name}, status: {status}")
                          sys.exit(1)
                  except Exception as e:
                      print(f"Error updating attributes for {client_id_name}: {e}")
                      sys.exit(1)
                  print(f"Client {client_id_name}: attributes updated {sorted(target_attrs)}.")

              # 5c. CLIENT_SETTINGS 교정: 현재 값이 다르면 대상 키만 PUT(Keycloak은 보낸 필드만 갱신).
              for client_id_name, target_settings in CLIENT_SETTINGS.items():
                  internal_id = client_map[client_id_name]
                  auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
                  client_url = f"{KC_BASE}/admin/realms/{REALM}/clients/{internal_id}"
                  try:
                      status, body = make_req(client_url, headers=auth_headers)
                      if status != 200:
                          print(f"Failed to fetch client {client_id_name}, status: {status}")
                          sys.exit(1)
                      current = json.loads(body)
                  except Exception as e:
                      print(f"Error fetching client {client_id_name}: {e}")
                      sys.exit(1)
                  drift = {k: v for k, v in target_settings.items() if current.get(k) != v}
                  if not drift:
                      print(f"Client {client_id_name}: settings already up to date, skipping.")
                      continue
                  print(f"Client {client_id_name}: settings drift in {sorted(drift)}, updating...")
                  try:
                      status, _ = make_req(client_url, data=drift, headers=auth_headers, method="PUT")
                      if status != 204:
                          print(f"Failed to update settings for {client_id_name}, status: {status}")
                          sys.exit(1)
                  except Exception as e:
                      print(f"Error updating settings for {client_id_name}: {e}")
                      sys.exit(1)
                  print(f"Client {client_id_name}: settings updated {sorted(drift)}.")

              # 6. Task 16(D-E 2/2) 실측 결함: realm import는 keycloak.yaml의 clientScopes
              #    배열에 새로 추가한 "profile" 스코프(preferred_username 매퍼)를 최초 1회만
              #    반영한다 — 이미 부트스트랩된 realm에는 realm 레벨 client-scope 자체가
              #    없고, trino 클라이언트의 default-client-scopes에도 붙어 있지 않다. 이게
              #    없으면 발급 토큰에 preferred_username 클레임이 아예 실리지 않아
              #    Trino의 oauth2.principal-field=preferred_username이 매 요청을
              #    "Invalid credentials"로 거부한다(실측). 당시엔 trino 클라이언트에만
              #    재조정하고 "다른 클라이언트도 같은 갭이 있을 수 있으나 범위 밖으로
              #    남겨 둔다"고 적어 뒀다.
              #
              # D-L(이슈 #111 실배포 실측): 그 갭이 실제로 있었다 — keycloak.yaml의
              # clientScopes 배열은 groups/roles/profile 3개만 커스텀 정의해서, Keycloak이
              # 신규 realm에 스스로 만드는 내장 스코프(email/web-origins/acr)는 beluga
              # realm에 아예 존재하지 않았다. 5개 클라이언트 전부 defaultClientScopes로
              # [web-origins, acr, profile, roles, email, groups]를 요청하는데 email/
              # web-origins/acr이 없으니 로그인 시 Keycloak이 invalid_scope로 거부해
              # Superset/Airflow SSO가 전부 깨져 있었다.
              #
              # email/web-origins/acr의 protocolMapper 정의를 손으로 추측해 박지 않는다 —
              # 스크래치 realm을 하나 만들어(POST /admin/realms, clientScopes 오버라이드 없이)
              # 이 클러스터에 실제로 떠 있는 Keycloak 26.7.1이 자기 자신의 기본값으로 만든
              # client-scope JSON을 그대로 GET해 온 뒤 beluga realm에 이식하고, 스크래치
              # realm은 성공/실패 관계없이 finally로 삭제한다(Job이 크래시해도 다음 실행
              # 시작 시 동일 이름의 잔존 realm부터 정리 — 멱등·재실행 가능, D1).
              REQUIRED_SCOPES = ["web-origins", "acr", "profile", "roles", "email", "groups"]
              TARGET_CLIENTS_FOR_SCOPES = ["superset", "airflow", "openmetadata", "grafana", "trino", "apisix-gateway", "argocd", "lakekeeper"]
              SCRATCH_REALM = "beluga-scope-source-tmp"

              def strip_ids(obj):
                  """스크래치 realm에서 떠온 객체의 서버 생성 id를 재귀적으로 제거 —
                  다른 realm에 그대로 POST하면 남의 realm의 id를 그대로 쓰려다 충돌/무시된다."""
                  if isinstance(obj, dict):
                      return {k: strip_ids(v) for k, v in obj.items() if k != "id"}
                  if isinstance(obj, list):
                      return [strip_ids(v) for v in obj]
                  return obj

              def delete_scratch_realm_best_effort():
                  """make_req는 비2xx에서 예외를 던지므로, realm이 이미 없는(404) 정상적인
                  경우까지 크래시로 이어지지 않게 정리 전용으로 예외를 흡수한다."""
                  try:
                      make_req(
                          f"{KC_BASE}/admin/realms/{SCRATCH_REALM}",
                          headers={"Authorization": f"Bearer {get_admin_token()}"},
                          method="DELETE",
                      )
                  except Exception as e:
                      print(f"(scratch realm cleanup: {e} — ignored, best-effort)")

              print("Reconciling realm client scopes (web-origins/acr/profile/roles/email/groups)...")
              auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
              scopes_url = f"{KC_BASE}/admin/realms/{REALM}/client-scopes"
              try:
                  status, body = make_req(scopes_url, headers=auth_headers)
                  if status != 200:
                      print(f"Failed to list client scopes, status: {status}")
                      sys.exit(1)
                  existing_scopes = {s["name"]: s for s in json.loads(body)}
              except Exception as e:
                  print(f"Error listing client scopes: {e}")
                  sys.exit(1)

              missing_names = [n for n in REQUIRED_SCOPES if n not in existing_scopes]

              if missing_names:
                  print(f"Missing client scopes in '{REALM}': {missing_names} — sourcing real defaults from a scratch realm...")

                  # 이전 실행이 정리 없이 죽었을 수 있으니 먼저 잔존 스크래치 realm부터 치운다.
                  delete_scratch_realm_best_effort()

                  try:
                      auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
                      realms_url = f"{KC_BASE}/admin/realms"
                      status, _ = make_req(
                          realms_url,
                          data={"realm": SCRATCH_REALM, "enabled": True},
                          headers=auth_headers,
                          method="POST",
                      )
                      if status != 201:
                          print(f"Failed to create scratch realm, status: {status}")
                          sys.exit(1)

                      auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
                      scratch_scopes_url = f"{KC_BASE}/admin/realms/{SCRATCH_REALM}/client-scopes"
                      status, body = make_req(scratch_scopes_url, headers=auth_headers)
                      if status != 200:
                          print(f"Failed to list scratch realm client scopes, status: {status}")
                          sys.exit(1)
                      scratch_scopes = {s["name"]: s for s in json.loads(body)}

                      for scope_name in missing_names:
                          source = scratch_scopes.get(scope_name)
                          if source is None:
                              print(f"Scratch realm did not produce a default scope named '{scope_name}' — cannot source it safely.")
                              sys.exit(1)
                          print(f"Creating client scope '{scope_name}' in '{REALM}' from live Keycloak default...")
                          auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
                          status, _ = make_req(scopes_url, data=strip_ids(source), headers=auth_headers, method="POST")
                          if status != 201:
                              print(f"Failed to create client scope '{scope_name}', status: {status}")
                              sys.exit(1)
                  finally:
                      delete_scratch_realm_best_effort()

                  auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
                  status, body = make_req(scopes_url, headers=auth_headers)
                  existing_scopes = {s["name"]: s for s in json.loads(body)}
                  print(f"Client scopes now present: {sorted(existing_scopes.keys())}")
              else:
                  print("All required client scopes already exist — nothing to source.")

              scope_ids = {name: existing_scopes[name]["id"] for name in REQUIRED_SCOPES}

              for client_id_name in TARGET_CLIENTS_FOR_SCOPES:
                  internal_id = client_map[client_id_name]
                  auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
                  current_url = f"{KC_BASE}/admin/realms/{REALM}/clients/{internal_id}/default-client-scopes"
                  try:
                      status, body = make_req(current_url, headers=auth_headers)
                      if status != 200:
                          print(f"Failed to fetch default-client-scopes for {client_id_name}, status: {status}")
                          sys.exit(1)
                      current_names = {s["name"] for s in json.loads(body)}
                  except Exception as e:
                      print(f"Error fetching default-client-scopes for {client_id_name}: {e}")
                      sys.exit(1)

                  for scope_name in REQUIRED_SCOPES:
                      if scope_name in current_names:
                          continue
                      print(f"Client {client_id_name}: assigning missing default scope '{scope_name}'...")
                      auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
                      assign_url = f"{KC_BASE}/admin/realms/{REALM}/clients/{internal_id}/default-client-scopes/{scope_ids[scope_name]}"
                      try:
                          status, _ = make_req(assign_url, data="", headers=auth_headers, method="PUT")
                          if status not in (204, 201):
                              print(f"Failed to assign '{scope_name}' scope to {client_id_name}, status: {status}")
                              sys.exit(1)
                      except Exception as e:
                          print(f"Error assigning '{scope_name}' scope to {client_id_name}: {e}")
                          sys.exit(1)
                  print(f"Client {client_id_name}: default-client-scopes reconciled to {REQUIRED_SCOPES}.")
                  if client_id_name == "lakekeeper" and "lakekeeper" in existing_scopes and "lakekeeper" not in current_names:
                      print("Client lakekeeper: assigning missing default scope 'lakekeeper'...")
                      auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
                      assign_url = f"{KC_BASE}/admin/realms/{REALM}/clients/{internal_id}/default-client-scopes/{existing_scopes['lakekeeper']['id']}"
                      try:
                          status, _ = make_req(assign_url, data="", headers=auth_headers, method="PUT")
                          if status not in (204, 201):
                              print(f"Failed to assign 'lakekeeper' scope to lakekeeper, status: {status}")
                              sys.exit(1)
                      except Exception as e:
                          print(f"Error assigning 'lakekeeper' scope to lakekeeper: {e}")
                          sys.exit(1)

              # 6b. D-MSSO-7a (ADR-0009, 롤아웃 ②b): beluga-manager 전용 프로토콜 매퍼와 스코프 가드.
              #     - sub: 이 realm에는 Keycloak 25+의 basic 스코프가 없어 access token에 sub가 없다(domain-api는 sub 필수).
              #     - groups: full.path=true라 최상위 그룹이 '/admins'로 실린다(domain-api가 정규화). access token만.
              #     - audience: aud에 beluga-manager를 넣는다(OIDC_AUDIENCE 검증). access token만.
              #     realm import는 1회성이라 이미 부트스트랩된 realm에는 여기서 멱등으로 반영한다. 이름이 같은 매퍼가 있고
              #     config가 다르면 PUT으로 교정한다. 공유 'groups' 스코프가 실수로 붙어 있으면 떼어낸다(full.path=false인
              #     그 스코프의 매퍼가 클라이언트 매퍼와 같은 클레임 이름을 덮어써 '/admins'가 'admins'로 바뀌는 것을 막는다).
              MANAGER_MAPPERS = [
                  {
                      "name": "manager sub",
                      "protocol": "openid-connect",
                      "protocolMapper": "oidc-sub-mapper",
                      "consentRequired": False,
                      "config": {
                          "access.token.claim": "true",
                          "introspection.token.claim": "true",
                      },
                  },
                  {
                      "name": "manager groups",
                      "protocol": "openid-connect",
                      "protocolMapper": "oidc-group-membership-mapper",
                      "consentRequired": False,
                      "config": {
                          "full.path": "true",
                          "id.token.claim": "false",
                          "access.token.claim": "true",
                          "claim.name": "groups",
                          "userinfo.token.claim": "false",
                      },
                  },
                  {
                      "name": "manager audience",
                      "protocol": "openid-connect",
                      "protocolMapper": "oidc-audience-mapper",
                      "consentRequired": False,
                      "config": {
                          "included.client.audience": "beluga-manager",
                          "id.token.claim": "false",
                          "access.token.claim": "true",
                      },
                  },
              ]
              manager_id = client_map["beluga-manager"]
              mappers_url = f"{KC_BASE}/admin/realms/{REALM}/clients/{manager_id}/protocol-mappers/models"
              auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
              try:
                  status, body = make_req(mappers_url, headers=auth_headers)
                  if status != 200:
                      print(f"Failed to list protocol mappers for beluga-manager, status: {status}")
                      sys.exit(1)
                  current_mappers = {m["name"]: m for m in json.loads(body)}
              except Exception as e:
                  print(f"Error listing protocol mappers for beluga-manager: {e}")
                  sys.exit(1)

              for target in MANAGER_MAPPERS:
                  auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
                  existing = current_mappers.get(target["name"])
                  try:
                      if existing is None:
                          print(f"Client beluga-manager: creating protocol mapper '{target['name']}'...")
                          status, _ = make_req(mappers_url, data=target, headers=auth_headers, method="POST")
                          if status != 201:
                              print(f"Failed to create protocol mapper '{target['name']}', status: {status}")
                              sys.exit(1)
                      elif existing.get("protocolMapper") != target["protocolMapper"] or any(
                          (existing.get("config") or {}).get(k) != v for k, v in target["config"].items()
                      ):
                          print(f"Client beluga-manager: protocol mapper '{target['name']}' differs, updating...")
                          merged = dict(existing)
                          merged["protocolMapper"] = target["protocolMapper"]
                          merged["config"] = dict(existing.get("config") or {})
                          merged["config"].update(target["config"])
                          status, _ = make_req(f"{mappers_url}/{existing['id']}", data=merged, headers=auth_headers, method="PUT")
                          if status != 204:
                              print(f"Failed to update protocol mapper '{target['name']}', status: {status}")
                              sys.exit(1)
                      else:
                          print(f"Client beluga-manager: protocol mapper '{target['name']}' already up to date, skipping.")
                  except Exception as e:
                      print(f"Error reconciling protocol mapper '{target['name']}': {e}")
                      sys.exit(1)

              auth_headers = {"Authorization": f"Bearer {get_admin_token()}"}
              scopes_of_manager_url = f"{KC_BASE}/admin/realms/{REALM}/clients/{manager_id}/default-client-scopes"
              try:
                  status, body = make_req(scopes_of_manager_url, headers=auth_headers)
                  if status != 200:
                      print(f"Failed to fetch default-client-scopes for beluga-manager, status: {status}")
                      sys.exit(1)
                  manager_scopes = {s["name"]: s["id"] for s in json.loads(body)}
                  if "groups" in manager_scopes:
                      print("Client beluga-manager: removing shared default scope 'groups'...")
                      status, _ = make_req(
                          f"{scopes_of_manager_url}/{manager_scopes['groups']}",
                          headers={"Authorization": f"Bearer {get_admin_token()}"},
                          method="DELETE",
                      )
                      if status != 204:
                          print(f"Failed to remove 'groups' scope from beluga-manager, status: {status}")
                          sys.exit(1)
              except Exception as e:
                  print(f"Error reconciling default-client-scopes for beluga-manager: {e}")
                  sys.exit(1)
              print("Client beluga-manager: mappers and scopes reconciled.")

              print("Keycloak client reconciliation completed successfully.")
