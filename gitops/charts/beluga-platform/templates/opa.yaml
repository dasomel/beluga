# D14: Centralized OPA (Open Policy Agent) Server for Trino & Kafka Authorization
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-config
  namespace: beluga-system
data:
  config.yaml: |
    decision_logs:
      console: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policies
  namespace: beluga-system
data:
  trino.rego: |
    package trino

    import rego.v1

    # =============================================================================
    # §10 권한 매트릭스 (Authorization Matrix) - Trino Authz Policy
    # =============================================================================
    # 주체(Identity)        | Trino (쿼리 Engine)
    # ---------------------+-------------------------------------------------------
    # admin                | 전체 허용 (§10 admin 전체)
    # engineer             | lake 읽기/쓰기 허용 (system 카탈로그 쓰기/변경 거부)
    # analyst              | 읽기 전용 (customers PII 테이블 거부, 쓰기 계열 전부 거부)
    # no-group (익명/서비스) | 기본 allow, customers PII 테이블 거부 (§10 OIDC 미연동 보호)
    # =============================================================================

    default allow = true

    allow = false if {
        deny
    }

    # -----------------------------------------------------------------------------
    # Deny Rules (§10 매트릭스 집행)
    # -----------------------------------------------------------------------------

    # [§10 analyst PII 차단] analyst 그룹의 customers 테이블 접근 거부
    deny if {
        is_analyst
        is_customers_table
    }

    # [§10 analyst 읽기 전용] analyst 그룹의 쓰기/변경성 작업 거부
    deny if {
        is_analyst
        is_write_operation
    }

    # [§10 engineer 시스템 카탈로그 변경 거부] engineer 그룹의 system 카탈로그 쓰기/변경 작업 거부
    deny if {
        is_engineer
        is_system_catalog
        is_write_operation
    }

    # [§10 OIDC 미연동/익명 경로 보호] 그룹 없는 요청의 customers PII 테이블 접근 거부
    deny if {
        not has_known_group
        is_customers_table
    }

    # -----------------------------------------------------------------------------
    # Identity Helpers
    # -----------------------------------------------------------------------------

    is_admin if {
        input.context.identity.groups[_] == "admin"
    }
    is_admin if {
        input.context.identity.user == "admin"
    }

    is_engineer if {
        input.context.identity.groups[_] == "engineer"
    }
    is_engineer if {
        input.context.identity.user == "engineer"
    }

    is_analyst if {
        input.context.identity.groups[_] == "analyst"
    }
    is_analyst if {
        input.context.identity.user == "analyst"
    }

    has_known_group if {
        is_admin
    }
    has_known_group if {
        is_engineer
    }
    has_known_group if {
        is_analyst
    }

    # -----------------------------------------------------------------------------
    # Resource & Operation Helpers
    # -----------------------------------------------------------------------------

    is_customers_table if {
        input.action.resource.table.tableName == "customers"
    }
    is_customers_table if {
        input.action.resource.column.tableName == "customers"
    }

    is_system_catalog if {
        input.action.resource.table.catalogName == "system"
    }
    is_system_catalog if {
        input.action.resource.catalog.name == "system"
    }
    is_system_catalog if {
        input.action.resource.schema.catalogName == "system"
    }
    is_system_catalog if {
        input.action.resource.column.catalogName == "system"
    }

    write_operations := [
        "InsertIntoTable",
        "CreateTable",
        "DropTable",
        "RenameTable",
        "AlterTable",
        "CreateSchema",
        "DropSchema",
        "RenameSchema",
        "CreateView",
        "DropView",
        "RenameView",
        "DeleteFromTable",
        "TruncateTable",
        "AddColumn",
        "DropColumn",
        "RenameColumn",
        "SetTableProperties",
        "ExecuteProcedure"
    ]

    is_write_operation if {
        input.action.operation == write_operations[_]
    }
  kafka.rego: |
    package kafka.authz

    import rego.v1

    # =============================================================================
    # §10 권한 매트릭스 (Authorization Matrix) - Kafka Authz Policy
    # =============================================================================
    # 주체(Identity)        | Kafka (스트리밍 Platform)
    # ---------------------+-------------------------------------------------------
    # admin                | 전체 허용 (§10 admin 전체)
    # engineer             | 토픽 읽기/쓰기 허용 (§10 engineer Read/Write)
    # analyst              | 토픽 읽기만 허용 (§10 analyst Read만, Write/Delete/Alter 거부)
    # =============================================================================

    default allow = true

    allow = false if {
        deny
    }

    # -----------------------------------------------------------------------------
    # Deny Rules (§10 매트릭스 집행)
    # -----------------------------------------------------------------------------

    # [§10 analyst Write/Delete/Alter 거부] analyst 그룹/프린시펄의 토픽 쓰기 및 변경 작업 거부
    deny if {
        is_analyst
        is_restricted_kafka_operation
    }

    # -----------------------------------------------------------------------------
    # Identity Helpers (principal.name 규칙 및 groups 클레임 둘 다 지원)
    # -----------------------------------------------------------------------------

    is_admin if {
        input.requestContext.principal.name == "User:admin"
    }
    is_admin if {
        input.requestContext.principal.name == "User:beluga-admin"
    }
    is_admin if {
        input.requestContext.principal.name == "admin"
    }
    is_admin if {
        input.requestContext.principal.groups[_] == "admin"
    }
    is_admin if {
        input.requestContext.groups[_] == "admin"
    }

    is_engineer if {
        input.requestContext.principal.name == "User:engineer"
    }
    is_engineer if {
        input.requestContext.principal.name == "User:beluga-engineer"
    }
    is_engineer if {
        input.requestContext.principal.name == "engineer"
    }
    is_engineer if {
        input.requestContext.principal.groups[_] == "engineer"
    }
    is_engineer if {
        input.requestContext.groups[_] == "engineer"
    }

    is_analyst if {
        input.requestContext.principal.name == "User:analyst"
    }
    is_analyst if {
        input.requestContext.principal.name == "User:beluga-analyst"
    }
    is_analyst if {
        input.requestContext.principal.name == "analyst"
    }
    is_analyst if {
        input.requestContext.principal.groups[_] == "analyst"
    }
    is_analyst if {
        input.requestContext.groups[_] == "analyst"
    }

    # -----------------------------------------------------------------------------
    # Operation Helpers
    # -----------------------------------------------------------------------------

    restricted_kafka_operations := [
        "Write",
        "Delete",
        "Alter",
        "AlterConfigs",
        "ClusterAction",
        "Create"
    ]

    is_restricted_kafka_operation if {
        input.action.operation == restricted_kafka_operations[_]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: beluga-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      containers:
        - name: opa
          # -static 변형만 arm64 멀티아치 (일반 태그는 amd64 전용 — 2026-08-10 manifest 확인)
          image: openpolicyagent/opa:1.19.0-static
          args:
            - "run"
            - "--server"
            # 기본 바인딩은 localhost — Service/프로브가 접근 불가라 0.0.0.0 명시 (E2E 실측)
            - "--addr=0.0.0.0:8181"
            - "--config-file=/etc/opa/config/config.yaml"
            # 디렉터리 로드 금지 — ConfigMap 마운트의 ..data 심링크까지 재귀 로드되어
            # 같은 rego가 3중 로드("multiple default rules")로 기동 실패 (E2E에서 실측)
            - "/etc/opa/policies/trino.rego"
            - "/etc/opa/policies/kafka.rego"
          ports:
            - containerPort: 8181
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/opa/config
            - name: policies
              mountPath: /etc/opa/policies
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              # OPA 헬스 엔드포인트는 /health — /v1/health는 404라 프로브가 파드를 죽임 (E2E 실측)
              path: /health
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: opa-config
        - name: policies
          configMap:
            name: opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: beluga-system
spec:
  type: ClusterIP
  selector:
    app: opa
  ports:
    - name: http
      port: 8181
      targetPort: 8181
