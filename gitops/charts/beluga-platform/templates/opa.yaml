# D14: Centralized OPA (Open Policy Agent) Server for Trino & Kafka Authorization
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-config
  namespace: iam
data:
  config.yaml: |
    decision_logs:
      console: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policies
  namespace: iam
data:
  trino.rego: |
{{ .Files.Get "files/opa/trino.rego" | indent 4 }}
  kafka.rego: |
{{ .Files.Get "files/opa/kafka.rego" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: iam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
      annotations:
        # 정책/설정 ConfigMap 변경 시 파드 자동 롤 — opa run은 핫리로드하지 않아
        # ConfigMap만 갱신하면 구정책이 계속 집행됨 (실측)
        checksum/policies: {{ print (.Files.Get "files/opa/trino.rego") (.Files.Get "files/opa/kafka.rego") | sha256sum | trunc 16 }}
    spec:
      containers:
        - name: opa
          # -static 변형만 arm64 멀티아치 (일반 태그는 amd64 전용 — 2026-08-10 manifest 확인)
          image: openpolicyagent/opa:1.19.0-static
          args:
            - "run"
            - "--server"
            # 기본 바인딩은 localhost — Service/프로브가 접근 불가라 0.0.0.0 명시 (E2E 실측)
            - "--addr=0.0.0.0:8181"
            - "--config-file=/etc/opa/config/config.yaml"
            # 디렉터리 로드 금지 — ConfigMap 마운트의 ..data 심링크까지 재귀 로드되어
            # 같은 rego가 3중 로드("multiple default rules")로 기동 실패 (E2E에서 실측)
            - "/etc/opa/policies/trino.rego"
            - "/etc/opa/policies/kafka.rego"
          ports:
            - containerPort: 8181
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/opa/config
            - name: policies
              mountPath: /etc/opa/policies
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              # OPA 헬스 엔드포인트는 /health — /v1/health는 404라 프로브가 파드를 죽임 (E2E 실측)
              path: /health
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: opa-config
        - name: policies
          configMap:
            name: opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: iam
spec:
  type: ClusterIP
  selector:
    app: opa
  ports:
    - name: http
      port: 8181
      targetPort: 8181
