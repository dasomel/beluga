# D14: Centralized OPA (Open Policy Agent) Server for Trino & Kafka Authorization
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-config
  namespace: beluga-system
data:
  config.yaml: |
    decision_logs:
      console: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policies
  namespace: beluga-system
data:
  trino.rego: |
    package trino

    import rego.v1

    # 정책 자세(의도된 기본 allow): 데모 플랫폼 — OIDC 아이덴티티 와이어링 전까지
    # 기본 거부로 두면 전 쿼리가 차단된다. 타깃 거부(analyst→lake.customers)만 적용.
    # OIDC 연동 후 민감 스키마는 기본 거부로 조일 것. OPA 서버 다운 시 Trino 플러그인은
    # fail-closed(전체 거부)로 동작하므로 인프라 레벨 fail-open은 아님.
    default allow = true

    # Block analyst group from accessing customers table in lake catalog
    allow = false if {
        deny
    }

    deny if {
        is_analyst
        is_lake_customers
    }

    is_analyst if {
        input.context.identity.groups[_] == "analyst"
    }

    is_analyst if {
        input.context.identity.user == "analyst"
    }

    # customers 테이블만 차단 — 카탈로그/스키마 전체 차단 규칙은 데모 시나리오
    # (analyst가 events는 조회 가능해야 함)를 깨므로 두지 않는다
    is_lake_customers if {
        input.action.resource.table.catalogName == "lake"
        input.action.resource.table.tableName == "customers"
    }
  kafka.rego: |
    package kafka.authz

    import rego.v1

    default allow = true

    # Block analyst group/principal from writing to Kafka topics
    allow = false if {
        deny
    }

    deny if {
        is_analyst
        is_topic_write
    }

    is_analyst if {
        input.requestContext.principal.name == "User:analyst"
    }

    is_analyst if {
        input.requestContext.principal.name == "analyst"
    }

    is_analyst if {
        input.requestContext.principal.groups[_] == "analyst"
    }

    is_topic_write if {
        input.action.resourcePattern.resourceType == "Topic"
        input.action.operation == "Write"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: beluga-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      containers:
        - name: opa
          # -static 변형만 arm64 멀티아치 (1.1.0 일반 태그는 amd64 전용 — 2026-08-10 manifest 확인)
          image: openpolicyagent/opa:1.1.0-static
          args:
            - "run"
            - "--server"
            - "--config-file=/etc/opa/config/config.yaml"
            - "/etc/opa/policies"
          ports:
            - containerPort: 8181
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/opa/config
            - name: policies
              mountPath: /etc/opa/policies
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8181
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: opa-config
        - name: policies
          configMap:
            name: opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: beluga-system
spec:
  type: ClusterIP
  selector:
    app: opa
  ports:
    - name: http
      port: 8181
      targetPort: 8181
