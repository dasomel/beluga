# D14: OpenFGA Server (Fine-Grained Authorization for Lakekeeper)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
  namespace: iam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openfga
  template:
    metadata:
      labels:
        app: openfga
    spec:
      containers:
        - name: openfga
          image: openfga/openfga:v1.18.3
          args:
            - "run"
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: "memory"
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: grpc
            - containerPort: 3000
              name: playground
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: openfga
  namespace: iam
spec:
  type: ClusterIP
  selector:
    app: openfga
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 8081
      targetPort: 8081
    - name: playground
      port: 3000
      targetPort: 3000
