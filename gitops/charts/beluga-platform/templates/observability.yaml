{{- if .Values.observability.enabled }}
{{- $vm := .Values.observability.victoriaMetrics }}
{{- $gf := .Values.observability.grafana }}
{{- $realm := "beluga" }}
{{- if and .Values.sso .Values.sso.realm }}
  {{- $realm = .Values.sso.realm }}
{{- end }}
{{- $ctx := dict "Values" .Values "realm" $realm }}
# 이슈 #366: 관측성 스택 — VictoriaMetrics single-node(메트릭) + Grafana(대시보드, Keycloak SSO).
#
# D-OBS-1 (소유 차트/네임스페이스): beluga-platform / platform-system. 이유: (a) 게이트웨이(APISIX),
#   Keycloak 클라이언트(grafana), 기존 Grafana Service 껍데기(grafana-external)가 모두 이 차트·
#   네임스페이스 소유이고, (b) 내부 CA ConfigMap(beluga-internal-ca)이 이미 platform-system에 배포되며,
#   (c) 새 네임스페이스는 내부 CA 배포 Role·PSA 베이스라인·NetworkPolicy 래칫을 추가로 건드려야 한다.
#   비용: platform-system은 default-deny가 없는 래칫 베이스라인 네임스페이스라 파드 단위 NetworkPolicy로
#   격리한다. 탈출구: 전용 네임스페이스로 옮길 때는 internal-ca-distribution 대상과 PSA 목록을 함께 바꾼다.
# D-OBS-2 (기존 grafana-external 정리): NodePort 30000 껍데기(T-014 부채)를 삭제하고 ClusterIP `grafana`
#   Service 하나로 대체한다 — 게이트웨이 외 직접 노출 경로가 사라진다. 이전 selector(app.kubernetes.io/name=grafana)는
#   아래 파드 라벨이 그대로 충족한다.
# D-OBS-3 (스크레이프): vmagent 없이 VictoriaMetrics 내장 -promscrape.config(static_configs, 서비스 FQDN)를 쓴다.
#   Kubernetes SD(파드/엔드포인트 list)는 RBAC가 필요해 쓰지 않는다 — 비용: 서비스로 노출되지 않은 메트릭
#   포트(CNPG 9187, APISIX/Keycloak/OpenFGA 등)는 대상에서 제외. 아래 대상은 2026-11-09 라이브 클러스터에서
#   각 URL의 HTTP 200과 Prometheus 본문을 실측한 것만 넣었다(미검증 대상 추정 금지).
# D-OBS-4 (Grafana 라이선스): AGPL-3.0 — policies/license-policy.yaml license_change_reviews 참고. 업스트림
#   이미지를 digest로 고정해 수정 없이 쓴다(커스텀 이미지 빌드/소스 패치 금지). 설정·프로비저닝은 코드 수정이 아니다.
# D-OBS-5 (Grafana 인증): 로그인 폼과 초기 admin 계정을 끄고 Keycloak(grafana 클라이언트)만 쓴다.
#   역할은 그룹에서 매핑(admins=Admin, engineers=Editor, analysts=Viewer)하며, 어느 그룹에도 없으면
#   role_attribute_strict로 거부한다. 비용: Keycloak 장애 시 Grafana 로그인 불가(break-glass 없음);
#   탈출구: GF_AUTH_DISABLE_LOGIN_FORM 해제 + GF_SECURITY_ADMIN_PASSWORD 시크릿 추가.
# D-OBS-7 (Grafana 상태): SQLite(사용자 저장 대시보드/폴더)는 1Gi local-path PVC grafana-data에 둔다(fsGroup 472, 읽기 전용 루트와 양립).
# D-OBS-6 (대시보드): 핀 고정된 호환 라이선스 출처가 없어 프로비저닝 대시보드는 없다(데이터소스만).
# 의존: Secret keycloak-client-secrets/grafana(platform-system)는 01-argocd-bootstrap.sh가 생성한다.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-metrics-scrape
  namespace: platform-system
data:
  scrape.yml: |
{{ tpl (.Files.Get "files/observability/scrape.yml") . | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-metrics
  namespace: platform-system
spec:
  replicas: 1
  serviceName: victoria-metrics
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
        app.kubernetes.io/name: victoria-metrics
      annotations:
        # -promscrape.config는 SIGHUP/주기 재읽기가 아니라 기동 시 로드로 취급한다 — ConfigMap이 바뀌면 파드를 롤한다.
        checksum/scrape: {{ tpl (.Files.Get "files/observability/scrape.yml") . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoria-metrics
          image: {{ $vm.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "-storageDataPath=/victoria-metrics-data"
            - "-retentionPeriod={{ $vm.retention }}"
            - "-httpListenAddr=:{{ $vm.port }}"
            - "-promscrape.config=/etc/victoria-metrics/scrape.yml"
            - "-memory.allowedPercent=60"
            - "-selfScrapeInterval=0"
          ports:
            - containerPort: {{ $vm.port }}
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $vm.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $vm.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /victoria-metrics-data
            - name: scrape
              mountPath: /etc/victoria-metrics
              readOnly: true
      volumes:
        - name: scrape
          configMap:
            name: victoria-metrics-scrape
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: {{ $vm.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: platform-system
spec:
  type: ClusterIP
  selector:
    app: victoria-metrics
  ports:
    - name: http
      port: {{ $vm.port }}
      targetPort: {{ $vm.port }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: platform-system
data:
  datasource.yaml: |
{{ tpl (.Files.Get "files/observability/datasource.yaml") . | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: platform-system
data:
  grafana.ini: |
{{ tpl (.Files.Get "files/observability/grafana.ini") $ctx | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: platform-system
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: {{ $gf.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: platform-system
spec:
  replicas: 1
  # SQLite 상태가 RWO PVC(grafana-data)라 동시에 두 파드가 필요 없다 — 롤링 대신 교체.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
      annotations:
        checksum/provisioning: {{ print (tpl (.Files.Get "files/observability/datasource.yaml") .) (tpl (.Files.Get "files/observability/grafana.ini") $ctx) | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: {{ $gf.image }}
          securityContext:
            allowPrivilegeEscalation: false
            # 쓰기 경로: /var/lib/grafana(grafana-data PVC)와 /tmp(emptyDir)뿐. 라이브 실측으로 확인한다.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # 비밀은 env(secretKeyRef)로만 주입한다. 나머지 설정은 grafana.ini(ConfigMap) — 비밀 이름 패턴 env 린트도 피한다.
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: grafana
            # Keycloak은 내부 CA 인증서를 쓴다 — Go는 SSL_CERT_FILE을 시스템 루트 대신 신뢰한다.
            # grafana.ini에서 외부 인터넷 호출을 모두 껐으므로 내부 CA 단일 파일로 충분하다.
            - name: SSL_CERT_FILE
              value: /etc/internal-ca/ca.crt
          ports:
            - containerPort: {{ $gf.port }}
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ $gf.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ $gf.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-ini
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
              readOnly: true
            - name: internal-ca
              mountPath: /etc/internal-ca
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: grafana-ini
          configMap:
            name: grafana-config
        # internal-ca-distribution.yaml이 platform-system에 이미 복제한 공개 CA(ca.crt).
        - name: internal-ca
          configMap:
            name: beluga-internal-ca
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: platform-system
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: {{ $gf.port }}
      targetPort: {{ $gf.port }}
---
# 게이트웨이: grafana.<baseDomain> → grafana Service. 인증은 앱(Grafana generic_oauth)이 처리하므로
# 게이트웨이에는 openid-connect 플러그인이 없다(sso.yaml mode app-oidc, argocd/superset과 동일).
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: grafana
  namespace: platform-system
spec:
  externalNodes:
    - type: Domain
      name: grafana.platform-system.svc.cluster.local
      port: {{ $gf.port }}
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: grafana
  namespace: platform-system
spec:
  http:
    - name: grafana
      match:
        hosts:
          - grafana.{{ .Values.baseDomain }}
        paths:
          - "/*"
      upstreams:
        - name: grafana
      plugins:
        - name: limit-req
          enable: true
          config:
            rate: 50
            burst: 100
            key_type: var
            key: remote_addr
            rejected_code: 429
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                X-Content-Type-Options: "nosniff"
                X-Frame-Options: "SAMEORIGIN"
---
# NetworkPolicy(파드 단위 — platform-system은 default-deny 베이스라인 네임스페이스).
# victoria-metrics: 수신은 grafana(데이터소스 질의)만, 송신은 DNS + 검증된 스크레이프 대상 + grafana:3000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victoria-metrics-ingress
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app: victoria-metrics
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: {{ $vm.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victoria-metrics-egress
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app: victoria-metrics
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # argocd 메트릭 포트(application-controller 8082, server 8083, repo-server 8084, notifications 9001)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
      ports:
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 9001
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cert-manager
      ports:
        - protocol: TCP
          port: 9402
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: iam
          podSelector:
            matchLabels:
              app: opa
      ports:
        - protocol: TCP
          port: 8181
    - to:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: {{ $gf.port }}
---
# grafana: 수신은 게이트웨이(apisix)와 VictoriaMetrics(/metrics 스크레이프)만.
# 송신은 DNS, VictoriaMetrics 질의, 게이트웨이 443(sso.<baseDomain> 토큰/userinfo — Keycloak 공개 호스트명은
# 게이트웨이를 거친다. lakekeeper-egress와 같은 근거와 같은 잔여 위험: NetworkPolicy는 호스트명으로 못 좁힌다).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: apisix
        - podSelector:
            matchLabels:
              app: victoria-metrics
      ports:
        - protocol: TCP
          port: {{ $gf.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-egress
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: victoria-metrics
      ports:
        - protocol: TCP
          port: {{ $vm.port }}
    - to:
        - podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 443
{{- end }}
