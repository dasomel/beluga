# D20: Keycloak LDAP User Federation Provisioning Job (iam)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-ldap-federation
  namespace: iam
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # sync-wave: 이 Job은 Keycloak 서버와 ldapium 서버가 **둘 다** 뜬 뒤에 실행돼야 한다.
    # 두 Deployment 모두 웨이브 미지정(=0)이고 openldap-init은 2이므로, 그보다 뒤인 3으로 둔다.
    # (예전 -1은 서버들이 이미 떠 있던 환경에서만 우연히 동작했다.)
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: keycloak-ldap-federation
          image: python:3.12-slim
          command:
            - python3
            - -c
            - |
              import sys
              import time
              import json
              import socket
              import urllib.request
              import urllib.parse
              import urllib.error

              KC_BASE = "http://keycloak.iam.svc.cluster.local:8080"
              REALM = "beluga"
              ADMIN_USER = "admin"
              ADMIN_PASS = {{ .Values.credentials.keycloakAdminPassword | quote }}
              LDAP_ADMIN_PASS = {{ .Values.credentials.ldapAdminPassword | quote }}

              def make_req(url, data=None, headers=None, method=None):
                  if headers is None:
                      headers = {}
                  if data is not None and isinstance(data, (dict, list)):
                      data = json.dumps(data).encode("utf-8")
                      headers["Content-Type"] = "application/json"
                  elif data is not None and isinstance(data, str):
                      data = data.encode("utf-8")

                  req = urllib.request.Request(url, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req) as resp:
                          body = resp.read().decode("utf-8")
                          return resp.status, body
                  except urllib.error.HTTPError as e:
                      err_body = e.read().decode("utf-8")
                      print(f"HTTPError: {e.code} for {url}: {err_body}")
                      raise e
                  except Exception as e:
                      print(f"Error for {url}: {e}")
                      raise e

              # 1. Wait for Keycloak realm endpoint
              print("Waiting for Keycloak realm beluga to be ready...")
              realm_url = f"{KC_BASE}/realms/{REALM}"
              kc_ready = False
              for i in range(60):
                  try:
                      status, _ = make_req(realm_url)
                      if status == 200:
                          print("Keycloak realm is ready!")
                          kc_ready = True
                          break
                  except Exception:
                      pass
                  time.sleep(5)

              if not kc_ready:
                  print("Keycloak did not become ready in time.")
                  sys.exit(1)

              # 2. Wait for OpenLDAP service
              print("Waiting for OpenLDAP service at openldap:389...")
              ldap_ready = False
              for i in range(60):
                  try:
                      with socket.create_connection(("openldap.iam.svc.cluster.local", 389), timeout=3):
                          print("OpenLDAP is ready!")
                          ldap_ready = True
                          break
                  except Exception:
                      pass
                  time.sleep(5)

              if not ldap_ready:
                  print("OpenLDAP did not become ready in time.")
                  sys.exit(1)

              # 3. Get master admin token
              print("Obtaining Keycloak admin token...")
              token_url = f"{KC_BASE}/realms/master/protocol/openid-connect/token"
              token_data = urllib.parse.urlencode({
                  "client_id": "admin-cli",
                  "grant_type": "password",
                  "username": ADMIN_USER,
                  "password": ADMIN_PASS
              }).encode("utf-8")
              headers = {"Content-Type": "application/x-www-form-urlencoded"}

              try:
                  status, body = make_req(token_url, data=token_data, headers=headers, method="POST")
                  if status != 200:
                      print(f"Failed to get admin token, status: {status}")
                      sys.exit(1)
                  token_json = json.loads(body)
                  access_token = token_json["access_token"]
              except Exception as e:
                  print(f"Error obtaining admin token: {e}")
                  sys.exit(1)

              auth_headers = {"Authorization": f"Bearer {access_token}"}

              # 컴포넌트 생성에는 parentId(realm UUID)가 필수 — 누락 시 조용히 실패 (실측)
              status, body = make_req(f"{KC_BASE}/admin/realms/{REALM}", headers=auth_headers)
              realm_id = json.loads(body)["id"]
              print(f"Realm ID: {realm_id}")

              # 4. Check if LDAP User Storage Provider exists
              print("Checking existing User Storage Providers...")
              # type 단독 필터는 빈 목록을 반환한다 — parent(realm id)와 함께 써야 한다.
              # 이걸 놓쳐 존재 확인이 매번 실패하며 프로바이더가 36개까지 중복 생성됨 (실측)
              # 서버측 type/parent 필터는 이 엔드포인트에서 신뢰할 수 없다 — 두 조합 모두 빈 목록을
              # 반환해 존재 확인이 매번 실패하고 프로바이더가 수십 개 중복 생성됐다 (실측).
              # 전체 목록을 받아 클라이언트에서 providerId로 거른다.
              components_url = f"{KC_BASE}/admin/realms/{REALM}/components"
              component_id = None
              try:
                  status, body = make_req(components_url, headers=auth_headers)
                  if status == 200:
                      components = json.loads(body)
                      for comp in components:
                          if comp.get("providerId") == "ldap":
                              component_id = comp.get("id")
                              break
              except Exception as e:
                  print(f"Error listing components: {e}")
                  sys.exit(1)

              ldap_config = {
                  "name": "openldap",
                  "providerId": "ldap",
                  "providerType": "org.keycloak.storage.UserStorageProvider",
                  "parentId": REALM,
                  "config": {
                      "vendor": ["other"],
                      "editMode": ["WRITABLE"],
                      "connectionUrl": ["ldap://openldap.iam.svc.cluster.local:389"],
                      "usersDn": ["ou=users,dc=beluga,dc=internal"],
                      "bindDn": ["cn=admin,dc=beluga,dc=internal"],
                      "bindCredential": [LDAP_ADMIN_PASS],
                      "usernameLDAPAttribute": ["uid"],
                      "rdnLDAPAttribute": ["uid"],
                      "uuidLDAPAttribute": ["entryUUID"],
                      "userObjectClasses": ["inetOrgPerson,organizationalPerson"],
                      "importEnabled": ["true"],
                      "syncRegistrations": ["true"],
                      "authType": ["simple"],
                      "useTruststoreSpi": ["always"],
                      "connectionPooling": ["true"],
                      "pagination": ["true"]
                  }
              }

              if component_id:
                  print(f"Updating existing LDAP User Storage Provider component ID: {component_id}...")
                  ldap_config["id"] = component_id
                  update_url = f"{KC_BASE}/admin/realms/{REALM}/components/{component_id}"
                  try:
                      status, _ = make_req(update_url, data=ldap_config, headers=auth_headers, method="PUT")
                      if status not in (200, 204):
                          print(f"Failed to update LDAP component, status: {status}")
                          sys.exit(1)
                  except Exception as e:
                      print(f"Error updating LDAP component: {e}")
                      sys.exit(1)
              else:
                  print("Creating LDAP User Storage Provider component...")
                  create_url = f"{KC_BASE}/admin/realms/{REALM}/components"
                  try:
                      status, body = make_req(create_url, data=ldap_config, headers=auth_headers, method="POST")
                      if status not in (201, 200, 204):
                          print(f"Failed to create LDAP component, status: {status}")
                          sys.exit(1)
                  except Exception as e:
                      print(f"Error creating LDAP component: {e}")
                      sys.exit(1)

                  # Retrieve created component ID if needed
                  try:
                      status, body = make_req(components_url, headers=auth_headers)
                      components = json.loads(body)
                      for comp in components:
                          if comp.get("providerId") == "ldap":
                              component_id = comp.get("id")
                              break
                  except Exception as e:
                      print(f"Error retrieving created component ID: {e}")
                      sys.exit(1)

              if not component_id:
                  print("Error: Could not determine component ID for LDAP provider.")
                  sys.exit(1)

              # 5. Trigger user sync
              print(f"Triggering full user sync for component {component_id}...")
              sync_url = f"{KC_BASE}/admin/realms/{REALM}/user-storage/{component_id}/sync?action=triggerFullSync"
              try:
                  status, body = make_req(sync_url, headers=auth_headers, method="POST")
                  if status == 200:
                      print(f"Sync response: {body}")
                  else:
                      print(f"Sync failed with status: {status}, body: {body}")
                      sys.exit(1)
              except Exception as e:
                  print(f"Error triggering LDAP sync: {e}")
                  sys.exit(1)

              print("Keycloak LDAP federation registration completed successfully.")
