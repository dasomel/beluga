# 이슈 #2: 내부 CA(beluga-internal-ca-issuer, cert-manager-issuer.yaml)의 공개 인증서
# (ca.crt)를 필요한 네임스페이스에 ConfigMap으로 복제한다. ca.crt는 검증용 공개 자료라
# Secret이 아니라 ConfigMap을 쓴다(이 리포의 keycloak-client-secrets류는 진짜 비밀이라
# Secret으로 복제하는 것과 대비).
#
# sync-wave: -1 — Keycloak/OpenLDAP/Trino Deployment(전부 웨이브 미지정=0)가 이 ConfigMap을
# 마운트하므로 그보다 반드시 먼저 끝나야 한다. beluga-internal-ca-secret 자체는
# cert-manager-issuer.yaml(웨이브 0)이 만드는데, 이 루트 CA는 Task 15에서 이미 발급돼
# 지금 클러스터에 존재하므로(신규 부트스트랩이 아닌 한) 순서 문제가 없다 — 그래도 방어적으로
# 존재할 때까지 짧게 재시도한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: internal-ca-distribution
  namespace: platform-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: internal-ca-distribution
      containers:
        - name: distribute
          # 2026-08-26 docker manifest inspect로 실존+amd64/arm64 확인. 클러스터 k3s
          # 버전(1.36.3)에 가장 근접한 rancher 공식 태그.
          image: rancher/kubectl:v1.36.2
          command:
            - /bin/bash
            - -c
            - |
              set -eu
              echo "Waiting for beluga-internal-ca-secret..."
              for i in $(seq 1 30); do
                if kubectl -n cert-manager get secret beluga-internal-ca-secret >/dev/null 2>&1; then
                  break
                fi
                echo "not ready yet, retrying in 3s..."
                sleep 3
              done
              kubectl -n cert-manager get secret beluga-internal-ca-secret >/dev/null 2>&1 || {
                echo "beluga-internal-ca-secret never appeared"; exit 1;
              }
              CA_CRT="$(kubectl -n cert-manager get secret beluga-internal-ca-secret -o jsonpath='{.data.ca\.crt}' | base64 -d)"
              for ns in iam analytics; do
                echo "Distributing internal CA to namespace ${ns}..."
                kubectl create configmap beluga-internal-ca -n "${ns}" \
                  --from-literal=ca.crt="${CA_CRT}" \
                  --dry-run=client -o yaml | kubectl apply -f -
              done
              echo "Internal CA distribution complete."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: internal-ca-distribution
  namespace: platform-system
---
# cert-manager 네임스페이스의 Secret을 읽고, iam/analytics에 ConfigMap을 쓰는 최소 권한.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-ca-distribution-reader
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["beluga-internal-ca-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-ca-distribution-reader
  namespace: cert-manager
subjects:
  - kind: ServiceAccount
    name: internal-ca-distribution
    namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-ca-distribution-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-ca-distribution-writer
  namespace: iam
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-ca-distribution-writer
  namespace: iam
subjects:
  - kind: ServiceAccount
    name: internal-ca-distribution
    namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-ca-distribution-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-ca-distribution-writer
  namespace: analytics
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-ca-distribution-writer
  namespace: analytics
subjects:
  - kind: ServiceAccount
    name: internal-ca-distribution
    namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-ca-distribution-writer
