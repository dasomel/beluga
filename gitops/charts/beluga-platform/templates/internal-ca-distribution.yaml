# 이슈 #2: 내부 CA(beluga-internal-ca-issuer, cert-manager-issuer.yaml)의 공개 인증서
# (ca.crt)를 필요한 네임스페이스에 ConfigMap으로 복제한다. ca.crt는 검증용 공개 자료라
# Secret이 아니라 ConfigMap을 쓴다(이 리포의 keycloak-client-secrets류는 진짜 비밀이라
# Secret으로 복제하는 것과 대비).
#
# sync-wave: -1 — Keycloak/OpenLDAP/Trino Deployment(전부 웨이브 미지정=0)가 이 ConfigMap을
# 마운트하므로 그보다 반드시 먼저 끝나야 한다. beluga-internal-ca-secret 자체는
# cert-manager-issuer.yaml(웨이브 0)이 만드는데, 이 루트 CA는 Task 15에서 이미 발급돼
# 지금 클러스터에 존재하므로(신규 부트스트랩이 아닌 한) 순서 문제가 없다 — 그래도 방어적으로
# 존재할 때까지 짧게 재시도한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: internal-ca-distribution
  namespace: platform-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: internal-ca-distribution
      containers:
        - name: distribute
          # 2026-08-26 실배포 결함: rancher/kubectl:v1.36.2는 "kubectl from scratch"
          # 이미지라 쉘이 전혀 없다(docker manifest inspect는 존재/아키텍처만 확인했지
          # 셸 유무는 확인하지 못했다) — RunContainerError: stat /bin/bash 실패로 드러남.
          # kubectl 바이너리 대신, 이 리포의 다른 reconcile Job들(keycloak-clients.yaml 등)과
          # 같은 python:3.12-slim + stdlib만으로 K8s REST API를 직접 호출한다.
          image: python:3.12-slim
          command:
            - python3
            - -c
            - |
              import base64, json, ssl, time, urllib.request, urllib.error

              SA = "/var/run/secrets/kubernetes.io/serviceaccount"
              with open(f"{SA}/token") as f:
                  TOKEN = f.read().strip()
              CTX = ssl.create_default_context(cafile=f"{SA}/ca.crt")
              API = "https://kubernetes.default.svc"

              def call(method, path, body=None):
                  data = json.dumps(body).encode() if body is not None else None
                  req = urllib.request.Request(f"{API}{path}", data=data, method=method)
                  req.add_header("Authorization", f"Bearer {TOKEN}")
                  req.add_header("Content-Type", "application/json")
                  try:
                      with urllib.request.urlopen(req, context=CTX, timeout=10) as resp:
                          return resp.status, json.loads(resp.read())
                  except urllib.error.HTTPError as e:
                      return e.code, json.loads(e.read())

              print("Waiting for beluga-internal-ca-secret...")
              secret = None
              for _ in range(30):
                  status, body = call("GET", "/api/v1/namespaces/cert-manager/secrets/beluga-internal-ca-secret")
                  if status == 200:
                      secret = body
                      break
                  print("not ready yet, retrying in 3s...")
                  time.sleep(3)
              if secret is None:
                  raise SystemExit("beluga-internal-ca-secret never appeared")

              ca_crt = base64.b64decode(secret["data"]["ca.crt"]).decode()

              for ns in ["iam", "analytics"]:
                  print(f"Distributing internal CA to namespace {ns}...")
                  status, existing = call("GET", f"/api/v1/namespaces/{ns}/configmaps/beluga-internal-ca")
                  if status == 200:
                      existing.setdefault("data", {})["ca.crt"] = ca_crt
                      status, resp = call("PUT", f"/api/v1/namespaces/{ns}/configmaps/beluga-internal-ca", existing)
                  else:
                      cm = {
                          "apiVersion": "v1",
                          "kind": "ConfigMap",
                          "metadata": {"name": "beluga-internal-ca", "namespace": ns},
                          "data": {"ca.crt": ca_crt},
                      }
                      status, resp = call("POST", f"/api/v1/namespaces/{ns}/configmaps", cm)
                  if status not in (200, 201):
                      raise SystemExit(f"configmap write failed in {ns}: {status} {resp}")

              print("Internal CA distribution complete.")
---
# 웨이브 -2: 위 Job(웨이브 -1)이 이 ServiceAccount/RBAC를 참조하므로 반드시 먼저
# 존재해야 한다 — 실측 결함: 둘 다 웨이브 미지정(=0)으로 뒀다가 Job(-1)이 SA(0)보다
# 먼저 생성 시도되어 "serviceaccount ... not found"로 실패했다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: internal-ca-distribution
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
# cert-manager 네임스페이스의 Secret을 읽고, iam/analytics에 ConfigMap을 쓰는 최소 권한.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-ca-distribution-reader
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["beluga-internal-ca-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-ca-distribution-reader
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: internal-ca-distribution
    namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-ca-distribution-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-ca-distribution-writer
  namespace: iam
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-ca-distribution-writer
  namespace: iam
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: internal-ca-distribution
    namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-ca-distribution-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-ca-distribution-writer
  namespace: analytics
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-ca-distribution-writer
  namespace: analytics
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: internal-ca-distribution
    namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-ca-distribution-writer
