# D11: APISIX Gateway + Ingress Controller (narwhal 패턴 기반, 간소화)
# APISIX 3.11.0: HTTP 전용 (TLS/OIDC 불필요), MetalLB LoadBalancer로 포트 80 노출
# Ingress Controller 1.8.0: ApisixRoute/ApisixUpstream CRD → etcd → APISIX 자동 동기화
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: platform-system
data:
  config.yaml: |
    apisix:
      # id 미지정 시 APISIX가 config.yaml에 생성 id를 써넣으려다 읽기 전용
      # ConfigMap 마운트에서 크래시 (E2E 실측) — 고정 id로 쓰기 경로 차단
      id: "beluga-apisix-1"
      node_listen:
        - 9080
      # 이슈 #2: SSL 리스너 활성화(APISIX 3.17 공식 config-default.yaml 확인,
      # apisix.ssl.enable + apisix.ssl.listen). 인증서 자체는 정적 파일이 아니라
      # ApisixTls CRD가 Admin API/etcd 경유로 밀어 넣는다(ApisixRoute/ApisixUpstream과
      # 동일 메커니즘) — 이 파드에 TLS Secret을 직접 마운트할 필요가 없다.
      ssl:
        enable: true
        # Codex 리뷰 실측(이슈 #2): forwarded-headers 전역 규칙(proxy-rewrite headers.set)은
        # APISIX의 X-Forwarded-Port 계산(init.lua set_upstream_x_forwarded_headers)에
        # 반영되지 않는다 — $server_port를 upstream에 그대로 흘려보낸다. 리스너 포트 자체를
        # LB가 외부에 노출하는 443과 일치시켜 $server_port=443이 되게 근본 해결한다.
        listen:
          - port: 443
      enable_heartbeat: true
      enable_admin: true
      enable_admin_cors: true
      enable_control: true
      control:
        ip: 127.0.0.1
        port: 9090
      enable_reuseport: true
      enable_ipv6: false
      router:
        http: radixtree_host_uri
      proxy_mode: http
      dns_resolver_valid: 30
      resolver_timeout: 5
    # 이슈 #2 실배포 실측: redirect 플러그인(http_to_https)은 plugin_attr.redirect.https_port
    # 가 없으면 apisix.ssl.listen 의 첫 포트로 폴백한다(redirect.lua 확인). 이제 리스너
    # 자체가 443이라 폴백값과 동일하지만, 리스너 포트가 나중에 다시 바뀌어도 리다이렉트
    # 대상 포트(외부 노출 포트)가 조용히 따라 바뀌지 않도록 명시적으로 유지한다.
    plugin_attr:
      redirect:
        https_port: 443
    nginx_config:
      error_log: "/dev/stderr"
      error_log_level: "warn"
      worker_processes: "auto"
      event:
        worker_connections: 10620
      http:
        enable_access_log: true
        access_log: "/dev/stdout"
        access_log_format: '$remote_addr - $remote_user [$time_local] $http_host "$request" $status $body_bytes_sent $request_time'
        keepalive_timeout: "60s"
        client_max_body_size: 0
        underscores_in_headers: "on"
        real_ip_header: "X-Real-IP"
    deployment:
      role: traditional
      role_traditional:
        config_provider: etcd
      admin:
        allow_admin:
          # 이슈 #4: 0.0.0.0/0(전 인터넷 포함)이었던 애플리케이션 레벨 방화벽을 이 클러스터
          # 파드 네트워크(k3s flannel 기본, 실측: `kubectl get nodes -o
          # jsonpath='{.items[*].spec.podCIDR}'` → 10.42.{0..3}.0/24, 즉 10.42.0.0/16)로
          # 축소한다. 이것만으로는 같은 클러스터 안의 무관한 파드를 막지 못한다 — 실제
          # 경계는 아래 NetworkPolicy(apisix-admin-restrict)가 담당한다. allow_admin은
          # 심층 방어의 두 번째 레이어일 뿐이다.
          - 10.42.0.0/16
        # 키 미지정 시 APISIX가 랜덤 키 생성 → ingress controller가 admin API 인증 실패로
        # 라우트 동기화 전무 (404 Route Not Found 실측).
        # D-K(이슈 #104): Helm 렌더 시점 굽기 대신 APISIX 네이티브 환경변수 치환 문법을 쓴다
        # (참고: https://apisix.apache.org/docs/apisix/next/customize-nginx-configuration/#environment-variable).
        # config.yaml 자체는 자리표시자만 담고, 실값은 apisix 컨테이너의 secretKeyRef
        # env(APISIX_ADMIN_KEY)에서 기동 시점에 채워진다. 아래 값은 Helm이 아니라 APISIX가
        # 해석해야 하므로, Helm 템플릿 엔진이 자체 액션으로 오인하지 않도록 문자열 리터럴로 이스케이프한다.
        admin_key:
          - name: admin
            key: {{ "${{APISIX_ADMIN_KEY}}" }}
            role: admin
        admin_listen:
          ip: 0.0.0.0
          port: 9180
      etcd:
        host:
          - "http://apisix-etcd.platform-system.svc.cluster.local:2379"
        prefix: "/apisix"
        timeout: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: platform-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
    spec:
      # Codex 리뷰 실측(이슈 #2): apisix 컨테이너는 uid 636(비root)이라 443(<1024, 특권
      # 포트) 바인드가 기본 거부된다. NET_BIND_SERVICE capability는 비root 프로세스에서
      # ambient set 보장이 불확실해(커널/런타임 조합에 따라 실효 없음) 쓰지 않고, K8s
      # 1.22+ 기본 허용되는 안전(safe) sysctl로 특권 포트 하한 자체를 낮춘다(k3s 1.36 확인).
      securityContext:
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      # APISIX는 기동 시 conf 디렉터리에 인스턴스 상태를 써야 함 — ConfigMap subPath
      # 마운트(읽기 전용)에서는 id.lua가 크래시 (E2E 실측). initContainer가 이미지 conf를
      # emptyDir로 복사 후 우리 config.yaml을 덮어 쓰기 가능한 conf를 만든다
      initContainers:
        - name: init-conf
          image: apache/apisix:3.17.0-debian
          command:
            - sh
            - -c
            - cp -r /usr/local/apisix/conf/. /conf-rw/ && cp /conf-src/config.yaml /conf-rw/config.yaml
          volumeMounts:
            - name: conf-rw
              mountPath: /conf-rw
            - name: config
              mountPath: /conf-src
      containers:
        - name: apisix
          image: apache/apisix:3.17.0-debian
          env:
            - name: APISIX_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: apisix-admin-credential
                  key: key
          ports:
            - containerPort: 9080
              name: http
            - containerPort: 443
              name: https
            - containerPort: 9180
              name: admin
          volumeMounts:
            - name: conf-rw
              mountPath: /usr/local/apisix/conf
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # /apisix/status는 3.x 데이터 플레인 포트에 없음(404) — 프록시 생존은 TCP로 판정 (E2E 실측)
          readinessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: apisix-config
        - name: conf-rw
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-gateway
  namespace: platform-system
  annotations:
    metallb.universe.tf/loadBalancerIPs: "{{ .Values.apisix.loadBalancerIP }}"
spec:
  type: LoadBalancer
  selector:
    app: apisix
  ports:
    - name: http
      port: 80
      targetPort: 9080
    - name: https
      port: 443
      targetPort: 443
---
# 이슈 #2: 게이트웨이 TLS. 클러스터의 기존 내부 CA(beluga-internal-ca-issuer, Task 15부터
# Trino 코디네이터가 이미 사용 중)로 *.{{ .Values.baseDomain }}/베어 도메인 와일드카드
# 인증서 하나를 발급해 9개 서브도메인 전부를 커버한다(서브도메인마다 개별 SAN·재발급 불필요).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apisix-gateway-tls
  namespace: platform-system
spec:
  secretName: apisix-gateway-tls-secret
  dnsNames:
    - "*.{{ .Values.baseDomain }}"
    - "{{ .Values.baseDomain }}"
  issuerRef:
    name: beluga-internal-ca-issuer
    kind: ClusterIssuer
---
# ApisixTls는 이 Secret을 Admin API/etcd 경유로 APISIX에 SSL 오브젝트로 밀어 넣는다
# (ApisixRoute/ApisixUpstream과 동일한 CRD 동기화 경로, 정적 파일 마운트 아님).
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: apisix-gateway-tls
  namespace: platform-system
spec:
  hosts:
    - "*.{{ .Values.baseDomain }}"
    - "{{ .Values.baseDomain }}"
  secret:
    name: apisix-gateway-tls-secret
    namespace: platform-system
---
# 이슈 #2: HTTP→HTTPS 리다이렉트를 라우트 9개 전부에 개별로 붙이는 대신
# ApisixGlobalRule 하나로 전역 적용(APISIX 3.17 redirect 플러그인, http_to_https 스키마
# 확인 — apisix/plugins/redirect.lua).
apiVersion: apisix.apache.org/v2
kind: ApisixGlobalRule
metadata:
  name: https-redirect
  namespace: platform-system
spec:
  plugins:
    - name: redirect
      enable: true
      config:
        http_to_https: true
---
# Codex 리뷰 추가 실측(이슈 #2): 이전에 여기 있던 ApisixGlobalRule(forwarded-headers,
# proxy-rewrite headers.set으로 X-Forwarded-* 강제)은 APISIX에 정상 적재됐지만
# (ResourcesSynced) 효과가 없었다 — init.lua의 set_upstream_x_forwarded_headers는
# api_ctx.var.http_x_forwarded_port를 읽는데 proxy-rewrite가 만드는 값이 여기 반영되지
# 않는다(원인 추적은 시간 대비 가치가 낮아 보류). 대신 위 SSL 리스너 포트를 443으로
# 직접 바인드해 $server_port 자체를 443으로 만드는 쪽으로 근본 해결했다(apisix Deployment
# securityContext.sysctls 참고). 클라이언트가 보내는 X-Forwarded-* 스푸핑 자체는 이 변경으로
# 막히지 않지만, Keycloak redirect URI 화이트리스트(정확히 일치해야 통과)가 완화 수단이다 —
# 이 갭은 별도 이슈로 추적한다.
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-admin
  namespace: platform-system
spec:
  type: ClusterIP
  selector:
    app: apisix
  ports:
    - name: admin
      port: 9180
      targetPort: 9180
---
# 이슈 #4: admin key를 --default-apisix-cluster-admin-key=$(APISIX_ADMIN_KEY) CLI 플래그로
# 넘기면 K8s가 기동 전에 리터럴 값으로 치환해버려 컨테이너 프로세스의 실제 argv(ps로 노출)에
# 평문 admin key가 그대로 남는다. apisix-ingress-controller는 --config-path로 설정 파일을
# 읽는 모드를 지원하므로(--config-path를 쓰면 다른 CLI 플래그는 전부 무시됨, 공식 --help
# 문구), admin key를 파일에만 담고 그 파일은 D-K(이슈 #104)와 동일한 initContainer+sed
# 런타임 치환 패턴(apisix 본체 Deployment의 init-conf와 동일 기법)으로 렌더링한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-ingress-controller-config
  namespace: platform-system
data:
  config.yaml: |
    log_level: "info"
    log_output: "stderr"
    kubernetes:
      ingress_class: "apisix-and-all"
      ingress_version: "networking/v1"
      election_id: "ingress-apisix-leader"
      api_version: apisix.apache.org/v2
    apisix:
      admin_api_version: v3
      default_cluster_base_url: "http://apisix-admin.platform-system.svc.cluster.local:9180/apisix/admin"
      default_cluster_admin_key: "__APISIX_ADMIN_KEY__"
      default_cluster_name: "default"
---
# APISIX Ingress Controller — CRD watcher, all namespaces
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-ingress-controller
  namespace: platform-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix-ingress-controller
  template:
    metadata:
      labels:
        app: apisix-ingress-controller
    spec:
      serviceAccountName: apisix-ingress-controller
      initContainers:
        - name: wait-for-apisix-admin
          image: curlimages/curl:8.21.0
          env:
            - name: APISIX_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: apisix-admin-credential
                  key: key
          command:
            - sh
            - -c
            - |
              until curl -sf -H "X-API-KEY: ${APISIX_ADMIN_KEY}" http://apisix-admin.platform-system.svc.cluster.local:9180/apisix/admin/routes; do
                echo "Waiting for APISIX Admin API..."
                sleep 3
              done
              # 이슈 #4: admin key를 CLI 플래그가 아니라 --config-path 설정 파일로만
              # 전달한다 — 자리표시자를 실값으로 치환한 사본을 쓰기 가능한 emptyDir에 만든다.
              sed "s#__APISIX_ADMIN_KEY__#${APISIX_ADMIN_KEY}#" /conf-src/config.yaml > /conf-rw/config.yaml
          volumeMounts:
            - name: config
              mountPath: /conf-src
            - name: conf-rw
              mountPath: /conf-rw
      containers:
        - name: ingress-controller
          image: apache/apisix-ingress-controller:1.8.0
          # D-K(이슈 #104) 재적용(이슈 #4): 이 이미지는 셸이 없는 최소 이미지라 sh -c
          # 래핑이 불가능하다(실측: "exec: sh: executable file not found in $PATH").
          # --config-path 하나만 넘기면 다른 옵션은 전부 무시되므로(공식 --help), admin
          # key를 포함한 모든 설정은 위에서 렌더링한 config.yaml에 담는다 — CLI에는 admin
          # key가 전혀 나타나지 않는다.
          command:
            - /ingress-apisix/apisix-ingress-controller
            - ingress
            - --config-path=/conf-rw/config.yaml
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: conf-rw
              mountPath: /conf-rw
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: apisix-ingress-controller-config
        - name: conf-rw
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apisix-ingress-controller
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apisix-ingress-controller
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apisix.apache.org"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # 컨트롤러는 Ingress/IngressClass도 watch한다 — 권한이 없으면 informer 캐시가
  # 영원히 sync되지 않아 ApisixRoute까지 통째로 반영되지 않는다 (라우트 0개로 실측)
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apisix-ingress-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apisix-ingress-controller
subjects:
  - kind: ServiceAccount
    name: apisix-ingress-controller
    namespace: platform-system
---
# 이슈 #4: allow_admin CIDR(위)은 클러스터 파드 네트워크 전체를 여전히 허용하는 성긴
# 방어선이다 — 실제 경계는 이 NetworkPolicy가 담당한다. 데이터 플레인 포트(9080)는
# 제한하지 않는다(APISIX 게이트웨이는 모든 네임스페이스의 백엔드로/부터 트래픽을
# 릴레이해야 하는 것이 정상 동작). Admin API 포트(9180)만 apisix-ingress-controller
# 파드(같은 네임스페이스)로 제한한다 — Admin API의 유일한 정당한 클라이언트다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apisix-admin-restrict
  namespace: platform-system
spec:
  podSelector:
    matchLabels:
      app: apisix
  policyTypes:
    - Ingress
  ingress:
    # 데이터 플레인: 제한 없음(기존 동작 보존). 이슈 #2: NetworkPolicy가 파드를 선택하면
    # 명시되지 않은 포트는 기본 거부되므로, HTTPS 리스너 포트(443, 원래 9443이었으나
    # $server_port 문제 해결을 위해 외부 노출 포트와 통일)를 여기 추가하지 않으면
    # 게이트웨이 TLS 트래픽 전체가 이 NetworkPolicy(이슈 #4)에 조용히 막힌다.
    - ports:
        - port: 9080
          protocol: TCP
        - port: 443
          protocol: TCP
    # Admin API: 같은 네임스페이스의 apisix-ingress-controller 파드에서만
    - ports:
        - port: 9180
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app: apisix-ingress-controller
---
# Break-glass 절차: NetworkPolicy가 Admin API를 apisix-ingress-controller 파드로 제한한
# 뒤, 사람이 직접 Admin API를 조회/조작해야 하는 비상 상황(예: 컨트롤러 자체가 고장난 경우
# 라우트를 수동으로 점검)에는 아래 중 하나를 쓴다 — allow_admin CIDR이나 이 NetworkPolicy를
# 풀어서 노출을 넓히지 말 것:
#   1. kubectl -n platform-system exec -it deploy/apisix-ingress-controller -- 로는 셸이
#      없어 불가 — 대신 kubectl -n platform-system run admin-debug --rm -it
#      --image=curlimages/curl:8.21.0 --restart=Never --labels="app=apisix-ingress-controller"
