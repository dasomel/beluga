# D11: APISIX Gateway + Ingress Controller (narwhal 패턴 기반, 간소화)
# APISIX 3.11.0: HTTP 전용 (TLS/OIDC 불필요), MetalLB LoadBalancer로 포트 80 노출
# Ingress Controller 1.8.0: ApisixRoute/ApisixUpstream CRD → etcd → APISIX 자동 동기화
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: platform-system
data:
  config.yaml: |
    apisix:
      # id 미지정 시 APISIX가 config.yaml에 생성 id를 써넣으려다 읽기 전용
      # ConfigMap 마운트에서 크래시 (E2E 실측) — 고정 id로 쓰기 경로 차단
      id: "beluga-apisix-1"
      node_listen:
        - 9080
      enable_heartbeat: true
      enable_admin: true
      enable_admin_cors: true
      enable_control: true
      control:
        ip: 127.0.0.1
        port: 9090
      enable_reuseport: true
      enable_ipv6: false
      router:
        http: radixtree_host_uri
      proxy_mode: http
      dns_resolver_valid: 30
      resolver_timeout: 5
    nginx_config:
      error_log: "/dev/stderr"
      error_log_level: "warn"
      worker_processes: "auto"
      event:
        worker_connections: 10620
      http:
        enable_access_log: true
        access_log: "/dev/stdout"
        access_log_format: '$remote_addr - $remote_user [$time_local] $http_host "$request" $status $body_bytes_sent $request_time'
        keepalive_timeout: "60s"
        client_max_body_size: 0
        underscores_in_headers: "on"
        real_ip_header: "X-Real-IP"
    deployment:
      role: traditional
      role_traditional:
        config_provider: etcd
      admin:
        allow_admin:
          - 0.0.0.0/0
        # 키 미지정 시 APISIX가 랜덤 키 생성 → ingress controller가 admin API 인증 실패로
        # 라우트 동기화 전무 (404 Route Not Found 실측).
        # D-K(이슈 #104): Helm 렌더 시점 굽기 대신 APISIX 네이티브 환경변수 치환 문법을 쓴다
        # (참고: https://apisix.apache.org/docs/apisix/next/customize-nginx-configuration/#environment-variable).
        # config.yaml 자체는 자리표시자만 담고, 실값은 apisix 컨테이너의 secretKeyRef
        # env(APISIX_ADMIN_KEY)에서 기동 시점에 채워진다. 아래 값은 Helm이 아니라 APISIX가
        # 해석해야 하므로, Helm 템플릿 엔진이 자체 액션으로 오인하지 않도록 문자열 리터럴로 이스케이프한다.
        admin_key:
          - name: admin
            key: {{ "${{APISIX_ADMIN_KEY}}" }}
            role: admin
        admin_listen:
          ip: 0.0.0.0
          port: 9180
      etcd:
        host:
          - "http://apisix-etcd.platform-system.svc.cluster.local:2379"
        prefix: "/apisix"
        timeout: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: platform-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
    spec:
      # APISIX는 기동 시 conf 디렉터리에 인스턴스 상태를 써야 함 — ConfigMap subPath
      # 마운트(읽기 전용)에서는 id.lua가 크래시 (E2E 실측). initContainer가 이미지 conf를
      # emptyDir로 복사 후 우리 config.yaml을 덮어 쓰기 가능한 conf를 만든다
      initContainers:
        - name: init-conf
          image: apache/apisix:3.17.0-debian
          command:
            - sh
            - -c
            - cp -r /usr/local/apisix/conf/. /conf-rw/ && cp /conf-src/config.yaml /conf-rw/config.yaml
          volumeMounts:
            - name: conf-rw
              mountPath: /conf-rw
            - name: config
              mountPath: /conf-src
      containers:
        - name: apisix
          image: apache/apisix:3.17.0-debian
          env:
            - name: APISIX_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: apisix-admin-credential
                  key: key
          ports:
            - containerPort: 9080
              name: http
            - containerPort: 9180
              name: admin
          volumeMounts:
            - name: conf-rw
              mountPath: /usr/local/apisix/conf
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # /apisix/status는 3.x 데이터 플레인 포트에 없음(404) — 프록시 생존은 TCP로 판정 (E2E 실측)
          readinessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: apisix-config
        - name: conf-rw
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-gateway
  namespace: platform-system
  annotations:
    metallb.universe.tf/loadBalancerIPs: "{{ .Values.apisix.loadBalancerIP }}"
spec:
  type: LoadBalancer
  selector:
    app: apisix
  ports:
    - name: http
      port: 80
      targetPort: 9080
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-admin
  namespace: platform-system
spec:
  type: ClusterIP
  selector:
    app: apisix
  ports:
    - name: admin
      port: 9180
      targetPort: 9180
---
# APISIX Ingress Controller — CRD watcher, all namespaces
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-ingress-controller
  namespace: platform-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix-ingress-controller
  template:
    metadata:
      labels:
        app: apisix-ingress-controller
    spec:
      serviceAccountName: apisix-ingress-controller
      initContainers:
        - name: wait-for-apisix-admin
          image: curlimages/curl:8.21.0
          env:
            - name: APISIX_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: apisix-admin-credential
                  key: key
          command:
            - sh
            - -c
            - |
              until curl -sf -H "X-API-KEY: ${APISIX_ADMIN_KEY}" http://apisix-admin.platform-system.svc.cluster.local:9180/apisix/admin/routes; do
                echo "Waiting for APISIX Admin API..."
                sleep 3
              done
      containers:
        - name: ingress-controller
          image: apache/apisix-ingress-controller:1.8.0
          # D-K(이슈 #104): 이 이미지는 셸이 없는 최소 이미지라 sh -c 래핑이 불가능하다
          # (실측: "exec: sh: executable file not found in $PATH"). 대신 K8s가 command/args
          # 자체에서 지원하는 $(VAR_NAME) 치환(kubelet이 해석, 셸 불필요)을 쓴다.
          command:
            - /ingress-apisix/apisix-ingress-controller
            - ingress
            - --apisix-admin-api-version=v3
            - --default-apisix-cluster-name=default
            - --default-apisix-cluster-base-url=http://apisix-admin.platform-system.svc.cluster.local:9180/apisix/admin
            - --default-apisix-cluster-admin-key=$(APISIX_ADMIN_KEY)
            - --api-version=apisix.apache.org/v2
            - --log-level=info
            - --log-output=stderr
          env:
            - name: APISIX_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: apisix-admin-credential
                  key: key
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apisix-ingress-controller
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apisix-ingress-controller
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apisix.apache.org"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # 컨트롤러는 Ingress/IngressClass도 watch한다 — 권한이 없으면 informer 캐시가
  # 영원히 sync되지 않아 ApisixRoute까지 통째로 반영되지 않는다 (라우트 0개로 실측)
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apisix-ingress-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apisix-ingress-controller
subjects:
  - kind: ServiceAccount
    name: apisix-ingress-controller
    namespace: platform-system
