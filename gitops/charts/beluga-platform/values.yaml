# Beluga Platform Chart Values (VERSIONS.md 참조)

# D11: APISIX 도메인 기반 라우팅
baseDomain: "local.beluga.internal"

# D-K(이슈 #104): credentials.* 렌더 시점 주입 블록을 제거했다. 모든 자격증명은 이제
# 부트스트랩 스크립트(01-argocd-bootstrap.sh)가 각 워크로드의 네임스페이스에 직접 생성하는
# Secret에서 secretKeyRef로 읽는다 — ArgoCD가 관리하지 않는 리소스라 selfHeal이 되돌릴 수
# 없다. 자세한 배경은 gitops/charts/beluga-platform/templates/keycloak.yaml 상단 주석 참고.

apisix:
  loadBalancerIP: "192.168.77.200"
  # 게이트웨이 Service 노출 방식. 기본(LoadBalancer)은 MetalLB 경로(Vagrant)이며,
  # 클라우드 오버레이(values-kakao.yaml)가 NodePort + 고정 clusterIP로 덮어쓴다.
  service:
    type: LoadBalancer
    clusterIP: ""
    nodePorts:
      http: ""
      https: ""

certManager:
  enabled: true
  version: "1.21.1"

# 이슈 #366(오너 결정 2026-11-09): VictoriaMetrics single-node + Grafana. 32GB 프로파일에 맞춘
# 작은 requests/limits와 짧은 보존. 로그는 이번 범위에서 Kubernetes Events만 쓴다(Loki 없음).
# 이미지는 태그+digest로 고정한다(VERSIONS.md가 버전 원천, 라이선스 예외는 policies/license-policy.yaml).
observability:
  enabled: true
  victoriaMetrics:
    image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
    port: 8428
    retention: "7d"
    storage: 5Gi
  # D-ALERT-5: 지원 환경(Vagrant/Kakao/colima)은 Cilium 엔티티로 API/노드에 연결한다.
  # 비용: Cilium CRD 필요; 탈출구: 비 Cilium은 false로 끈다(별도 정책 없이는 노드 메트릭 수집 불가).
  ciliumEntityEgress: true
  vmalert:
    image: victoriametrics/vmalert:v1.155.0@sha256:3256cba5ddaca5974eae6141105cec4ce37871f1c213f0a5c267ec0111bc68e1
    port: 8880
  alertmanager:
    # D-ALERT-2: 4일 된 v0.35.0 대신 오너가 고정한 v0.34.2. 비용: 최신 수정 지연;
    # 탈출구: 회귀/라이선스 검증 후 VERSIONS.md와 digest를 함께 갱신.
    image: quay.io/prometheus/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    port: 9093
    storage: 256Mi
    extraEgress: []
    # D-ALERT-3: 외부 수신 채널은 미결정, 기본 null 수신자. 비용: 자동 통지 없음;
    # 탈출구: 오너 승인 후 이 값에 route/receivers를 추가(자격증명은 별도 Secret 설계).
    config:
      route:
        receiver: "null"
        group_by: [alertname, namespace]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
      receivers:
        - name: "null"
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    port: 3000
    storage: 1Gi

# D-MCAT-3: all shipped profiles include Keycloak/OpenFGA/Lakekeeper + Manager.
# D-MCAT-7: enabled together with the Manager image built from ea27200 (the first image that
# understands the client-credentials reader). Escape hatch: set false (data assets fall back
# to stub) — do not enable with an older image pin.
managerCatalogReader:
  enabled: true
